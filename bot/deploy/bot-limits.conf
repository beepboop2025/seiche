# A crash-loop must be able to reach the failed state. With the shipped
# StartLimitIntervalSec=10s and RestartSec=10s the burst was mathematically
# unreachable, so no unit could ever fail and no OnFailure alert could fire.
# Safe to stop retrying now that fleet-watchdog.timer pages on silence.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Environment=PYTHONUNBUFFERED=1
