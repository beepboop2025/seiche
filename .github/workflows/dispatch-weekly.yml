name: dispatch-weekly

# The Monday flagship: "The Week Ahead" (backend/seiche/dispatch_weekly.py).
# A numbered weekly issue with forward tables and pre-registered calls printed
# in advance, which the following Monday's issue grades. Deterministic, no LLM.
# Commits the issue to main, then explicitly dispatches publish (site rebuild)
# and deploy-hetzner (box picks up the continuation), because pushes made with
# GITHUB_TOKEN do not trigger workflows on their own.
#
# Runs 105 minutes BEFORE dispatch-daily so its publish run finishes before the
# daily triggers its own: publish.yml is cancel-in-progress, so an overlapping
# trigger would cancel this job's watch step after the issue was already pushed.
#
# Fail-loud: the job builds its own board (same as dispatch-daily since
# a61ea7e — the box being up AND current must not gate the writing, least of
# all for the issue that GRADES last week's calls), and the generator refuses
# a stale board rather than grade the calls against the wrong week.

on:
  schedule:
    - cron: "0 9 * * 1" # 09:00 UTC Monday, before the daily letter at 10:45
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dispatch-weekly
  cancel-in-progress: false

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    # 75, same reason as the daily: the job watches publish.yml to completion
    # before announcing, and a short cap cancelled every run after the push.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The weekly used to read api.seiche.info live, the exact box-staleness
      # dependency a61ea7e removed from the daily — worse here, because this
      # is the artifact that GRADES the pre-registered calls, and a stale box
      # would grade them against the wrong week. Build the board in the job,
      # same as the daily and publish.yml.
      - name: Install backend
        run: pip install -e "./backend[dev]"

      - name: Build the board
        run: python backend/scripts/export_public.py /tmp/pub.json /tmp/overview.json

      - name: Write this week's issue
        run: PYTHONPATH=backend python -m seiche.dispatch_weekly --snapshot /tmp/overview.json

      - name: Commit and push
        run: |
          git config user.name "seiche-desk"
          git config user.email "desk@seiche.info"
          git add frontend/public/dispatches backend/seiche/dispatches
          if git diff --cached --quiet; then
            echo "nothing new to publish this week"
            exit 0
          fi
          TITLE=$(python -c "import json; print(json.load(open('frontend/public/dispatches/index.json'))[0]['title'])")
          git commit -m "week ahead: $TITLE"
          git pull --rebase origin main
          git push origin main
          TARGET_SHA=$(git rev-parse --verify "HEAD^{commit}")
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pushed dispatch target is not a canonical commit SHA"
            exit 1
          fi
          printf 'TARGET_SHA=%s\nPUSHED=1\n' "$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Trigger site publish + box deploy
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "${TARGET_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::exact pushed dispatch target is missing or invalid"
            exit 1
          fi
          gh workflow run publish.yml --ref main
          gh workflow run deploy-hetzner.yml --ref main --raw-field target_sha="$TARGET_SHA"

      # Wait for the site to actually carry the issue before telling Telegram
      # about it -- an announcement with a dead link is worse than a late one.
      - name: Wait for the site publish
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          RUN=$(gh run list --workflow=publish.yml --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$RUN" --exit-status --interval 30

      - name: Announce on Telegram
        if: env.PUSHED == '1'
        env:
          SEICHE_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEICHE_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Same board the issue was written from, not a fresh read: the digest
        # must match the issue it links to.
        run: PYTHONPATH=backend python -m seiche.dispatch_weekly --announce-only --snapshot /tmp/overview.json
