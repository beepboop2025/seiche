name: publish-static

# Fast path: passthrough files in frontend/public/ (support page, QR assets,
# robots.txt, …) go straight to the live seiche-site repo without waiting for
# the ~40-minute engine build. Data plus the dispatch, discovery and methodology
# surfaces are owned by the full publish pipeline and are never touched here —
# copying repository snapshots over them would regress the live evidence cut.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-static.yml"
      - "frontend/public/**"
      - "!frontend/public/data/**"
      - "ops/release/verify_catalog_publication.py"
      - "ops/release/verify_public_dataset.py"

permissions:
  contents: read

concurrency:
  group: publish-static
  cancel-in-progress: true

jobs:
  copy-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.12"

      - name: Fetch the exact declared release tag
        run: |
          set -euo pipefail
          version="$(python -I -S - <<'PY'
          import json
          from pathlib import Path

          print(json.loads(Path("server.json").read_text())["version"])
          PY
          )"
          corpus_version="$(python -I -S - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("frontend/public/.well-known/ai-catalog.json").read_text())
          matches = [
              entry for entry in catalog["entries"]
              if entry.get("identifier") == "urn:air:seiche.info:mcp:market-corpus"
          ]
          if len(matches) != 1:
              raise SystemExit("Market Atlas catalog entry is not unique")
          print(matches[0]["version"])
          PY
          )"
          corpus_receipt_tag="$(python -I -S - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("frontend/public/.well-known/ai-catalog.json").read_text())
          matches = [
              entry for entry in catalog["entries"]
              if entry.get("identifier") == "urn:air:seiche.info:mcp:market-corpus"
          ]
          if len(matches) != 1:
              raise SystemExit("Market Atlas catalog entry is not unique")
          receipt = json.loads(matches[0]["metadata"]["publicationReceipt"])
          print(receipt["tag"])
          PY
          )"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$corpus_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$corpus_receipt_tag" =~ ^market-corpus-receipt-corpus-[0-9a-f]{16}$ ]]
          git fetch --force --no-tags origin \
            "+refs/tags/v${version}:refs/tags/v${version}" \
            "+refs/tags/market-corpus-v${corpus_version}:refs/tags/market-corpus-v${corpus_version}" \
            "+refs/tags/${corpus_receipt_tag}:refs/tags/${corpus_receipt_tag}"

      - name: Gate catalog on the signed release, runtime, and PyPI receipts
        env:
          RELEASE_SIGNING_KEY_FINGERPRINT: ${{ vars.RELEASE_SIGNING_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          verifier="${RUNNER_TEMP}/verify_catalog_publication.py"
          git show "${GITHUB_SHA}:ops/release/verify_catalog_publication.py" >"$verifier"
          test "$(git hash-object "$verifier")" = "$(git rev-parse "${GITHUB_SHA}:ops/release/verify_catalog_publication.py")"
          python -I -S "$verifier" \
            --root . \
            --expected-sha "$GITHUB_SHA" \
            --signer-fingerprint "$RELEASE_SIGNING_KEY_FINGERPRINT"

      - name: Push static files to the live site repo
        env:
          DEPLOY_KEY: ${{ secrets.SEICHE_SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/site_key
          chmod 600 ~/.ssh/site_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:beepboop2025/seiche-site.git /tmp/site
          rsync -a --exclude data/ --exclude dispatches/ --exclude sitemap.xml --exclude llms.txt --exclude llms-full.txt --exclude methodology.html --exclude skeptic.html --exclude ampleness.html --exclude referee.html frontend/public/ /tmp/site/
          cd /tmp/site
          git config user.name "seiche-publish"
          git config user.email "noreply@seiche"
          git add -A
          if git diff --cached --quiet; then
            echo "mirror already contains the static files"
          else
            git commit -q -m "static fast-path $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin main || (git pull --rebase -q origin main && git push -q origin main)
          fi
          mkdir -p /tmp/cloudflare-site
          rsync -a --delete --exclude .git /tmp/site/ /tmp/cloudflare-site/

      # seiche.info is served by Cloudflare Pages, while seiche-site is the
      # durable GitHub mirror. Deploy the just-updated mirror so passthrough
      # pages do not remain 404 until the next full engine rebuild. The mirror
      # already contains the latest generated surfaces; their source snapshots
      # are excluded above, so this fast path cannot replace them with stale
      # repository fixtures.
      - name: Deploy static fast path to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: pages deploy /tmp/cloudflare-site --project-name=seiche --branch=main

      - name: Prove the canonical dataset landing and DCAT catalog are live
        run: >-
          python ops/release/verify_public_dataset.py
          --expected-root /tmp/cloudflare-site
          --cache-key "$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
