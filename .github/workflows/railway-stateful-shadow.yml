name: railway-stateful-shadow

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: "Committed backup-v4 snapshot, for example 20260823T010203Z"
        required: true
        type: string
      source_inventory_sha256:
        description: "SHA-256 of the snapshot SHA256SUMS bytes"
        required: true
        type: string
      source_content_set_sha256:
        description: "Backup-v4 closed content-set SHA-256"
        required: true
        type: string
      source_release_receipt_sha256:
        description: "Exact live release-receipt SHA-256"
        required: true
        type: string
      source_recovery_receipt_sha256:
        description: "Exact recovery-seal receipt SHA-256"
        required: true
        type: string
      confirm_shadow_policy:
        description: "Phase 4 never starts workers or receives public traffic"
        required: true
        type: choice
        options:
          - HETZNER_REMAINS_SOLE_WRITER

permissions:
  contents: read

concurrency:
  group: railway-stateful-shadow
  cancel-in-progress: false

jobs:
  restore-shadow:
    if: github.repository == 'beepboop2025/seiche'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: railway-stateful-migration
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the exact main identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build the canonical shadow request
        id: request
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          SOURCE_INVENTORY_SHA256: ${{ inputs.source_inventory_sha256 }}
          SOURCE_CONTENT_SET_SHA256: ${{ inputs.source_content_set_sha256 }}
          SOURCE_RELEASE_RECEIPT_SHA256: ${{ inputs.source_release_receipt_sha256 }}
          SOURCE_RECOVERY_RECEIPT_SHA256: ${{ inputs.source_recovery_receipt_sha256 }}
          CONFIRM_SHADOW_POLICY: ${{ inputs.confirm_shadow_policy }}
          UPLOAD_ROOT: ${{ runner.temp }}/railway-stateful-upload
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = beepboop2025/seiche
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_SHADOW_POLICY" = HETZNER_REMAINS_SOLE_WRITER
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SNAPSHOT_ID" =~ ^20[0-9]{6}T[0-9]{6}Z$ ]]
          for digest in \
            "$SOURCE_INVENTORY_SHA256" "$SOURCE_CONTENT_SET_SHA256" \
            "$SOURCE_RELEASE_RECEIPT_SHA256" \
            "$SOURCE_RECOVERY_RECEIPT_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=no)"

          tree=$(git rev-parse 'HEAD^{tree}')
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$UPLOAD_ROOT"
          git archive --format=tar "$GITHUB_SHA" >"$UPLOAD_ROOT/source.tar"
          git bundle create "$UPLOAD_ROOT/source.bundle" HEAD
          git bundle verify "$UPLOAD_ROOT/source.bundle"
          test "$(git bundle list-heads "$UPLOAD_ROOT/source.bundle")" = \
            "$GITHUB_SHA HEAD"
          source_archive_sha256=$(sha256sum "$UPLOAD_ROOT/source.tar" | awk '{print $1}')
          source_bundle_sha256=$(sha256sum "$UPLOAD_ROOT/source.bundle" | awk '{print $1}')
          request_id=$(printf '%s\n' \
            "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_SHA:$SNAPSHOT_ID:shadow" |
            sha256sum | awk '{print $1}')
          requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cp ops/railway/Dockerfile.stateful "$UPLOAD_ROOT/Dockerfile"
          cp ops/railway/railway.stateful.json "$UPLOAD_ROOT/railway.json"
          TARGET="$GITHUB_SHA" TREE="$tree" \
            SOURCE_ARCHIVE_SHA256="$source_archive_sha256" \
            SOURCE_BUNDLE_SHA256="$source_bundle_sha256" \
            REQUEST_ID="$request_id" REQUESTED_AT="$requested_at" \
            REQUEST_PATH="$UPLOAD_ROOT/request.json" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "seiche.railway-stateful-shadow-request.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": (
                  "beepboop2025/seiche/"
                  ".github/workflows/railway-stateful-shadow.yml"
              ),
              "source_ref": os.environ["GITHUB_REF"],
              "commit": os.environ["TARGET"],
              "tree": os.environ["TREE"],
              "source_archive_sha256": os.environ["SOURCE_ARCHIVE_SHA256"],
              "source_bundle_sha256": os.environ["SOURCE_BUNDLE_SHA256"],
              "request_id": os.environ["REQUEST_ID"],
              "operation": "shadow",
              "snapshot_id": os.environ["SNAPSHOT_ID"],
              "source_revision": os.environ["TARGET"],
              "source_inventory_sha256": os.environ[
                  "SOURCE_INVENTORY_SHA256"
              ],
              "source_content_set_sha256": os.environ[
                  "SOURCE_CONTENT_SET_SHA256"
              ],
              "source_release_receipt_sha256": os.environ[
                  "SOURCE_RELEASE_RECEIPT_SHA256"
              ],
              "source_recovery_receipt_sha256": os.environ[
                  "SOURCE_RECOVERY_RECEIPT_SHA256"
              ],
              "source_writers_frozen": False,
              "public_traffic_enabled": False,
              "requested_at": os.environ["REQUESTED_AT"],
          }
          Path(os.environ["REQUEST_PATH"]).write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          test "$(find "$UPLOAD_ROOT" -maxdepth 1 -type f | wc -l)" -eq 5
          {
            echo "request_id=$request_id"
            echo "target=$GITHUB_SHA"
            echo "tree=$tree"
            echo "upload_root=$UPLOAD_ROOT"
          } >>"$GITHUB_OUTPUT"

      - name: Install the checksum-pinned Railway CLI
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/railway-v5.43.1-linux-amd64.tar.gz"
          tool_dir="${RUNNER_TEMP}/railway-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/railwayapp/cli/releases/download/v5.43.1/railway-v5.43.1-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo '88fb44b35b74ded67d383fe6f8b69161d8cc4ca5e3f9b8c6c338293f65f52ee9  '"$archive" |
            sha256sum --check --strict
          test "$(tar -tzf "$archive")" = railway
          tar -xzf "$archive" -C "$tool_dir" railway
          chmod 0755 "$tool_dir/railway"
          echo "$tool_dir" >>"$GITHUB_PATH"
          "$tool_dir/railway" --version

      - name: Prove the isolated service, volume, and database prerequisites
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_STATEFUL_VOLUME_ID }}
          CONTROL_ROOT: ${{ runner.temp }}/railway-stateful-control
        run: |
          set -euo pipefail
          for value in \
            "$RAILWAY_TOKEN" "$RAILWAY_PROJECT_ID" \
            "$RAILWAY_ENVIRONMENT_ID" "$RAILWAY_SERVICE_ID" \
            "$RAILWAY_VOLUME_ID"; do
            test -n "$value"
          done
          mkdir -p "$CONTROL_ROOT"
          chmod 0700 "$CONTROL_ROOT"
          cd "$CONTROL_ROOT"
          railway volume --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" list --json >volumes.json
          EXPECTED_VOLUME_ID="$RAILWAY_VOLUME_ID" VOLUMES=volumes.json \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["VOLUMES"]).read_text())
          compact = json.dumps(value, sort_keys=True, separators=(",", ":"))
          if compact.count(os.environ["EXPECTED_VOLUME_ID"]) != 1:
              raise SystemExit("the exact stateful volume is not uniquely attached")
          if "/var/lib/seiche-platform" not in compact:
              raise SystemExit("the stateful volume mount path is not exact")
          PY
          railway domain list --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" --json >domains.json
          DOMAINS=domains.json python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["DOMAINS"]).read_text())
          if isinstance(value, dict) and set(value) == {"domains"}:
              value = value["domains"]
          if value != []:
              raise SystemExit("Phase 4 stateful service must not have a public domain")
          PY
          railway variable list --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --json >variables.json
          VARIABLES=variables.json python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["VARIABLES"]).read_text())
          if isinstance(value, dict):
              database_url = value.get("DATABASE_URL")
          elif isinstance(value, list):
              matches = [
                  item.get("value")
                  for item in value
                  if isinstance(item, dict) and item.get("name") == "DATABASE_URL"
              ]
              database_url = matches[0] if len(matches) == 1 else None
          else:
              database_url = None
          if not isinstance(database_url, str) or not database_url.strip():
              raise SystemExit(
                  "stateful service has no non-empty Railway PostgreSQL reference"
              )
          PY
          rm -f variables.json
          railway variable set \
            "SEICHE_RAILWAY_VOLUME_ID=$RAILWAY_VOLUME_ID" \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --skip-deploys >/dev/null

      - name: Apply the exact shadow service manifest
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
        run: |
          set -euo pipefail
          manifest_variables=$(RAILWAY_ENVIRONMENT_ID="$RAILWAY_ENVIRONMENT_ID" \
            RAILWAY_SERVICE_ID="$RAILWAY_SERVICE_ID" python3 -I -S - <<'PY'
          import json
          import os

          print(json.dumps({
              "serviceId": os.environ["RAILWAY_SERVICE_ID"],
              "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
              "input": {
                  "healthcheckPath": "/healthz",
                  "healthcheckTimeout": 3600,
                  "restartPolicyType": "NEVER",
              },
          }, separators=(",", ":")))
          PY
          )
          # GraphQL variable names are literal, not shell expansions.
          # shellcheck disable=SC2016
          railway api \
            'mutation ApplyShadowManifest($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }' \
            --variables "$manifest_variables" \
            >"${RUNNER_TEMP}/stateful-manifest-update.json"
          MANIFEST_UPDATE="${RUNNER_TEMP}/stateful-manifest-update.json" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["MANIFEST_UPDATE"]).read_text())
          if value.get("errors") or value.get("data", {}).get(
              "serviceInstanceUpdate"
          ) is not True:
              raise SystemExit("shadow service manifest update was not accepted")
          PY
          rm -f "${RUNNER_TEMP}/stateful-manifest-update.json"

      - name: Deploy the exact shadow runtime
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          UPLOAD_ROOT: ${{ steps.request.outputs.upload_root }}
        run: |
          set -euo pipefail
          deployment_json=$(railway up "$UPLOAD_ROOT" --path-as-root --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "seiche-stateful-shadow:$GITHUB_SHA:${{ inputs.snapshot_id }}:$GITHUB_RUN_ID")
          deployment_id=$(DEPLOYMENT_JSON="$deployment_json" python3 -I -S - <<'PY'
          import json
          import os
          import re

          value = json.loads(os.environ["DEPLOYMENT_JSON"])
          if not isinstance(value, dict) or set(value) != {"deploymentId", "logsUrl"}:
              raise SystemExit("Railway upload returned an invalid response")
          identity = value["deploymentId"]
          if re.fullmatch(
              r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-"
              r"[89ab][0-9a-f]{3}-[0-9a-f]{12}",
              identity,
          ) is None:
              raise SystemExit("Railway upload returned an invalid deployment ID")
          print(identity)
          PY
          )
          echo "deployment_id=$deployment_id" >>"$GITHUB_OUTPUT"

      - name: Wait for the exact shadow deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          status=""
          for _attempt in $(seq 1 360); do
            if ! railway deployment list --project "$RAILWAY_PROJECT_ID" \
                --service "$RAILWAY_SERVICE_ID" \
                --environment "$RAILWAY_ENVIRONMENT_ID" \
                --limit 100 --json >"${RUNNER_TEMP}/stateful-deployments.json"; then
              echo "Railway deployment poll $_attempt/360 failed; retrying" >&2
              sleep 10
              continue
            fi
            status=$(DEPLOYMENT_ID="$DEPLOYMENT_ID" \
              STATUS_PATH="${RUNNER_TEMP}/stateful-deployments.json" \
              python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          values = json.loads(Path(os.environ["STATUS_PATH"]).read_text())
          matches = [
              value for value in values
              if isinstance(value, dict) and value.get("id") == os.environ["DEPLOYMENT_ID"]
          ]
          if len(matches) != 1 or not isinstance(matches[0].get("status"), str):
              raise SystemExit("exact Railway shadow deployment disappeared")
          print(matches[0]["status"].upper())
          PY
            )
            case "$status" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED|REMOVING)
                echo "Railway shadow deployment ended in $status" >&2
                railway logs "$DEPLOYMENT_ID" --service "$RAILWAY_SERVICE_ID" \
                  --project "$RAILWAY_PROJECT_ID" \
                  --environment "$RAILWAY_ENVIRONMENT_ID" --lines 1000 || true
                exit 1
                ;;
              BUILDING|DEPLOYING|INITIALIZING|WAITING|QUEUED) sleep 10 ;;
              *) echo "unknown Railway deployment state: $status" >&2; exit 1 ;;
            esac
          done
          test "$status" = SUCCESS

      - name: Prove the exact healthy Railway deployment
        id: initial_runtime
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          query_variables=$(RAILWAY_ENVIRONMENT_ID="$RAILWAY_ENVIRONMENT_ID" \
            RAILWAY_SERVICE_ID="$RAILWAY_SERVICE_ID" \
            DEPLOYMENT_ID="$DEPLOYMENT_ID" python3 -I -S - <<'PY'
          import json
          import os

          print(json.dumps({
              "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
              "serviceId": os.environ["RAILWAY_SERVICE_ID"],
              "deploymentId": os.environ["DEPLOYMENT_ID"],
          }, separators=(",", ":")))
          PY
          )
          # GraphQL variable names are literal, not shell expansions.
          # shellcheck disable=SC2016
          railway api \
            'query Runtime($serviceId: String!, $environmentId: String!, $deploymentId: String!) { serviceInstance(serviceId: $serviceId, environmentId: $environmentId) { healthcheckPath healthcheckTimeout restartPolicyType domains { customDomains { domain targetPort } serviceDomains { domain targetPort } } latestDeployment { id status instances { id status } } activeDeployments { id status instances { id status } } } deployment(id: $deploymentId) { id projectId environmentId serviceId status instances { id status } } }' \
            --variables "$query_variables" \
            >"${RUNNER_TEMP}/stateful-runtime-initial.json"
          RUNTIME_PATH="${RUNNER_TEMP}/stateful-runtime-initial.json" \
            DEPLOYMENT_ID="$DEPLOYMENT_ID" \
            RAILWAY_PROJECT_ID="$RAILWAY_PROJECT_ID" \
            RAILWAY_ENVIRONMENT_ID="$RAILWAY_ENVIRONMENT_ID" \
            RAILWAY_SERVICE_ID="$RAILWAY_SERVICE_ID" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          value = json.loads(Path(os.environ["RUNTIME_PATH"]).read_text())
          try:
              service = value["data"]["serviceInstance"]
              deployment = value["data"]["deployment"]
          except (KeyError, TypeError):
              raise SystemExit("exact Railway runtime response is malformed") from None
          manifest = {
              "healthcheckPath": "/healthz",
              "healthcheckTimeout": 3600,
              "restartPolicyType": "NEVER",
              "domains": {"customDomains": [], "serviceDomains": []},
          }
          if {key: service.get(key) for key in manifest} != manifest:
              raise SystemExit("exact Railway service manifest differs")
          identity = {
              "id": os.environ["DEPLOYMENT_ID"],
              "projectId": os.environ["RAILWAY_PROJECT_ID"],
              "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
              "serviceId": os.environ["RAILWAY_SERVICE_ID"],
          }
          if {key: deployment.get(key) for key in identity} != identity:
              raise SystemExit("exact Railway deployment identity differs")
          active = service.get("activeDeployments")
          latest = service.get("latestDeployment")
          candidates = [deployment, latest]
          if not isinstance(active, list) or len(active) != 1:
              raise SystemExit("Railway service does not have one active deployment")
          candidates.extend(active)
          instance_ids = set()
          for candidate in candidates:
              if (
                  not isinstance(candidate, dict)
                  or candidate.get("id") != os.environ["DEPLOYMENT_ID"]
                  or candidate.get("status") != "SUCCESS"
                  or not isinstance(candidate.get("instances"), list)
                  or len(candidate["instances"]) != 1
                  or candidate["instances"][0].get("status") != "RUNNING"
              ):
                  raise SystemExit("exact Railway deployment is not singly RUNNING")
              instance_id = candidate["instances"][0].get("id")
              if not isinstance(instance_id, str) or re.fullmatch(
                  r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-"
                  r"[89ab][0-9a-f]{3}-[0-9a-f]{12}",
                  instance_id,
              ) is None:
                  raise SystemExit("Railway deployment instance ID is invalid")
              instance_ids.add(instance_id)
          if len(instance_ids) != 1:
              raise SystemExit("Railway deployment instance identity is inconsistent")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"replica_id={instance_ids.pop()}\n")
          PY

      - name: Reconstruct and independently validate the created receipt
        id: evidence
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_STATEFUL_VOLUME_ID }}
          RAILWAY_VOLUME_NAME: ${{ secrets.RAILWAY_STATEFUL_VOLUME_NAME }}
          RAILWAY_REPLICA_REGION: ${{ secrets.RAILWAY_STATEFUL_REGION }}
          RAILWAY_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          RAILWAY_REPLICA_ID: ${{ steps.initial_runtime.outputs.replica_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          UPLOAD_ROOT: ${{ steps.request.outputs.upload_root }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/railway-stateful-shadow-receipt.json"
          log_path="${RUNNER_TEMP}/railway-stateful-shadow-created.ndjson"
          marker_count=0
          for _attempt in $(seq 1 60); do
            rm -f "$log_path"
            if ! railway logs "$RAILWAY_DEPLOYMENT_ID" \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --deployment --json --lines 1000 >"$log_path"; then
              echo "Railway exact-deployment log poll $_attempt/60 failed" >&2
              sleep 5
              continue
            fi
            marker_count=$(grep -c \
              'SEICHE_RAILWAY_STATEFUL_SHADOW_RESULT_V1=' "$log_path" || true)
            case "$marker_count" in
              0) sleep 5 ;;
              *) break ;;
            esac
          done
          test "$marker_count" -ge 1
          PYTHONPATH=backend LOG_PATH="$log_path" RECEIPT_PATH="$receipt" \
            REQUEST_ID="$REQUEST_ID" \
            RAILWAY_DEPLOYMENT_ID="$RAILWAY_DEPLOYMENT_ID" \
            RAILWAY_REPLICA_ID="$RAILWAY_REPLICA_ID" \
            python3 -B - <<'PY'
          import os
          from pathlib import Path

          from seiche.stateful_migration import extract_log_results

          results = extract_log_results(
              Path(os.environ["LOG_PATH"]).read_bytes(),
              expected_request_id=os.environ["REQUEST_ID"],
              expected_deployment_id=os.environ["RAILWAY_DEPLOYMENT_ID"],
              expected_replicas={"created": os.environ["RAILWAY_REPLICA_ID"]},
          )
          Path(os.environ["RECEIPT_PATH"]).write_bytes(
              results["created"].receipt_body
          )
          PY
          PYTHONPATH=backend python3 -B -m seiche.stateful_migration \
            verify-receipt \
            --request "$UPLOAD_ROOT/request.json" \
            --source-archive "$UPLOAD_ROOT/source.tar" \
            --source-bundle "$UPLOAD_ROOT/source.bundle" \
            --receipt "$receipt" >"${RUNNER_TEMP}/receipt.sha256"
          receipt_sha256=$(cat "${RUNNER_TEMP}/receipt.sha256")
          [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "$receipt_sha256  $receipt" | sha256sum --check --strict
          cp "$receipt" "${RUNNER_TEMP}/shadow-receipt.json"
          echo "receipt_path=${RUNNER_TEMP}/shadow-receipt.json" >>"$GITHUB_OUTPUT"
          echo "receipt_sha256=$receipt_sha256" >>"$GITHUB_OUTPUT"

      - name: Restart the same deployment and prove exact receipt reuse
        id: restart_proof
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          RAILWAY_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          restart_not_before=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          restart_json=$(railway restart --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --yes --json)
          RESTART_JSON="$restart_json" \
            RAILWAY_DEPLOYMENT_ID="$RAILWAY_DEPLOYMENT_ID" \
            python3 -I -S - <<'PY'
          import json
          import os

          value = json.loads(os.environ["RESTART_JSON"])
          if value != {"id": os.environ["RAILWAY_DEPLOYMENT_ID"]}:
              raise SystemExit("Railway restarted a different deployment")
          PY

          log_path="${RUNNER_TEMP}/railway-stateful-shadow-reused.ndjson"
          marker_count=0
          for _attempt in $(seq 1 120); do
            rm -f "$log_path"
            if ! railway logs "$RAILWAY_DEPLOYMENT_ID" \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --deployment --json --lines 1000 >"$log_path"; then
              echo "Railway restart log poll $_attempt/120 failed" >&2
              sleep 5
              continue
            fi
            marker_count=$(grep -c \
              'SEICHE_RAILWAY_STATEFUL_SHADOW_RESULT_V1=' "$log_path" || true)
            case "$marker_count" in
              0|1) sleep 5 ;;
              *) break ;;
            esac
          done
          test "$marker_count" -ge 2
          echo "restart_not_before=$restart_not_before" >>"$GITHUB_OUTPUT"
          echo "log_path=$log_path" >>"$GITHUB_OUTPUT"

      - name: Prove the reused runtime is singly RUNNING
        id: reused_runtime
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          query_variables=$(RAILWAY_ENVIRONMENT_ID="$RAILWAY_ENVIRONMENT_ID" \
            RAILWAY_SERVICE_ID="$RAILWAY_SERVICE_ID" \
            DEPLOYMENT_ID="$DEPLOYMENT_ID" python3 -I -S - <<'PY'
          import json
          import os

          print(json.dumps({
              "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
              "serviceId": os.environ["RAILWAY_SERVICE_ID"],
              "deploymentId": os.environ["DEPLOYMENT_ID"],
          }, separators=(",", ":")))
          PY
          )
          ready=false
          for _attempt in $(seq 1 60); do
            # GraphQL variable names are literal, not shell expansions.
            # shellcheck disable=SC2016
            if ! railway api \
              'query Runtime($serviceId: String!, $environmentId: String!, $deploymentId: String!) { serviceInstance(serviceId: $serviceId, environmentId: $environmentId) { healthcheckPath healthcheckTimeout restartPolicyType domains { customDomains { domain targetPort } serviceDomains { domain targetPort } } latestDeployment { id status instances { id status } } activeDeployments { id status instances { id status } } } deployment(id: $deploymentId) { id projectId environmentId serviceId status instances { id status } } }' \
              --variables "$query_variables" \
              >"${RUNNER_TEMP}/stateful-runtime-reused.json"; then
              sleep 5
              continue
            fi
            state=$(RUNTIME_PATH="${RUNNER_TEMP}/stateful-runtime-reused.json" \
              DEPLOYMENT_ID="$DEPLOYMENT_ID" \
              RAILWAY_PROJECT_ID="$RAILWAY_PROJECT_ID" \
              RAILWAY_ENVIRONMENT_ID="$RAILWAY_ENVIRONMENT_ID" \
              RAILWAY_SERVICE_ID="$RAILWAY_SERVICE_ID" \
              python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RUNTIME_PATH"]).read_text())
          try:
              service = value["data"]["serviceInstance"]
              deployment = value["data"]["deployment"]
          except (KeyError, TypeError):
              raise SystemExit("reused Railway runtime response is malformed") from None
          manifest = {
              "healthcheckPath": "/healthz",
              "healthcheckTimeout": 3600,
              "restartPolicyType": "NEVER",
              "domains": {"customDomains": [], "serviceDomains": []},
          }
          if {key: service.get(key) for key in manifest} != manifest:
              raise SystemExit("reused Railway service manifest differs")
          identity = {
              "id": os.environ["DEPLOYMENT_ID"],
              "projectId": os.environ["RAILWAY_PROJECT_ID"],
              "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
              "serviceId": os.environ["RAILWAY_SERVICE_ID"],
          }
          if {key: deployment.get(key) for key in identity} != identity:
              raise SystemExit("reused Railway deployment identity differs")
          latest = service.get("latestDeployment")
          active = service.get("activeDeployments")
          if not isinstance(latest, dict) or latest.get("id") != identity["id"]:
              raise SystemExit("another Railway deployment became latest")
          if not isinstance(active, list):
              raise SystemExit("Railway active-deployment response is malformed")
          if any(item.get("id") != identity["id"] for item in active):
              raise SystemExit("another Railway deployment became active")
          candidates = [deployment, latest, *active]
          terminal = {"CRASHED", "EXITED", "REMOVED", "REMOVING", "STOPPED"}
          if any(item.get("status") in terminal for item in candidates):
              raise SystemExit("reused Railway deployment entered a terminal state")
          if len(active) != 1:
              print("WAIT")
          elif all(
              item.get("status") == "SUCCESS"
              and isinstance(item.get("instances"), list)
              and len(item["instances"]) == 1
              and item["instances"][0].get("status") == "RUNNING"
              for item in candidates
          ):
              instance_ids = {
                  item["instances"][0].get("id") for item in candidates
              }
              if len(instance_ids) != 1 or not all(instance_ids):
                  raise SystemExit("reused Railway instance identity is inconsistent")
              instance_id = instance_ids.pop()
              print(f"READY:{instance_id}")
          else:
              print("WAIT")
          PY
            )
            if [[ "$state" = READY:* ]]; then
              replica_id=${state#READY:}
              ready=true
              break
            fi
            test "$state" = WAIT
            sleep 5
          done
          test "$ready" = true
          [[ "$replica_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          echo "replica_id=$replica_id" >>"$GITHUB_OUTPUT"

      - name: Validate the byte-identical reused receipt
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          RAILWAY_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          CREATED_REPLICA_ID: ${{ steps.initial_runtime.outputs.replica_id }}
          REUSED_REPLICA_ID: ${{ steps.reused_runtime.outputs.replica_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          RECEIPT_PATH: ${{ steps.evidence.outputs.receipt_path }}
          EXPECTED_RECEIPT_SHA256: ${{ steps.evidence.outputs.receipt_sha256 }}
          RESTART_NOT_BEFORE: ${{ steps.restart_proof.outputs.restart_not_before }}
          LOG_PATH: ${{ steps.restart_proof.outputs.log_path }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_STATEFUL_VOLUME_ID }}
          RAILWAY_VOLUME_NAME: ${{ secrets.RAILWAY_STATEFUL_VOLUME_NAME }}
          RAILWAY_REPLICA_REGION: ${{ secrets.RAILWAY_STATEFUL_REGION }}
          UPLOAD_ROOT: ${{ steps.request.outputs.upload_root }}
        run: |
          set -euo pipefail
          rm -f "$LOG_PATH"
          railway logs "$RAILWAY_DEPLOYMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --deployment --json --lines 1000 >"$LOG_PATH"
          PYTHONPATH=backend python3 -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          from seiche.stateful_migration import (
              extract_log_results,
              rfc3339_utc_nanoseconds,
          )

          results = extract_log_results(
              Path(os.environ["LOG_PATH"]).read_bytes(),
              expected_request_id=os.environ["REQUEST_ID"],
              expected_deployment_id=os.environ["RAILWAY_DEPLOYMENT_ID"],
              expected_replicas={
                  "created": os.environ["CREATED_REPLICA_ID"],
                  "reused": os.environ["REUSED_REPLICA_ID"],
              },
          )
          retained = Path(os.environ["RECEIPT_PATH"]).read_bytes()
          if (
              results["created"].receipt_body != retained
              or results["reused"].receipt_body != retained
              or results["created"].receipt_sha256
              != os.environ["EXPECTED_RECEIPT_SHA256"]
              or results["reused"].receipt_sha256
              != os.environ["EXPECTED_RECEIPT_SHA256"]
              or hashlib.sha256(retained).hexdigest()
              != os.environ["EXPECTED_RECEIPT_SHA256"]
          ):
              raise SystemExit("restart/reuse receipt bytes differ")
          boundary = rfc3339_utc_nanoseconds(
              os.environ["RESTART_NOT_BEFORE"],
              label="restart not-before boundary",
          )
          if results["reused"].logged_at_unix_ns <= boundary:
              raise SystemExit("reused receipt marker predates the restart boundary")
          PY
          PYTHONPATH=backend python3 -B -m seiche.stateful_migration \
            verify-receipt \
            --request "$UPLOAD_ROOT/request.json" \
            --source-archive "$UPLOAD_ROOT/source.tar" \
            --source-bundle "$UPLOAD_ROOT/source.bundle" \
            --receipt "$RECEIPT_PATH" >"${RUNNER_TEMP}/reused-receipt.sha256"
          test "$(cat "${RUNNER_TEMP}/reused-receipt.sha256")" = \
            "$EXPECTED_RECEIPT_SHA256"

      - name: Retain the private canonical migration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-stateful-shadow-${{ steps.request.outputs.target }}-${{ inputs.snapshot_id }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 90

      - name: OIDC-attest the exact private receipt bytes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.evidence.outputs.receipt_path }}
