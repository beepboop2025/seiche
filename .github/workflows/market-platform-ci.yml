name: market-platform-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - "ops/**"
      - ".github/workflows/market-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: seiche
          POSTGRES_PASSWORD: seiche-test-only
          POSTGRES_DB: seiche_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seiche -d seiche_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SEICHE_TEST_POSTGRES_URL: postgresql://seiche:seiche-test-only@127.0.0.1:5432/seiche_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Caddy config adapter
        # Match the production adapter; verify the official release's SHA-512.
        env:
          CADDY_VERSION: "2.11.4"
          CADDY_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
        run: |
          archive="$RUNNER_TEMP/caddy.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$CADDY_SHA512" "$archive" | sha512sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" caddy
          install -D -m 0755 "$RUNNER_TEMP/caddy" "$HOME/.local/bin/caddy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install market platform
        run: pip install -e "./backend[dev,collectors,postgres]"
      - name: Run market architecture and PostgreSQL contracts
        run: >-
          python -m pytest -q
          backend/tests/test_market_packs.py
          backend/tests/test_global_money_market_atlas.py
          backend/tests/test_money_market.py
          backend/tests/test_money_market_integration.py
          backend/tests/test_korea_krw_pack.py
          backend/tests/test_korea_official_adapter.py
          backend/tests/test_canonical_store.py
          backend/tests/test_repository_v2.py
          backend/tests/test_postgres_market_repository.py
          backend/tests/test_collectors_v2.py
          backend/tests/test_universal_kernel.py
          backend/tests/test_market_materialize.py
          backend/tests/test_official_adapters.py
          backend/tests/test_api_v2_markets.py
          backend/tests/test_mcp_server.py
          backend/tests/test_mcp_http.py
          backend/tests/test_deploy_release.py
          backend/tests/test_market_backup.py
          backend/tests/test_world_model_delivery.py
          backend/tests/test_fleet_watchdog.py
          backend/tests/test_fleet_mac_heartbeat.py
