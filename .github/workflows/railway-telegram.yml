      - name: Seal the frozen migration canary outside Railway
        id: offsite
        env:
          S3_ENDPOINT: ${{ secrets.SEICHE_OFFSITE_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.SEICHE_OFFSITE_S3_BUCKET }}
          S3_PREFIX: ${{ secrets.SEICHE_OFFSITE_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SEICHE_OFFSITE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SEICHE_OFFSITE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SEICHE_OFFSITE_S3_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
          REQUEST_ID: ${{ steps.freeze.outputs.request_id }}
          SNAPSHOT_ID: ${{ steps.freeze.outputs.snapshot_id }}
          EVIDENCE_ROOT: ${{ steps.freeze.outputs.evidence_root }}
        run: |
          set -euo pipefail
          cd "$EVIDENCE_ROOT"
          S3_ENDPOINT="$S3_ENDPOINT" S3_BUCKET="$S3_BUCKET" S3_PREFIX="$S3_PREFIX" \
            python3 -I -S - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          endpoint = urlsplit(os.environ["S3_ENDPOINT"])
          if (
              endpoint.scheme != "https"
              or not endpoint.hostname
              or endpoint.username is not None
              or endpoint.password is not None
              or endpoint.query
              or endpoint.fragment
              or endpoint.hostname.endswith(".railway.app")
          ):
              raise SystemExit("Telegram off-site endpoint is invalid")
          if re.fullmatch(r"[a-z0-9][a-z0-9.-]{1,62}", os.environ["S3_BUCKET"]) is None:
              raise SystemExit("Telegram off-site bucket is invalid")
          prefix = os.environ["S3_PREFIX"]
          if (
              re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]{0,200}", prefix) is None
              or prefix.startswith("/")
              or prefix.endswith("/")
              or ".." in prefix.split("/")
          ):
              raise SystemExit("Telegram off-site prefix is invalid")
          PY
          retain_until=$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%SZ)
          key_root="$S3_PREFIX/telegram/$SNAPSHOT_ID/$REQUEST_ID"
          mkdir offsite-heads
          printf '%s\n' metadata.json fence.json state.json transfer.json \
            candidate.json native-candidate-backup.json seiche-bot.tgz \
            >offsite-members.txt
          while IFS= read -r name; do
            digest=$(sha256sum "$name" | awk '{print $1}')
            size=$(stat -c %s "$name")
            test "$size" -le 5368709120
            checksum=$(printf '%s' "$digest" | xxd -r -p | base64 -w0)
            key="$key_root/$name"
            aws --endpoint-url "$S3_ENDPOINT" s3api put-object \
              --bucket "$S3_BUCKET" --key "$key" --body "$name" \
              --server-side-encryption AES256 --metadata "sha256=$digest" \
              --checksum-algorithm SHA256 --checksum-sha256 "$checksum" \
              --object-lock-mode COMPLIANCE \
              --object-lock-retain-until-date "$retain_until" \
              >"offsite-heads/$name.put.json"
            aws --endpoint-url "$S3_ENDPOINT" s3api head-object \
              --bucket "$S3_BUCKET" --key "$key" --checksum-mode ENABLED \
              >"offsite-heads/$name.json"
            NAME="$name" DIGEST="$digest" CHECKSUM="$checksum" SIZE="$size" \
              python3 -I -S - <<'PY'
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          value = json.loads(Path("offsite-heads", os.environ["NAME"] + ".json").read_text())
          retained = datetime.fromisoformat(
              str(value.get("ObjectLockRetainUntilDate", "")).replace("Z", "+00:00")
          ).astimezone(UTC)
          if (
              value.get("ContentLength") != int(os.environ["SIZE"])
              or value.get("Metadata", {}).get("sha256") != os.environ["DIGEST"]
              or value.get("ChecksumSHA256") != os.environ["CHECKSUM"]
              or not isinstance(value.get("VersionId"), str)
              or not value["VersionId"]
              or value.get("ObjectLockMode") != "COMPLIANCE"
              or value.get("ServerSideEncryption") != "AES256"
              or retained < datetime.now(UTC) + timedelta(days=29)
          ):
              raise SystemExit("Telegram off-site object proof failed")
          PY
          done <offsite-members.txt
          S3_BUCKET="$S3_BUCKET" S3_PREFIX="$S3_PREFIX" \
            RETAIN_UNTIL="$retain_until" python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          objects = {}
          for name in Path("offsite-members.txt").read_text().splitlines():
              head = json.loads(Path("offsite-heads", name + ".json").read_text())
              path = Path(name)
              objects[name] = {
                  "key": (
                      f"{os.environ['S3_PREFIX']}/telegram/{os.environ['SNAPSHOT_ID']}/"
                      f"{os.environ['REQUEST_ID']}/{name}"
                  ),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
                  "version_id": head["VersionId"],
              }
          value = {
              "schema": "seiche.railway-telegram-offsite-receipt.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "request_id": os.environ["REQUEST_ID"],
              "snapshot_id": os.environ["SNAPSHOT_ID"],
              "bucket": os.environ["S3_BUCKET"],
              "prefix": os.environ["S3_PREFIX"],
              "object_lock_mode": "COMPLIANCE",
              "retain_until": os.environ["RETAIN_UNTIL"],
              "objects": objects,
              "sealed_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace(
                  "+00:00", "Z"
              ),
              "authority_changed": False,
          }
          Path("offsite-receipt.json").write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY
          echo "receipt_path=$EVIDENCE_ROOT/offsite-receipt.json" >>"$GITHUB_OUTPUT"

      - name: Remove subscriber-bearing bytes from the Actions workspace
        if: always()
