          if [ -n "${EVIDENCE_ROOT:-}" ] && [ -d "$EVIDENCE_ROOT" ]; then
            find "$EVIDENCE_ROOT" -maxdepth 1 -type f -name 'seiche-bot.tgz' -delete
          fi

      - name: Roll back Hetzner automatically if candidate sealing failed
        if: failure() && steps.freeze.outputs.request_id != ''
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_TELEGRAM_MIGRATION_USER }}
          REQUEST_ID: ${{ steps.freeze.outputs.request_id }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/telegram_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "rollback $REQUEST_ID RESTORE_HETZNER_TELEGRAM_BEFORE_GRANT" || true

      - name: Retain private candidate evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-telegram-candidate-${{ steps.freeze.outputs.request_id }}
          path: |
            ${{ steps.freeze.outputs.evidence_root }}/metadata.json
            ${{ steps.freeze.outputs.evidence_root }}/fence.json
            ${{ steps.freeze.outputs.evidence_root }}/state.json
            ${{ steps.freeze.outputs.evidence_root }}/image-request.json
            ${{ steps.freeze.outputs.evidence_root }}/transfer.json
            ${{ steps.freeze.outputs.evidence_root }}/candidate.json
            ${{ steps.freeze.outputs.evidence_root }}/native-candidate-backup.json
            ${{ steps.freeze.outputs.evidence_root }}/offsite-receipt.json
            ${{ steps.freeze.outputs.evidence_root }}/offsite-heads
          retention-days: 90

      - name: Attest the candidate receipt
        if: success()
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.candidate.outputs.candidate_path }}

      - name: Attest the immutable off-site receipt
        if: success()
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.offsite.outputs.receipt_path }}

      - name: Publish the exact activation inputs
        if: success()
        env:
          REQUEST_ID: ${{ steps.freeze.outputs.request_id }}
          SNAPSHOT_ID: ${{ steps.freeze.outputs.snapshot_id }}
          DEPLOYMENT_ID: ${{ steps.candidate.outputs.deployment_id }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha256 }}
        run: |
          {
            echo "### Railway Telegram candidate ready"
            echo
            echo "- Request: \`$REQUEST_ID\`"
            echo "- Snapshot: \`$SNAPSHOT_ID\`"
            echo "- Deployment: \`$DEPLOYMENT_ID\`"
            echo "- Candidate receipt SHA-256: \`$CANDIDATE_SHA\`"
            echo "- Hetzner remains frozen; Railway has not received authority."
            echo "- Activate or roll back before the four-hour fence expires."
          } >>"$GITHUB_STEP_SUMMARY"

  activate:
    if: >-
      github.repository == 'beepboop2025/seiche' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'activate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: railway-telegram-activation
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the exact main identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the checksum-pinned Railway CLI
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/railway-v5.43.1-linux-amd64.tar.gz"
          tool_dir="${RUNNER_TEMP}/railway-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/railwayapp/cli/releases/download/v5.43.1/railway-v5.43.1-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo '88fb44b35b74ded67d383fe6f8b69161d8cc4ca5e3f9b8c6c338293f65f52ee9  '"$archive" |
            sha256sum --check --strict
          test "$(tar -tzf "$archive")" = railway
          tar -xzf "$archive" -C "$tool_dir" railway
          chmod 0755 "$tool_dir/railway"
          echo "$tool_dir" >>"$GITHUB_PATH"

      - name: Reconstruct the frozen candidate and publish one authority grant
        id: activate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_TELEGRAM_SERVICE_ID }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_TELEGRAM_VOLUME_ID }}
          RAILWAY_ORIGIN: ${{ secrets.RAILWAY_TELEGRAM_ORIGIN }}
          SEICHE_BOT_TOKEN: ${{ secrets.SEICHE_BOT_TOKEN }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_TELEGRAM_MIGRATION_USER }}
          HETZNER_KEY: ${{ secrets.HETZNER_TELEGRAM_MIGRATION_SSH_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_receipt_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVIDENCE_ROOT: ${{ runner.temp }}/railway-telegram-activation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = RAILWAY_BECOMES_SOLE_TELEGRAM_CONSUMER
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SNAPSHOT_ID" =~ ^20[0-9]{6}T[0-9]{6}Z$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RAILWAY_ORIGIN" =~ ^https://[a-z0-9][a-z0-9.-]{1,251}\.up\.railway\.app$ ]]
          for value in \
            "$RAILWAY_TOKEN" "$RAILWAY_PROJECT_ID" "$RAILWAY_ENVIRONMENT_ID" \
            "$RAILWAY_SERVICE_ID" "$RAILWAY_VOLUME_ID" "$SEICHE_BOT_TOKEN" \
            "$HETZNER_HOST" "$HETZNER_USER" "$HETZNER_KEY"; do
            test -n "$value"
          done
          mkdir -p "$EVIDENCE_ROOT/link" "$HOME/.ssh"
          chmod 0700 "$EVIDENCE_ROOT" "$EVIDENCE_ROOT/link" "$HOME/.ssh"
          printf '%s\n' "$HETZNER_KEY" >"$HOME/.ssh/telegram_key"
          chmod 0600 "$HOME/.ssh/telegram_key"
          printf '%s\n' \
            "$HETZNER_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKAeD2Er1pFiZR4FPkgY5FeoNhXHy36kDDRCZMUVzABL" \
            >"$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/telegram_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$HETZNER_USER@$HETZNER_HOST" "status $REQUEST_ID" \
            >"$EVIDENCE_ROOT/hetzner-status.json"
          cd "$EVIDENCE_ROOT/link"
          railway link --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" --json >link.json
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 "$RAILWAY_ORIGIN/healthz" \
            >"$EVIDENCE_ROOT/health-before.json"
          railway volume files download --volume "$RAILWAY_VOLUME_ID" \
            "/transfers/$REQUEST_ID.json" "$EVIDENCE_ROOT/transfer.json"
          railway volume files download --volume "$RAILWAY_VOLUME_ID" \
            "/candidates/$SNAPSHOT_ID-$REQUEST_ID.json" \
            "$EVIDENCE_ROOT/candidate.json"
          observed_candidate=$(PYTHONPATH="$GITHUB_WORKSPACE/backend" python3 -B \
            -m seiche.telegram_migration validate-candidate \
            "$EVIDENCE_ROOT/candidate.json" \
            --request "$EVIDENCE_ROOT/transfer.json")
          test "$observed_candidate" = "$CANDIDATE_SHA"
          EXPECTED_DEPLOYMENT="$DEPLOYMENT_ID" \
            HEALTH="$EVIDENCE_ROOT/health-before.json" \
            REQUEST="$EVIDENCE_ROOT/transfer.json" \
            STATUS="$EVIDENCE_ROOT/hetzner-status.json" python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          health = json.loads(Path(os.environ["HEALTH"]).read_text())
          request = json.loads(Path(os.environ["REQUEST"]).read_text())
          status_body = Path(os.environ["STATUS"]).read_bytes()
          status = json.loads(status_body)
          canonical_status = (
              json.dumps(status, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode()
          fence_body = (
              json.dumps(request["fence"], sort_keys=True, separators=(",", ":"))
              + "\n"
          ).encode()
          expected_status_keys = {
              "schema", "request_id", "commit", "snapshot_id",
              "archive_sha256", "fence_sha256", "metadata_sha256",
              "activation_sha256", "source_frozen", "authority",
          }
          activation_sha = status.get("activation_sha256")
          if (
              health.get("status") != "ready"
              or health.get("mode") not in {"candidate", "granted", "production"}
              or health.get("commit") != os.environ["GITHUB_SHA"]
              or health.get("deployment_id") != os.environ["EXPECTED_DEPLOYMENT"]
              or health.get("request_id") != os.environ["REQUEST_ID"]
              or request.get("commit") != os.environ["GITHUB_SHA"]
              or request.get("railway", {}).get("deployment_id")
              != os.environ["EXPECTED_DEPLOYMENT"]
              or status_body != canonical_status
              or set(status) != expected_status_keys
              or status.get("schema") != "seiche.hetzner-telegram-status.v1"
              or status.get("request_id") != os.environ["REQUEST_ID"]
              or status.get("request_id") != request.get("request_id")
              or status.get("commit") != os.environ["GITHUB_SHA"]
              or status.get("snapshot_id") != os.environ["SNAPSHOT_ID"]
              or status.get("snapshot_id") != request.get("snapshot_id")
              or status.get("archive_sha256") != request.get("archive_sha256")
              or status.get("fence_sha256")
              != hashlib.sha256(fence_body).hexdigest()
              or not isinstance(status.get("metadata_sha256"), str)
              or len(status["metadata_sha256"]) != 64
              or any(
                  character not in "0123456789abcdef"
                  for character in status["metadata_sha256"]
              )
              or status.get("source_frozen") is not True
              or status.get("authority") not in {"hetzner-frozen", "railway"}
              or (
                  status.get("authority") == "hetzner-frozen"
                  and activation_sha is not None
              )
              or (
                  status.get("authority") == "railway"
                  and (
                      not isinstance(activation_sha, str)
                      or len(activation_sha) != 64
                      or any(
                          character not in "0123456789abcdef"
                          for character in activation_sha
                      )
                  )
              )
          ):
              raise SystemExit("Telegram activation target identity differs")
          PY
          if railway volume files download --volume "$RAILWAY_VOLUME_ID" \
              "/grants/$REQUEST_ID.json" "$EVIDENCE_ROOT/grant.json" 2>/dev/null; then
            test -s "$EVIDENCE_ROOT/grant.json"
          else
            activated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            bot_token_sha=$(printf '%s' "$SEICHE_BOT_TOKEN" | sha256sum | awk '{print $1}')
            ACTIVATED_AT="$activated_at" BOT_TOKEN_SHA="$bot_token_sha" \
              python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          candidate_body = root.joinpath("candidate.json").read_bytes()
          request = json.loads(root.joinpath("transfer.json").read_bytes())
          value = {
              "schema": "seiche.railway-telegram-authority-grant.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "beepboop2025/seiche/.github/workflows/railway-telegram.yml",
              "commit": os.environ["GITHUB_SHA"],
              "request_id": os.environ["REQUEST_ID"],
              "candidate_receipt_sha256": hashlib.sha256(candidate_body).hexdigest(),
              "bot_token_sha256": os.environ["BOT_TOKEN_SHA"],
              "activated_at": os.environ["ACTIVATED_AT"],
              "confirmation": "RAILWAY_BECOMES_SOLE_TELEGRAM_CONSUMER",
          }
          if value["bot_token_sha256"] != request["bot_token_sha256"]:
              raise SystemExit("Telegram token changed since candidate restore")
          root.joinpath("grant.json").write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY
            grant_b64=$(base64 -w0 "$EVIDENCE_ROOT/grant.json")
            published=$(railway ssh --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$RAILWAY_SERVICE_ID" -- \
              python -I -B /workspace/ops/railway/run-telegram-migration.py \
                publish-grant "$grant_b64")
            test "$published" = "$REQUEST_ID"
          fi
          proof_remote="/worker-proofs/$REQUEST_ID.json"
          activation_remote="/activations/$SNAPSHOT_ID-$REQUEST_ID.json"
          ready=0
          for _attempt in $(seq 1 120); do
            proof_attempt="$EVIDENCE_ROOT/proof-attempt-${_attempt}.json"
            activation_attempt="$EVIDENCE_ROOT/activation-attempt-${_attempt}.json"
            if railway volume files download --volume "$RAILWAY_VOLUME_ID" \
                "$proof_remote" "$proof_attempt" 2>/dev/null && \
               railway volume files download --volume "$RAILWAY_VOLUME_ID" \
                "$activation_remote" "$activation_attempt" 2>/dev/null; then
              mv "$proof_attempt" "$EVIDENCE_ROOT/worker-proof.json"
              mv "$activation_attempt" "$EVIDENCE_ROOT/activation.json"
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1
          activation_sha=$(PYTHONPATH="$GITHUB_WORKSPACE/backend" python3 -B \
            -m seiche.telegram_migration validate-activation \
            "$EVIDENCE_ROOT/activation.json" \
            --request "$EVIDENCE_ROOT/transfer.json" \
            --candidate "$EVIDENCE_ROOT/candidate.json" \
            --grant "$EVIDENCE_ROOT/grant.json" \
            --proof "$EVIDENCE_ROOT/worker-proof.json")
          [[ "$activation_sha" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 "$RAILWAY_ORIGIN/healthz" \
            >"$EVIDENCE_ROOT/health-after.json"
          EXPECTED_DEPLOYMENT="$DEPLOYMENT_ID" REQUEST_ID="$REQUEST_ID" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["EVIDENCE_ROOT"] + "/health-after.json").read_text())
          if (
              value.get("status") != "ready"
              or value.get("mode") != "production"
              or value.get("commit") != os.environ["GITHUB_SHA"]
              or value.get("deployment_id") != os.environ["EXPECTED_DEPLOYMENT"]
              or value.get("request_id") != os.environ["REQUEST_ID"]
              or value.get("faults") != []
          ):
              raise SystemExit("Railway Telegram production health is invalid")
          PY
          ssh -i "$HOME/.ssh/telegram_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "acknowledge $REQUEST_ID $activation_sha" \
            <"$EVIDENCE_ROOT/activation.json" \
            >"$EVIDENCE_ROOT/hetzner-acknowledgement.json"
          echo "activation_path=$EVIDENCE_ROOT/activation.json" >>"$GITHUB_OUTPUT"
          {
            echo "### Railway Telegram activated"
            echo
            echo "- Request: \`$REQUEST_ID\`"
            echo "- Deployment: \`$DEPLOYMENT_ID\`"
            echo "- Activation SHA-256: \`$activation_sha\`"
            echo "- Hetzner acknowledged and remains persistently masked."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Retain private activation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-telegram-activation-${{ inputs.request_id }}
          path: ${{ runner.temp }}/railway-telegram-activation
          retention-days: 90

      - name: Attest the Telegram activation receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.activate.outputs.activation_path }}

  rollback:
    if: >-
      github.repository == 'beepboop2025/seiche' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: railway-telegram-rollback
    steps:
      - name: Install the checksum-pinned Railway CLI
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/railway-v5.43.1-linux-amd64.tar.gz"
          tool_dir="${RUNNER_TEMP}/railway-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/railwayapp/cli/releases/download/v5.43.1/railway-v5.43.1-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo '88fb44b35b74ded67d383fe6f8b69161d8cc4ca5e3f9b8c6c338293f65f52ee9  '"$archive" |
            sha256sum --check --strict
          test "$(tar -tzf "$archive")" = railway
          tar -xzf "$archive" -C "$tool_dir" railway
          chmod 0755 "$tool_dir/railway"
          echo "$tool_dir" >>"$GITHUB_PATH"

      - name: Prove no grant exists and restore Hetzner
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_TELEGRAM_SERVICE_ID }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_TELEGRAM_VOLUME_ID }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_TELEGRAM_MIGRATION_USER }}
          HETZNER_KEY: ${{ secrets.HETZNER_TELEGRAM_MIGRATION_SSH_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = RESTORE_HETZNER_TELEGRAM_BEFORE_GRANT
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$HOME/.ssh" "$RUNNER_TEMP/railway-telegram-rollback"
          chmod 0700 "$HOME/.ssh" "$RUNNER_TEMP/railway-telegram-rollback"
          printf '%s\n' "$HETZNER_KEY" >"$HOME/.ssh/telegram_key"
          chmod 0600 "$HOME/.ssh/telegram_key"
          printf '%s\n' \
            "$HETZNER_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKAeD2Er1pFiZR4FPkgY5FeoNhXHy36kDDRCZMUVzABL" \
            >"$HOME/.ssh/known_hosts"
          railway link --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" --json \
            >"$RUNNER_TEMP/railway-telegram-rollback/link.json"
          railway volume files list --volume "$RAILWAY_VOLUME_ID" \
            /grants --json \
            >"$RUNNER_TEMP/railway-telegram-rollback/grants.json"
          GRANTS="$RUNNER_TEMP/railway-telegram-rollback/grants.json" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          listing = json.loads(Path(os.environ["GRANTS"]).read_text())
          if isinstance(listing, list):
              rows = listing
          elif listing in ({}, None):
              rows = []
          elif isinstance(listing, dict):
              containers = [
                  listing[key]
                  for key in ("files", "entries", "items")
                  if key in listing
              ]
              rows = containers[0] if len(containers) == 1 else None
          else:
              rows = None
          if rows != []:
              raise SystemExit(
                  "A Railway Telegram grant exists; rollback is forbidden."
              )
          PY
          ssh -i "$HOME/.ssh/telegram_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "rollback $REQUEST_ID RESTORE_HETZNER_TELEGRAM_BEFORE_GRANT" \
            >"$RUNNER_TEMP/railway-telegram-rollback/result.json"

  monitor:
    if: >-
      github.repository == 'beepboop2025/seiche' &&
      ((github.event_name == 'schedule' &&
        vars.RAILWAY_TELEGRAM_PHASE7_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'monitor'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: railway-telegram-monitor
    steps:
      - name: Check out the exact default-branch identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the checksum-pinned Railway CLI
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/railway-v5.43.1-linux-amd64.tar.gz"
          tool_dir="${RUNNER_TEMP}/railway-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/railwayapp/cli/releases/download/v5.43.1/railway-v5.43.1-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo '88fb44b35b74ded67d383fe6f8b69161d8cc4ca5e3f9b8c6c338293f65f52ee9  '"$archive" |
            sha256sum --check --strict
          test "$(tar -tzf "$archive")" = railway
          tar -xzf "$archive" -C "$tool_dir" railway
          chmod 0755 "$tool_dir/railway"
          echo "$tool_dir" >>"$GITHUB_PATH"

      - name: Prove one active poller, current receipts, and native recovery
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_TELEGRAM_SERVICE_ID }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_TELEGRAM_VOLUME_ID }}
          RAILWAY_ORIGIN: ${{ secrets.RAILWAY_TELEGRAM_ORIGIN }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_TELEGRAM_MONITOR_USER }}
          HETZNER_KEY: ${{ secrets.HETZNER_TELEGRAM_MONITOR_SSH_KEY }}
          EVIDENCE_ROOT: ${{ runner.temp }}/railway-telegram-monitor
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          mkdir -p "$EVIDENCE_ROOT/link" "$HOME/.ssh"
          chmod 0700 "$EVIDENCE_ROOT" "$EVIDENCE_ROOT/link" "$HOME/.ssh"
          cd "$EVIDENCE_ROOT/link"
          railway link --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" --json >link.json
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 "$RAILWAY_ORIGIN/healthz" \
            >"$EVIDENCE_ROOT/health.json"
          REQUEST_ID=$(HEALTH="$EVIDENCE_ROOT/health.json" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["HEALTH"]).read_text())
          if (
              value.get("schema") != "seiche.railway-telegram-health.v1"
              or value.get("status") != "ready"
              or value.get("mode") != "production"
              or not isinstance(value.get("commit"), str)
