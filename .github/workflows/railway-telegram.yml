name: railway-telegram

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Prepare, migrate, roll back before grant, or monitor Telegram"
        required: true
        type: choice
        options:
          - prepare-service
          - candidate
          - activate
          - rollback
          - monitor
      request_id:
        description: "Activate/rollback: exact 64-hex transfer request ID"
        required: false
        type: string
      snapshot_id:
        description: "Activate: exact candidate snapshot ID"
        required: false
        type: string
      deployment_id:
        description: "Activate: exact Railway candidate deployment UUID"
        required: false
        type: string
      candidate_receipt_sha256:
        description: "Activate: accepted canonical candidate receipt digest"
        required: false
        type: string
      confirmation:
        description: "Exact operation-specific confirmation"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: railway-telegram
  cancel-in-progress: false

jobs:
  prepare-service:
    if: >-
      github.repository == 'beepboop2025/seiche' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'prepare-service'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: railway-telegram-admin
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the exact main identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the checksum-pinned Railway CLI
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/railway-v5.43.1-linux-amd64.tar.gz"
          tool_dir="${RUNNER_TEMP}/railway-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/railwayapp/cli/releases/download/v5.43.1/railway-v5.43.1-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo '88fb44b35b74ded67d383fe6f8b69161d8cc4ca5e3f9b8c6c338293f65f52ee9  '"$archive" |
            sha256sum --check --strict
          test "$(tar -tzf "$archive")" = railway
          tar -xzf "$archive" -C "$tool_dir" railway
          chmod 0755 "$tool_dir/railway"
          echo "$tool_dir" >>"$GITHUB_PATH"

      - name: Prove the isolated service and deploy the exact candidate image
        id: prepare
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_TELEGRAM_SERVICE_ID }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_TELEGRAM_VOLUME_ID }}
          RAILWAY_VOLUME_NAME: ${{ secrets.RAILWAY_TELEGRAM_VOLUME_NAME }}
          RAILWAY_REPLICA_REGION: ${{ secrets.RAILWAY_TELEGRAM_REGION }}
          RAILWAY_ORIGIN: ${{ secrets.RAILWAY_TELEGRAM_ORIGIN }}
          SEICHE_BOT_TOKEN: ${{ secrets.SEICHE_BOT_TOKEN }}
          LAB_CHANNEL_ID: ${{ secrets.SEICHE_LAB_CHANNEL_ID }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVIDENCE_ROOT: ${{ runner.temp }}/railway-telegram-prepare
          UPLOAD_ROOT: ${{ runner.temp }}/railway-telegram-upload
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = PREPARE_NON_AUTHORITATIVE_TELEGRAM_SERVICE
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=no)"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RAILWAY_ORIGIN" =~ ^https://[a-z0-9][a-z0-9.-]{1,251}\.up\.railway\.app$ ]]
          for value in \
            "$RAILWAY_TOKEN" "$RAILWAY_PROJECT_ID" "$RAILWAY_ENVIRONMENT_ID" \
            "$RAILWAY_SERVICE_ID" "$RAILWAY_VOLUME_ID" "$RAILWAY_VOLUME_NAME" \
            "$RAILWAY_REPLICA_REGION" "$SEICHE_BOT_TOKEN" "$LAB_CHANNEL_ID"; do
            test -n "$value"
          done
          [[ "$LAB_CHANNEL_ID" =~ ^-100[0-9]{6,16}$ ]]
          mkdir -p "$EVIDENCE_ROOT/link" "$UPLOAD_ROOT"
          chmod 0700 "$EVIDENCE_ROOT" "$EVIDENCE_ROOT/link" "$UPLOAD_ROOT"
          cd "$EVIDENCE_ROOT/link"
          railway link --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" --json >link.json
          railway volume list --json >volumes.json
          railway domain list --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" --json >domains.json
          EXPECTED_VOLUME_ID="$RAILWAY_VOLUME_ID" \
            EXPECTED_VOLUME_NAME="$RAILWAY_VOLUME_NAME" ORIGIN="$RAILWAY_ORIGIN" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from urllib.parse import urlsplit

          volumes = json.loads(Path("volumes.json").read_text())
          compact = json.dumps(volumes, sort_keys=True, separators=(",", ":"))
          if compact.count(os.environ["EXPECTED_VOLUME_ID"]) != 1:
              raise SystemExit("the exact Telegram volume is not unique")
          if compact.count(os.environ["EXPECTED_VOLUME_NAME"]) < 1:
              raise SystemExit("the Telegram volume name is absent")
          if "/var/lib/seiche-telegram" not in compact:
              raise SystemExit("the Telegram volume mount is not exact")
          domains = json.loads(Path("domains.json").read_text())
          domain_text = json.dumps(domains, sort_keys=True, separators=(",", ":"))
          observed = set(
              re.findall(r"[a-z0-9][a-z0-9.-]+\.up\.railway\.app", domain_text)
          )
          if observed != {urlsplit(os.environ["ORIGIN"]).hostname}:
              raise SystemExit("the Telegram origin is not uniquely configured")
          PY
          railway deployment list --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --json \
            >"$EVIDENCE_ROOT/deployments-before.json"
          has_success=$(INPUT="$EVIDENCE_ROOT/deployments-before.json" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(Path(os.environ["INPUT"]).read_text())
          print(int(any(str(row.get("status", "")).upper() == "SUCCESS" for row in rows)))
          PY
          )
          pre_status=000
          if observed_status=$(curl --silent --show-error \
              --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 10 \
              --output "$EVIDENCE_ROOT/pre-health.json" --write-out '%{http_code}' \
              "$RAILWAY_ORIGIN/healthz"); then
            pre_status=$observed_status
          fi
          if [ "$has_success" = 1 ]; then
            test "$pre_status" = 200 || test "$pre_status" = 503
          fi
          if [ "$pre_status" = 200 ] || [ "$pre_status" = 503 ]; then
            HEALTH="$EVIDENCE_ROOT/pre-health.json" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["HEALTH"]).read_text())
          if (
              value.get("schema") != "seiche.railway-telegram-health.v1"
              or value.get("mode") != "candidate"
              or value.get("request_id") is not None
          ):
              raise SystemExit(
                  "an authoritative Telegram service cannot be prepared in place"
              )
          PY
          fi
          railway variable set \
            "SEICHE_RELEASE_SHA=$GITHUB_SHA" \
            "SEICHE_RAILWAY_TELEGRAM_VOLUME_ID=$RAILWAY_VOLUME_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --skip-deploys >/dev/null
          printf '%s' "$SEICHE_BOT_TOKEN" |
            railway variable set SEICHE_BOT_TOKEN --stdin \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --skip-deploys >/dev/null
          printf '%s' "$LAB_CHANNEL_ID" |
            railway variable set LAB_CHANNEL_ID --stdin \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --skip-deploys >/dev/null
          railway variable list --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --json >variables.json
          python3 -I -S - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("variables.json").read_text())
          names = set(value) if isinstance(value, dict) else {
              row.get("name") for row in value if isinstance(row, dict)
          }
          required = {
              "SEICHE_RELEASE_SHA",
              "SEICHE_RAILWAY_TELEGRAM_VOLUME_ID",
              "SEICHE_BOT_TOKEN",
              "LAB_CHANNEL_ID",
          }
          forbidden = {
              "HETZNER_SSH_KEY",
              "HETZNER_TELEGRAM_MIGRATION_SSH_KEY",
              "RAILWAY_TOKEN",
              "GITHUB_TOKEN",
              "SEICHE_OFFSITE_S3_SECRET_ACCESS_KEY",
              "DATABASE_URL",
              "HETZNER_DATABASE_URL",
              "NBS_SIGNING_KEY",
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
          }
          if (
              not required.issubset(names)
              or names & forbidden
              or any(
                  isinstance(name, str) and name.endswith("_SSH_KEY")
                  for name in names
              )
          ):
              raise SystemExit("Telegram service secret boundary is invalid")
          PY
          rm -f variables.json
          cd "$GITHUB_WORKSPACE"
          git archive --format=tar "$GITHUB_SHA" >"$UPLOAD_ROOT/source.tar"
          git bundle create "$UPLOAD_ROOT/source.bundle" "$GITHUB_SHA"
          git bundle verify "$UPLOAD_ROOT/source.bundle"
          source_archive_sha256=$(sha256sum "$UPLOAD_ROOT/source.tar" | awk '{print $1}')
          source_bundle_sha256=$(sha256sum "$UPLOAD_ROOT/source.bundle" | awk '{print $1}')
          tree=$(git rev-parse 'HEAD^{tree}')
          requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          image_request_id=$(printf '%s\n' \
            "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_SHA:telegram-image" |
            sha256sum | awk '{print $1}')
          cp ops/railway/Dockerfile.telegram "$UPLOAD_ROOT/Dockerfile"
          cp ops/railway/railway.telegram.json "$UPLOAD_ROOT/railway.json"
          TARGET="$GITHUB_SHA" TREE="$tree" \
            SOURCE_ARCHIVE_SHA256="$source_archive_sha256" \
            SOURCE_BUNDLE_SHA256="$source_bundle_sha256" \
            REQUEST_ID="$image_request_id" REQUESTED_AT="$requested_at" \
            REQUEST_PATH="$UPLOAD_ROOT/request.json" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = {
              "schema": "seiche.railway-telegram-image-request.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "beepboop2025/seiche/.github/workflows/railway-telegram.yml",
              "source_ref": os.environ["GITHUB_REF"],
              "commit": os.environ["TARGET"],
              "tree": os.environ["TREE"],
              "source_archive_sha256": os.environ["SOURCE_ARCHIVE_SHA256"],
              "source_bundle_sha256": os.environ["SOURCE_BUNDLE_SHA256"],
              "request_id": os.environ["REQUEST_ID"],
              "requested_at": os.environ["REQUESTED_AT"],
              "confirmation": "PREPARE_NON_AUTHORITATIVE_TELEGRAM_SERVICE",
          }
          Path(os.environ["REQUEST_PATH"]).write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY
          REQUEST="$UPLOAD_ROOT/request.json" PYTHONPATH=backend python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          from seiche.telegram_migration import validate_image_request

          validate_image_request(json.loads(Path(os.environ["REQUEST"]).read_bytes()))
          PY
          deployment_json=$(railway up "$UPLOAD_ROOT" --path-as-root --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID")
          printf '%s\n' "$deployment_json" >"$EVIDENCE_ROOT/deployment.json"
          deployment_id=$(DEPLOYMENT_JSON="$deployment_json" python3 -I -S - <<'PY'
          import json
          import os
          import re

          value = json.loads(os.environ["DEPLOYMENT_JSON"])
          matches = re.findall(
              r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-"
              r"[89ab][0-9a-f]{3}-[0-9a-f]{12}",
              json.dumps(value),
          )
          if len(set(matches)) != 1:
              raise SystemExit("Telegram deployment identity is ambiguous")
          print(matches[0])
          PY
          )
          ready=0
          for _attempt in $(seq 1 90); do
            railway deployment list --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --json \
              >"$EVIDENCE_ROOT/deployments.json"
            status=$(DEPLOYMENT_ID="$deployment_id" \
              INPUT="$EVIDENCE_ROOT/deployments.json" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(Path(os.environ["INPUT"]).read_text())
          matches = [row for row in rows if row.get("id") == os.environ["DEPLOYMENT_ID"]]
          if len(matches) != 1:
              raise SystemExit("Telegram deployment is not unique")
          print(str(matches[0].get("status", "")).upper())
          PY
            )
            if [ "$status" = SUCCESS ]; then ready=1; break; fi
            case "$status" in FAILED|CRASHED|REMOVED) exit 1 ;; esac
            sleep 10
          done
          test "$ready" = 1
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 "$RAILWAY_ORIGIN/healthz" \
            >"$EVIDENCE_ROOT/health.json"
          DEPLOYMENT_ID="$deployment_id" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["EVIDENCE_ROOT"] + "/health.json").read_text())
          if (
              value.get("schema") != "seiche.railway-telegram-health.v1"
              or value.get("status") != "ready"
              or value.get("mode") != "candidate"
              or value.get("commit") != os.environ["GITHUB_SHA"]
              or value.get("deployment_id") != os.environ["DEPLOYMENT_ID"]
              or value.get("request_id") is not None
              or value.get("faults") != []
          ):
              raise SystemExit("Telegram candidate health is invalid")
          PY
          cp "$UPLOAD_ROOT/request.json" "$EVIDENCE_ROOT/image-request.json"
          {
            echo "deployment_id=$deployment_id"
            echo "image_request=$EVIDENCE_ROOT/image-request.json"
          } >>"$GITHUB_OUTPUT"

      - name: Configure and lock recurring native volume recovery
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_TELEGRAM_SERVICE_ID }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_TELEGRAM_VOLUME_ID }}
          EVIDENCE_ROOT: ${{ runner.temp }}/railway-telegram-prepare
        run: |
          set -euo pipefail
          cd "$EVIDENCE_ROOT/link"
          cat >volume-instances.graphql <<'GRAPHQL'
          query TelegramVolume($volumeId: String!) {
            adminVolumeInstancesForVolume(volumeId: $volumeId) {
              id volumeId environmentId serviceId mountPath deletedAt isPendingDeletion
            }
          }
          GRAPHQL
          railway api --file volume-instances.graphql \
            --raw-var "volumeId=$RAILWAY_VOLUME_ID" --compact \
            >volume-instances.json
          volume_instance_id=$(VOLUME_ID="$RAILWAY_VOLUME_ID" \
            ENVIRONMENT_ID="$RAILWAY_ENVIRONMENT_ID" \
            SERVICE_ID="$RAILWAY_SERVICE_ID" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(Path("volume-instances.json").read_text()).get(
              "data", {}
          ).get("adminVolumeInstancesForVolume", [])
          matches = [
              row for row in rows
              if row.get("volumeId") == os.environ["VOLUME_ID"]
              and row.get("environmentId") == os.environ["ENVIRONMENT_ID"]
              and row.get("serviceId") == os.environ["SERVICE_ID"]
              and row.get("mountPath") == "/var/lib/seiche-telegram"
              and row.get("deletedAt") is None
              and row.get("isPendingDeletion") is False
          ]
          if len(matches) != 1:
              raise SystemExit("the exact Telegram volume instance is not unique")
          print(matches[0]["id"])
          PY
          )
          cat >schedules.graphql <<'GRAPHQL'
          mutation TelegramSchedules(
            $volumeInstanceId: String!,
            $kinds: [VolumeInstanceBackupScheduleKind!]!
          ) {
            volumeInstanceBackupScheduleUpdate(
              volumeInstanceId: $volumeInstanceId,
              kinds: $kinds
            )
          }
          GRAPHQL
          railway api --file schedules.graphql \
            --raw-var "volumeInstanceId=$volume_instance_id" \
            --var 'kinds=["DAILY","WEEKLY","MONTHLY"]' --compact \
            >schedule-update.json
          test "$(python3 -c 'import json; print(json.load(open("schedule-update.json"))["data"]["volumeInstanceBackupScheduleUpdate"])')" = True
          canary="seiche-phase7-bootstrap-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}"
          cat >create.graphql <<'GRAPHQL'
          mutation TelegramBackup($volumeInstanceId: String!, $name: String) {
            volumeInstanceBackupCreate(volumeInstanceId: $volumeInstanceId, name: $name) {
              workflowId
            }
          }
          GRAPHQL
          cat >list.graphql <<'GRAPHQL'
          query TelegramBackups($volumeInstanceId: String!) {
            volumeInstanceBackupList(volumeInstanceId: $volumeInstanceId) {
              id name createdAt expiresAt
            }
          }
          GRAPHQL
          backup_id=""
          for _attempt in $(seq 1 60); do
            railway api --file list.graphql \
              --raw-var "volumeInstanceId=$volume_instance_id" --compact >backups.json
            backup_id=$(CANARY="$canary" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(Path("backups.json").read_text()).get("data", {}).get(
              "volumeInstanceBackupList", []
          )
          matches = [row for row in rows if row.get("name") == os.environ["CANARY"]]
          if len(matches) > 1:
              raise SystemExit("Telegram backup canary is ambiguous")
          print(matches[0]["id"] if matches else "")
          PY
            )
            test -z "$backup_id" || break
            if [ "$_attempt" -eq 1 ]; then
              railway api --file create.graphql \
                --raw-var "volumeInstanceId=$volume_instance_id" \
                --raw-var "name=$canary" --compact >create.json
            fi
            sleep 10
          done
          test -n "$backup_id"
          cat >lock.graphql <<'GRAPHQL'
          mutation LockTelegramBackup(
            $volumeInstanceId: String!,
            $volumeInstanceBackupId: String!
          ) {
            volumeInstanceBackupLock(
              volumeInstanceId: $volumeInstanceId,
              volumeInstanceBackupId: $volumeInstanceBackupId
            )
          }
          GRAPHQL
          railway api --file lock.graphql \
            --raw-var "volumeInstanceId=$volume_instance_id" \
            --raw-var "volumeInstanceBackupId=$backup_id" --compact >lock.json
          test "$(python3 -c 'import json; print(json.load(open("lock.json"))["data"]["volumeInstanceBackupLock"])')" = True
          railway api --file list.graphql \
            --raw-var "volumeInstanceId=$volume_instance_id" --compact >backups-after.json
          CANARY="$canary" python3 -I -S - <<'PY'
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          rows = json.loads(Path("backups-after.json").read_text()).get("data", {}).get(
              "volumeInstanceBackupList", []
          )
          matches = [row for row in rows if row.get("name") == os.environ["CANARY"]]
          if len(matches) != 1 or matches[0].get("expiresAt") is not None:
              raise SystemExit("Telegram backup canary is not locked")
          created = datetime.fromisoformat(matches[0]["createdAt"].replace("Z", "+00:00"))
          if not timedelta(0) <= datetime.now(UTC) - created <= timedelta(hours=2):
              raise SystemExit("Telegram backup canary is stale")
          PY
          printf '%s\n' "$backup_id" >"$EVIDENCE_ROOT/native-canary-id.txt"

      - name: Retain private preparation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-telegram-prepare-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/railway-telegram-prepare
          retention-days: 90

      - name: Attest the exact Telegram image request
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.image_request }}

  restore-candidate:
    if: >-
      github.repository == 'beepboop2025/seiche' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: railway-telegram-cutover
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the exact main identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the checksum-pinned Railway CLI
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/railway-v5.43.1-linux-amd64.tar.gz"
          tool_dir="${RUNNER_TEMP}/railway-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/railwayapp/cli/releases/download/v5.43.1/railway-v5.43.1-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo '88fb44b35b74ded67d383fe6f8b69161d8cc4ca5e3f9b8c6c338293f65f52ee9  '"$archive" |
            sha256sum --check --strict
          test "$(tar -tzf "$archive")" = railway
          tar -xzf "$archive" -C "$tool_dir" railway
          chmod 0755 "$tool_dir/railway"
          echo "$tool_dir" >>"$GITHUB_PATH"

      - name: Freeze Hetzner and retrieve the exact state
        id: freeze
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_TELEGRAM_MIGRATION_USER }}
          HETZNER_KEY: ${{ secrets.HETZNER_TELEGRAM_MIGRATION_SSH_KEY }}
          LAB_CHANNEL_ID: ${{ secrets.SEICHE_LAB_CHANNEL_ID }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVIDENCE_ROOT: ${{ runner.temp }}/railway-telegram-candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = FREEZE_HETZNER_TELEGRAM_FOR_CANDIDATE
          for value in \
