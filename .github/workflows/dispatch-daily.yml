name: dispatch-daily

# The desk's daily letter: written by the terminal from the live board, every
# claim carrying its number (backend/seiche/dispatch_daily.py — deterministic,
# no LLM). Commits the dispatch to main, then explicitly dispatches the static
# site rebuild because pushes made with GITHUB_TOKEN do not trigger workflows
# on their own. The signed release poller recognizes this narrow content-only
# commit class as intentionally inert and never executes it on the API host.
#
# Fail-loud: if the live board is unreachable there is no letter that day —
# the generator refuses to write from nothing.

on:
  schedule:
    - cron: "45 10 * * *" # 10:45 UTC — before the US open, after overnight data
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Rewrite today's letter even though it is already published. For the
          day the generator itself changes: the morning letter was written by
          the old code and the board has not moved, so the honest move is to
          reissue the same day rather than wait a cycle. It rewrites TODAY
          only, never a past date, so the archive stays as published.
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: dispatch-daily
  cancel-in-progress: false

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    # 75, not 10: the job watches publish.yml to completion (34-47 min in
    # practice) before announcing, so a 10-minute cap cancelled every run
    # after the letter was pushed and the Telegram announce never fired.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The letter used to read api.seiche.info, which made it depend on the
      # box being both up AND current. On 2026-07-28 the box spent a day
      # stranded on old code while reporting deploys green, and a letter built
      # from it would have printed the dark-engine placeholder in every new
      # section: honest, and useless. The board is a pure function of public
      # data, so this job builds its own, exactly as publish.yml already does.
      # The box serves the interactive API; it no longer gates the writing.
      - name: Install backend
        run: pip install -e "./backend[dev]"

      - name: Build the board
        run: python backend/scripts/export_public.py /tmp/pub.json /tmp/overview.json

      - name: Write today's dispatch
        env:
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=(--snapshot /tmp/overview.json)
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          PYTHONPATH=backend python -m seiche.dispatch_daily "${ARGS[@]}"

      # The dispatch is the fixed-format tape; the article is the argument.
      # A material newsroom change produces current analysis. A quiet day
      # produces a historical replay from Echo/Tide Tables instead of turning
      # persistence into fake breaking news.
      - name: Write today's article
        env:
          FORCE: ${{ inputs.force }}
          # The edition still publishes when this secret is absent, using the
          # deterministic evidence writer. Configure the shared editorial key
          # to enable the writer + standards-editor passes.
          EDITORIAL_LLM_API_KEY: ${{ secrets.EDITORIAL_LLM_API_KEY }}
          EDITORIAL_LLM_BASE_URL: ${{ vars.EDITORIAL_LLM_BASE_URL }}
          EDITORIAL_LLM_MODEL: ${{ vars.EDITORIAL_LLM_MODEL }}
          EDITORIAL_REVIEW_MODEL: ${{ vars.EDITORIAL_REVIEW_MODEL }}
          EDITORIAL_REASONING_EFFORT: ${{ vars.EDITORIAL_REASONING_EFFORT }}
        run: |
          ARGS=(--snapshot /tmp/overview.json)
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          PYTHONPATH=backend python -m seiche.article_daily "${ARGS[@]}"

      - name: Commit and push
        run: |
          git config user.name "seiche-desk"
          git config user.email "desk@seiche.info"
          git add frontend/public/dispatches frontend/public/articles backend/seiche/dispatches
          if git diff --cached --quiet; then
            echo "nothing new to publish today"
            exit 0
          fi
          TITLE=$(python -c "import json; print(json.load(open('frontend/public/dispatches/index.json'))[0]['title'])")
          git commit -m "dispatch: $TITLE"
          git pull --rebase origin main
          git push origin main
          printf 'PUSHED=1\n' >> "$GITHUB_ENV"

      - name: Trigger site publish
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main

      # Wait for the site to actually carry the letter before telling
      # Telegram about it — an announcement with a dead link is worse
      # than a late one.
      - name: Wait for the site publish
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          RUN=$(gh run list --workflow=publish.yml --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$RUN" --exit-status --interval 30

      - name: Announce on Telegram
        if: env.PUSHED == '1'
        env:
          SEICHE_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEICHE_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Same board the letter was written from, not a fresh read: the digest
        # must match the letter it links to.
        run: PYTHONPATH=backend python -m seiche.dispatch_daily --announce-only --snapshot /tmp/overview.json
