name: One-time encrypted recovery monitor credential handoff
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    if: github.repository == 'beepboop2025/seiche' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: railway-stateful-recovery-monitor
    steps:
      - name: Encrypt only for the reviewed workstation recipient
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_EDGE_TOKEN: ${{ secrets.RAILWAY_EDGE_TOKEN }}
          RAILWAY_RECOVERY_PROBE_SSH_KEY: ${{ secrets.RAILWAY_RECOVERY_PROBE_SSH_KEY }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_POSTGRES_SERVICE_ID: ${{ secrets.RAILWAY_POSTGRES_SERVICE_ID }}
          RAILWAY_STATEFUL_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          RAILWAY_STATEFUL_VOLUME_ID: ${{ secrets.RAILWAY_STATEFUL_VOLUME_ID }}
          RAILWAY_STATEFUL_ORIGIN: ${{ secrets.RAILWAY_STATEFUL_ORIGIN }}
          RAILWAY_STATEFUL_REGION: ${{ secrets.RAILWAY_STATEFUL_REGION }}
        run: |
          python3 - <<'PYENCRYPT'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          names = ['RAILWAY_TOKEN', 'RAILWAY_EDGE_TOKEN', 'RAILWAY_RECOVERY_PROBE_SSH_KEY', 'RAILWAY_PROJECT_ID', 'RAILWAY_ENVIRONMENT_ID', 'RAILWAY_POSTGRES_SERVICE_ID', 'RAILWAY_STATEFUL_SERVICE_ID', 'RAILWAY_STATEFUL_VOLUME_ID', 'RAILWAY_STATEFUL_ORIGIN', 'RAILWAY_STATEFUL_REGION']
          values = {name: os.environ.pop(name) for name in names}
          if any(not value for value in values.values()):
              raise SystemExit("Required protected migration input is absent")
          public = Path(os.environ["RUNNER_TEMP"]) / "recovery-recipient.pub"
          public.write_text('-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA13MGsRVjIHcrK4u0euKj\nsBadLIScgpinzPe0WJpuNQslQuIWQy+1hIctCAc45yTEYqeOSFzH/vmU/gxkhcrf\ne6pHiI+iRpcriTrXjCcz8t58jpIS6p0PmuH3vHP0YZ4fNE8QcYf3qTDnNNx4YvXz\nzVr7yWkVz/wx+puuiAo31Mqo8Zokuq9Obt5T2+bHnDturtpDpC33cFNYbdwJiT4M\nEoJC1saREViZ/s/2dlSBAPOwYT4oqBDFZLJGiX8Z18QmNhcQCYnhhe3W137+QiDY\nHAiLoOh52+7WDqgKdPiFp+vVL/d3XJeN4E+5MGfHIYXElkhInPXgbHWaSXBNXLaa\ntDCqrC7kgyfINonHeVK7nFGjY59crk6QdcMzUqbrWZdD4zVJn4vtBm5OHFeQdhhd\nrH7rZQUkwpEj50k36if+SFT7z7SGQvbhRxbGnAXQ/Bzu09JDVgQuEqvlOqKXlsrN\nEqDSS8p9cViYAVmFMRP+qYMiAvjg/KfWAd+fEE+eArL4bTv06wdqkpxDkvL3Drzc\npOSq61Fz+EiyobCU62thA88m3pUCMW7YifX9ropOfoJGP1OPMMdw7/LQ2KhwMhd0\nuie+PFetXL1SpUCYQDUPkU1Df47VhbY7UMBiL+G40aKJWtb4o3AE1GucQvkHIMZx\nwCb5ZO8let3DZ9mOYanmAOsCAwEAAQ==\n-----END PUBLIC KEY-----\n')
          payload = json.dumps({"source": os.environ["GITHUB_SHA"], "repository": os.environ["GITHUB_REPOSITORY"], "values": values}, sort_keys=True).encode()
          chunks = []
          for offset in range(0, len(payload), 400):
              result = subprocess.run(["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", str(public), "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256", "-pkeyopt", "rsa_mgf1_md:sha256"], input=payload[offset:offset+400], capture_output=True, env={"PATH": os.environ["PATH"]})
              if result.returncode != 0:
                  raise SystemExit("Recipient encryption failed")
              chunks.append(base64.b64encode(result.stdout).decode())
          output = Path(os.environ["RUNNER_TEMP"]) / "recovery-handoff.encrypted.json"
          output.write_text(json.dumps({"format": "ordered-rsa-oaep-sha256-chunks-v1", "source": os.environ["GITHUB_SHA"], "recipient_sha256": hashlib.sha256(public.read_bytes()).hexdigest(), "chunks": chunks}, sort_keys=True) + "\n")
          output.chmod(0o600)
          print("RECOVERY_HANDOFF_ENCRYPTED sha256=" + hashlib.sha256(output.read_bytes()).hexdigest() + " source=" + os.environ["GITHUB_SHA"])
          PYENCRYPT
      - name: Retain ciphertext for one day
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-monitor-encrypted-handoff
          path: ${{ runner.temp }}/recovery-handoff.encrypted.json
          if-no-files-found: error
          retention-days: 1
