name: deploy-hetzner

# Auto-deploy to the Hetzner box on every merge to main.
#
# Two repo secrets (Settings → Secrets → Actions):
#   HETZNER_HOST     the box's IP
#   HETZNER_SSH_KEY  private half of a DEDICATED deploy key
#
# Defense in depth for a public repo:
# - the key's public half sits in root's authorized_keys behind a FORCED
#   COMMAND (/root/seiche-deploy-wrapper.sh) with no-pty/no-forwarding, so
#   even a leaked key can only trigger the deploy script, nothing else;
# - the wrapper runs the box's test-gated update.sh as the unprivileged
#   seiche user (pull → pip install → pytest, rollback on red) and only a
#   green tree gets a service restart + health check;
# - the host key is PINNED below, closing the first-connection MITM window;
# - secrets are never exposed to fork PRs (push-to-main + dispatch only).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The on-box gate runs the whole suite under memray on a shared-vCPU box,
    # so this ceiling has to track the suite's growth. It was 25 when the
    # suite was ~400 tests; 649 tests pushed a real deploy past it on
    # 2026-07-28, and the job was killed AFTER the box had pulled but BEFORE
    # it restarted the service. The wrapper then short-circuits on a matching
    # SHA ("already at X, nothing to deploy"), so the box sat on new code
    # running an old process, and only a fresh commit could dislodge it.
    # 55 was still not enough: db72b0e ran the full 55 and was killed mid-gate
    # on 2026-07-28. Measured, not guessed, the box needs more than an hour for
    # 731 tests under memray on 4 shared vCPUs, where the same suite takes 8
    # minutes on a laptop.
    #
    # This is the last time the number moves. The real fix is on the box, in
    # /home/seiche/update.sh: the deploy gate re-runs a suite that publish.yml
    # has already run to green on the same commit, and it runs it under a
    # memory profiler that exists to catch regressions in CI, not to guard a
    # restart. A smoke subset plus the health check would gate the restart just
    # as safely in two minutes. Until that script is reconciled (it is the same
    # stale copy that lacks the repo's Caddyfile step), the ceiling absorbs it.
    timeout-minutes: 120
    steps:
      - name: Deploy over SSH (forced-command wrapper on the box)
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::HETZNER_HOST / HETZNER_SSH_KEY secrets not set — auto-deploy cannot run."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          # Pinned host key (public information; ed25519 key of the box).
          printf '%s\n' "$HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKAeD2Er1pFiZR4FPkgY5FeoNhXHy36kDDRCZMUVzABL" > ~/.ssh/known_hosts
          # The forced command runs regardless of what is requested here; the
          # word "deploy" is just a log-friendly placeholder.
          #
          # Keepalive: the on-box wrapper runs a long, OUTPUT-LESS step
          # (git pull -> pip install -> pytest 386 tests + memray gate ->
          # restart). With no traffic on the channel an intermediary NAT/
          # firewall drops the idle TCP connection, and the client dies with
          # "client_loop: send disconnect: Broken pipe" (~4.5min in — seen
          # 2026-07-20 after 90 new engine tests pushed the on-box test run
          # past the idle window). ServerAliveInterval keeps the connection
          # ticking through the quiet build; CountMax=20 tolerates up to
          # ~10min of true server silence before giving up (well inside the
          # 25min job timeout, so a genuinely hung box still fails, not hangs).
          ssh -i ~/.ssh/hetzner_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -o TCPKeepAlive=yes \
              "root@$HOST" deploy
