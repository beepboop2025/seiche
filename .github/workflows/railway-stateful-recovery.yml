            --header "X-Seiche-Edge-Token: $RAILWAY_EDGE_TOKEN" \
            --data-binary '@proof/offsite-command.json' \
            --output proof/offsite-command-response.json --write-out '%{http_code}' \
            "$RAILWAY_ORIGIN/api/internal/v1/railway-control/commands")
          test "$status" = 202
          python -I -S - <<'PY'
          import json
          from pathlib import Path
          command = json.loads(Path("proof/offsite-command.json").read_bytes())
          response = json.loads(Path("proof/offsite-command-response.json").read_bytes())
          if (
              set(response) != {"status", "command_id", "lifecycle"}
              or response.get("status") != "accepted"
              or response.get("command_id") != command["command_id"]
              or response.get("lifecycle") not in {"created", "reused"}
          ):
              raise SystemExit("off-site command acknowledgement is invalid")
          PY
          replica_id="$submission_replica_id"
          paired=0
          for _attempt in $(seq 1 60); do
            railway logs "$DEPLOYMENT_ID" --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --deployment --json --since "$issued_at" \
              --filter 'SEICHE_RAILWAY_STATEFUL_RESULT_V1=' \
              >proof/offsite-result.ndjson || true
            replica_id=$(current_replica proof/offsite-runtime-current.json)
            printf '%s\n' "$replica_id" >proof/replica-id.txt
            if PYTHONPATH="$GITHUB_WORKSPACE/backend" LOG_PATH=proof/offsite-result.ndjson \
                REQUEST_ID="$REQUEST_ID" DEPLOYMENT_ID="$DEPLOYMENT_ID" \
                RELEASE_SHA="$RELEASE_SHA" REPLICA_ID="$replica_id" \
                SUBMISSION_REPLICA_ID="$submission_replica_id" \
                NOT_BEFORE="$issued_at" python -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from seiche.stateful_control import ControlContractError, extract_log_result

          results = []
          body = Path(os.environ["LOG_PATH"]).read_bytes()
          for lifecycle in ("created", "reused"):
              for replica_id in {
                  os.environ["SUBMISSION_REPLICA_ID"],
                  os.environ["REPLICA_ID"],
              }:
                  try:
                      result = extract_log_result(
                          body,
                          expected_kind="recovery_offsite_paired",
                          expected_lifecycle=lifecycle,
                          expected_request_id=os.environ["REQUEST_ID"],
                          expected_commit=os.environ["RELEASE_SHA"],
                          expected_deployment_id=os.environ["DEPLOYMENT_ID"],
                          expected_replica_id=replica_id,
                          not_before=os.environ["NOT_BEFORE"],
                      )
                  except ControlContractError:
                      continue
                  results.append(result)
          if not results or len({item.evidence_sha256 for item in results}) != 1:
              raise SystemExit("exact paired recovery result is absent or inconsistent")
          selected = max(results, key=lambda item: item.logged_at_unix_ns)
          evidence = selected.evidence
          expected_recovery = hashlib.sha256(Path("recovery-receipt.json").read_bytes()).hexdigest()
          expected_offsite = hashlib.sha256(Path("offsite-receipt.json").read_bytes()).hexdigest()
          if (
              evidence.get("recovery_receipt_sha256") != expected_recovery
              or evidence.get("offsite_receipt_sha256") != expected_offsite
              or evidence.get("recovery_receipt") != json.loads(Path("recovery-receipt.json").read_bytes())
              or evidence.get("offsite_receipt") != json.loads(Path("offsite-receipt.json").read_bytes())
          ):
              raise SystemExit("paired recovery evidence differs from immutable off-site bytes")
          Path("proof/paired-recovery-evidence.json").write_bytes(selected.evidence_body)
          PY
            then
              paired=1
              break
            fi
            sleep 5
          done
          test "$paired" = 1
          echo "receipt_path=$EVIDENCE_ROOT/offsite-receipt.json" >>"$GITHUB_OUTPUT"
          {
            echo "### Railway Phase 6 portable recovery"
            echo
            echo "- Snapshot: \`$SNAPSHOT_ID\`"
            echo "- Recovery request: \`$REQUEST_ID\`"
            echo "- Isolated filesystem, NBS, SQLite, and PostgreSQL restore: passed"
            echo "- External object lock: COMPLIANCE through at least \`$retain_until\`"
            echo "- Authority changed: no"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Retain the private portable-recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-recovery-${{ steps.export.outputs.snapshot_id }}-${{ steps.export.outputs.request_id }}
          path: |
            ${{ steps.export.outputs.evidence_root }}/activation-receipt.json
            ${{ steps.export.outputs.evidence_root }}/candidate-receipt.json
            ${{ steps.export.outputs.evidence_root }}/shadow-receipt.json
            ${{ steps.export.outputs.evidence_root }}/request.json
            ${{ steps.export.outputs.evidence_root }}/recovery-receipt.json
            ${{ steps.export.outputs.evidence_root }}/offsite-receipt.json
            ${{ steps.export.outputs.evidence_root }}/proof
          if-no-files-found: error
          retention-days: 90

      - name: OIDC-attest the exact recovery receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.export.outputs.receipt_path }}

      - name: OIDC-attest the immutable off-site receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.offsite.outputs.receipt_path }}
