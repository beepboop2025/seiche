name: distribution-contracts

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/distribution-contracts.yml"
      - ".github/workflows/publish-container.yml"
      - ".github/workflows/publish-mcp.yml"
      - ".github/workflows/publish-pypi.yml"
      - ".github/workflows/registry-publish.yml"
      - ".zenodo.json"
      - "CITATION.cff"
      - "Dockerfile"
      - "LICENSE"
      - "README.md"
      - "backend/README.md"
      - "backend/pyproject.toml"
      - "backend/seiche/**"
      - "backend/tests/test_distribution_artifacts.py"
      - "backend/tests/test_distribution_listings.py"
      - "clients/**"
      - "codemeta.json"
      - "compose.yaml"
      - "distribution/**"
      - "docs/DISTRIBUTION.md"
      - "frontend/**"
      - "integrations/datacommons/**"
      - "integrations/mcp-clients/**"
      - "integrations/openbb/**"
      - "notebooks/**"
      - "ops/deploy/release-allowed-signers"
      - "server.json"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/distribution-contracts.yml"
      - ".github/workflows/publish-container.yml"
      - ".github/workflows/publish-mcp.yml"
      - ".github/workflows/publish-pypi.yml"
      - ".github/workflows/registry-publish.yml"
      - ".zenodo.json"
      - "CITATION.cff"
      - "Dockerfile"
      - "LICENSE"
      - "README.md"
      - "backend/README.md"
      - "backend/pyproject.toml"
      - "backend/seiche/**"
      - "backend/tests/test_distribution_artifacts.py"
      - "backend/tests/test_distribution_listings.py"
      - "clients/**"
      - "codemeta.json"
      - "compose.yaml"
      - "distribution/**"
      - "docs/DISTRIBUTION.md"
      - "frontend/**"
      - "integrations/datacommons/**"
      - "integrations/mcp-clients/**"
      - "integrations/openbb/**"
      - "notebooks/**"
      - "ops/deploy/release-allowed-signers"
      - "server.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-distribution:
    name: Offline listings, datasets, and public clients
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Install the isolated test runner and linter
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            "pytest==9.1.1" \
            "ruff==0.15.22"

      - name: Check metadata, listings, and the rights-reviewed dataset kit
        run: |
          python -m pytest -q \
            backend/tests/test_distribution_artifacts.py \
            backend/tests/test_distribution_listings.py \
            distribution/datasets/test_distribution_kit.py
          python distribution/datasets/stage.py --validate-only

      - name: Lint distribution scripts outside the backend package
        run: |
          ruff check --no-cache \
            clients/python/world_markets.py \
            distribution/datasets/stage.py \
            distribution/datasets/test_distribution_kit.py

      - name: Exercise the dependency-free Python client offline
        run: |
          python - <<'PY'
          import runpy

          client = runpy.run_path("clients/python/world_markets.py")
          payload = {
              "schema": "seiche.world-markets.v1",
              "selection": "sources",
              "context_only": True,
              "clocks": {"boundary": "synthetic-offline-contract"},
              "citation": {"canonical_url": "https://seiche.info/world-markets"},
              "scope": {"coverage_claim": "curated_partial_non_exhaustive"},
          }
          client["_validate_contract"](payload, "sources")
          receipt = client["contract_receipt"](payload)
          assert receipt["selection"] == "sources"
          assert receipt["client_limits"]["automatic_retries"] == 0
          try:
              client["_validate_contract"]({**payload, "schema": "invalid"}, "sources")
          except client["SeicheClientError"]:
              pass
          else:
              raise AssertionError("Python client accepted an invalid schema")
          PY

      - name: Check and exercise the dependency-free JavaScript client offline
        run: |
          node --check clients/javascript/world-markets.mjs
          node --test clients/javascript/world-markets.test.mjs
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {
            contractReceipt,
            fetchWorldMarkets,
          } from "./clients/javascript/world-markets.mjs";

          globalThis.fetch = async (url, options) => {
            assert.equal(new URL(url).pathname, "/api/v2/world-markets");
            assert.equal(new URL(url).searchParams.get("section"), "sources");
            assert.equal(options.headers.Accept, "application/json");
            return new Response(JSON.stringify({
              schema: "seiche.world-markets.v1",
              selection: "sources",
              context_only: true,
              clocks: { boundary: "synthetic-offline-contract" },
              citation: { canonical_url: "https://seiche.info/world-markets" },
              scope: { coverage_claim: "curated_partial_non_exhaustive" },
            }), { status: 200, headers: { "content-type": "application/json" } });
          };

          const payload = await fetchWorldMarkets({ section: "sources", timeoutMs: 1000 });
          const receipt = contractReceipt(payload);
          assert.equal(receipt.selection, "sources");
          assert.equal(receipt.client_limits.automatic_retries, 0);

          globalThis.fetch = async () => new Response(JSON.stringify({
            ...payload,
            schema: "invalid",
          }), { status: 200, headers: { "content-type": "application/json" } });
          await assert.rejects(
            fetchWorldMarkets({ section: "sources", timeoutMs: 1000 }),
            /unexpected world-markets schema/,
          );
          JS

  r-client:
    name: R client syntax and offline contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          r-version: "release"

      - name: Parse and exercise the R contract without network access
        run: |
          Rscript - <<'RS'
          invisible(parse(file = "clients/r/world_markets.R"))
          client <- new.env(parent = baseenv())
          sys.source("clients/r/world_markets.R", envir = client)
          payload <- list(
            schema = "seiche.world-markets.v1",
            selection = "sources",
            context_only = TRUE,
            clocks = list(boundary = "synthetic-offline-contract"),
            citation = list(canonical_url = "https://seiche.info/world-markets"),
            scope = list(coverage_claim = "curated_partial_non_exhaustive")
          )
          stopifnot(isTRUE(client$validate_world_markets_contract(payload, "sources")))
          receipt <- client$contract_receipt(payload)
          stopifnot(identical(receipt$selection, "sources"))
          stopifnot(identical(receipt$client_limits$automatic_retries, 0L))
          bad <- payload
          bad$schema <- "invalid"
          stopifnot(inherits(
            try(client$validate_world_markets_contract(bad, "sources"), silent = TRUE),
            "try-error"
          ))
          RS

  openbb-provider:
    name: Isolated OpenBB provider package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: integrations/openbb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install only the OpenBB provider and its build tools
        run: |
          python -m pip install --disable-pip-version-check \
            "build==1.5.0" \
            "httpx==0.28.1" \
            "openbb-core==1.6.13" \
            "poetry-core==2.4.1" \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "ruff==0.15.22" \
            "twine==7.0.0"
          python -m pip install --disable-pip-version-check \
            --no-build-isolation --no-deps .

      - name: Test, lint, and build the provider in isolation
        run: |
          python -m pytest -q
          ruff check --no-cache .
          ruff format --check --no-cache .
          openbb-build
          python -m build --no-isolation --outdir "${RUNNER_TEMP}/openbb-dist"
          python -m twine check "${RUNNER_TEMP}"/openbb-dist/*

  contracts-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Check distribution contracts
        run: python backend/tests/test_distribution_artifacts.py

      - name: Validate Citation File Format schema
        run: |
          python -m pip install --disable-pip-version-check --quiet "cffconvert==2.0.0"
          cffconvert --validate --infile CITATION.cff

      - name: Validate hardened Compose model
        run: docker compose config --quiet

      - name: Resolve deterministic image labels
        id: image
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("backend/pyproject.toml").read_text())["project"]["version"]
          revision = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          created = subprocess.check_output(
              ["git", "show", "-s", "--format=%cI", "HEAD"], text=True
          ).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"revision={revision}", file=output)
              print(f"created={created}", file=output)
          PY

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build the runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: seiche:contract
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            REVISION=${{ steps.image.outputs.revision }}
            CREATED=${{ steps.image.outputs.created }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=seiche-distribution-contract
          cache-to: type=gha,mode=max,scope=seiche-distribution-contract

      - name: Reject high and critical package vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: seiche:contract
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
          format: table
          version: v0.70.0

      - name: Inspect and smoke-test the non-root image
        env:
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
          EXPECTED_REVISION: ${{ steps.image.outputs.revision }}
        run: |
          test "$(docker image inspect seiche:contract --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect seiche:contract --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$EXPECTED_VERSION"
          test "$(docker image inspect seiche:contract --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_REVISION"
          test "$(docker image inspect seiche:contract --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "AGPL-3.0-or-later"
          test "$(docker image inspect seiche:contract --format '{{json .Config.Healthcheck}}')" != "null"

          container_name="seiche-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "$container_name" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            seiche:contract
          cleanup() {
            docker logs "$container_name" || true
            docker stop --time 10 "$container_name" >/dev/null || true
            docker rm --volumes "$container_name" >/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 24); do
            status="$(docker inspect "$container_name" --format '{{.State.Health.Status}}')"
            echo "health attempt $attempt: $status"
            if [ "$status" = "healthy" ]; then
              docker exec --interactive "$container_name" python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import urllib.request

          if os.getuid() != 65532 or os.getgid() != 65532:
              raise SystemExit(f"unexpected runtime identity: {os.getuid()}:{os.getgid()}")
          if importlib.util.find_spec("pip") is not None:
              raise SystemExit("pip remains importable in the runtime image")
          if importlib.util.find_spec("ensurepip") is not None:
              raise SystemExit("ensurepip remains importable in the runtime image")
          pip_executables = (
              "/home/nonroot/venv/bin/pip",
              "/home/nonroot/venv/bin/pip3",
              "/usr/bin/pip",
              "/usr/local/bin/pip",
          )
          if any(Path(path).exists() for path in pip_executables):
              raise SystemExit("a pip executable remains in the runtime image")

          with urllib.request.urlopen("http://127.0.0.1:8787/api", timeout=5) as response:
              payload = json.load(response)
          if payload.get("product") != "Seiche":
              raise SystemExit(f"unexpected discovery payload: {payload!r}")
          PY
              cleanup
              trap - EXIT
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "container healthcheck reported unhealthy"
              exit 1
            fi
            sleep 5
          done
          echo "container did not become healthy before the deadline"
          exit 1
