name: publish

# Palimpsest-style serverless publish: run the seven engines on a cron,
# bake the snapshot into the static build, deploy to Cloudflare Pages.
# Data cadence is daily, so 4-hourly snapshots lose nothing.

on:
  schedule:
    - cron: "23 2,6,10,14,18,22 * * *"   # every 4h, offset minute
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Queue, never evict. This job takes ~45 minutes and three things trigger it:
# a push to main, the 4-hourly cron (which GitHub delays by up to hours), and
# the explicit dispatch from dispatch-daily after it commits the letter. With
# cancel-in-progress the newest trigger killed whatever was mid-build, so a
# push that landed inside anyone else's window simply never published. Every
# other long job here already queues; publish was the outlier. GitHub keeps at
# most one run pending per group, so this backlogs to two runs, never a pile.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.12"
          cache: pip

      - name: Install pinned Caddy config adapter
        # Match the production adapter; verify the official release's SHA-512.
        env:
          CADDY_VERSION: "2.11.4"
          CADDY_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
        run: |
          archive="$RUNNER_TEMP/caddy.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$CADDY_SHA512" "$archive" | sha512sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" caddy
          install -D -m 0755 "$RUNNER_TEMP/caddy" "$HOME/.local/bin/caddy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A scheduled refresh reruns the same immutable code many times.  The
      # expensive engine suite proves the code, not the current market data,
      # so cache that proof by the exact commit SHA.  The cache action saves
      # only after the whole job succeeds; a failed test, export, or publish
      # can never mint a reusable green marker.  Concurrency serializes runs,
      # so the first invocation for a new SHA finishes before another can use
      # its marker.
      - name: Restore exact-code publish gate
        id: publish-gate-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/publish-gates/${{ github.sha }}
          key: seiche-publish-gate-v1-${{ runner.os }}-py312-${{ github.sha }}

      - name: Verify exact-code publish gate
        id: publish-gate
        env:
          CACHE_HIT: ${{ steps.publish-gate-cache.outputs.cache-hit }}
          MARKER: .cache/publish-gates/${{ github.sha }}/validated-sha
        run: |
          if [ "$CACHE_HIT" = "true" ] && [ "$(cat "$MARKER" 2>/dev/null || true)" = "$GITHUB_SHA" ]; then
            echo "run-full-suite=false" >> "$GITHUB_OUTPUT"
            echo "reusing successful publish gate for $GITHUB_SHA"
          else
            echo "run-full-suite=true" >> "$GITHUB_OUTPUT"
            echo "no valid gate for $GITHUB_SHA; the full suite will run"
          fi

      - name: Install backend
        # The full publish gate exercises the official workbook adapters.
        # Their dependencies intentionally live in the collectors extra.
        env:
          RUN_FULL_SUITE: ${{ steps.publish-gate.outputs.run-full-suite }}
        run: |
          if [ "$RUN_FULL_SUITE" = "true" ]; then
            pip install -e "./backend[dev,collectors]"
          else
            pip install -e "./backend[collectors]"
          fi

      - name: Install hash-locked social-card renderer
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r ops/requirements-social-cards.txt

      - name: Engine tests (publish gates on green)
        if: steps.publish-gate.outputs.run-full-suite == 'true'
        run: |
          # Match the hardened UMask of seiche-release-poll.service so CI
          # catches permission-sensitive fixture drift before host activation.
          umask 0077
          python -m pytest backend/tests -q --memray -o faulthandler_timeout=300
          mkdir -p ".cache/publish-gates/$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > ".cache/publish-gates/$GITHUB_SHA/validated-sha"

      - name: Restore GDELT WEB-NGRAM baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/gdelt-web-history.json
          key: gdelt-web-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gdelt-web-history-${{ runner.os }}-

      - name: Seed GDELT WEB-NGRAM baseline when cache is cold
        env:
          GDELT_WEB_HISTORY_FILE: ${{ github.workspace }}/.cache/gdelt-web-history.json
        run: python backend/scripts/backfill_gdelt_web.py

      - name: Run engines, export snapshot
        env:
          GDELT_WEB_HISTORY_FILE: ${{ github.workspace }}/.cache/gdelt-web-history.json
        run: python backend/scripts/export_public.py frontend/public/data/public.json frontend/public/data/overview.json

      # The Book's ledger: pull the previously published hash-chained history
      # from the live site, verify it, append today's as-published record.
      # The site repo's git history is the append-only backbone.
      - name: Append Book record (hash-chained ledger)
        run: |
          # -L: github.io 301s to the seiche.info custom domain since 2026-07-09
          curl -sfL https://seiche.info/data/book_history.json \
            -o /tmp/book_history.json || echo "[]" > /tmp/book_history.json
          python backend/scripts/append_book_record.py \
            --snapshot frontend/public/data/overview.json \
            /tmp/book_history.json frontend/public/data/book_history.json

      # Static SEO surface: one indexable HTML page per dispatch + archive +
      # regenerated sitemap, baked into public/ so the frontend build ships them.
      - name: Render dispatch pages
        run: python -m seiche.dispatch_pages

      # The versioned methodology page (citations, changelog, cite-as block),
      # regenerated from config weights and engine docstrings so it can never
      # drift from the code it documents. Must run before the vite build so
      # public/ carries it into dist/.
      - name: Render methodology page
        run: python -m seiche.methodology

      # The skeptic pack: the leakage audit and the orthogonal event-capture
      # test, rendered from the snapshot baked above so the page can never
      # claim a result the board did not compute.
      - name: Render skeptic pack
        run: python -m seiche.skeptic

      # The ampleness check: the Fed's own indicator set, walked line by line
      # with a stated threshold and a verdict token per line. It counts the
      # tokens rather than inventing a second composite, on purpose.
      - name: Render ampleness check
        run: python -m seiche.ampleness

      # The referee page: the global liquidity category's headline claims
      # tested on their publicly reconstructible layer, misses included.
      - name: Render referee page
        run: python -m seiche.referee

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend (snapshot baked into dist/)
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      # The SPA shell ships an empty <div id="root">, so anything that does not
      # execute JavaScript saw ~400 characters of body text: every AI crawler
      # that reads raw HTML, every link unfurler, every reader with scripting
      # off. This writes the board into the page's <noscript> (masthead, the
      # composite reading with its gloss, the headline numbers, PROOF, the
      # latest letter, the Week Ahead's pre-registered calls) and makes the
      # card meta carry the live reading. Runs AFTER the vite build because it
      # rewrites dist/index.html; the interactive bundle is untouched.
      # Fail-loud on purpose: a home page that quietly reverts to the empty
      # shell is the bug, so a missing snapshot stops the publish.
      - name: Prerender the no-JS home page
        run: python -m seiche.prerender frontend/dist

      # A URL fragment never reaches a link unfurler. Build real /views/ paths
      # and content-addressed 1200x630 images from the exact sealed snapshot,
      # then upgrade root, market, dispatch and article metadata in dist/. This
      # module is read-only over exported/cached evidence: no collection or
      # model fitting is permitted in the social-card path.
      - name: Build contextual social cards
        run: python -m seiche.social_cards frontend/dist

      - name: Fetch the exact declared release tag
        run: |
          set -euo pipefail
          version="$(python -I -S - <<'PY'
          import json
          from pathlib import Path

          print(json.loads(Path("server.json").read_text())["version"])
          PY
          )"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --force --no-tags origin \
            "+refs/tags/v${version}:refs/tags/v${version}"

      - name: Gate catalog on the signed release, runtime, and PyPI receipts
        env:
          RELEASE_SIGNING_KEY_FINGERPRINT: ${{ vars.RELEASE_SIGNING_KEY_FINGERPRINT }}
        run: >-
          python -I -S ops/release/verify_catalog_publication.py
          --root .
          --expected-sha "$GITHUB_SHA"
          --signer-fingerprint "$RELEASE_SIGNING_KEY_FINGERPRINT"

      # Primary 24/7 publish: push the built site + snapshot to the PUBLIC
      # seiche-site repo (GitHub Pages) — no tokens beyond the deploy key,
      # no user hands, survives forever on the free tier.
      - name: Publish to GitHub Pages (seiche-site)
        env:
          DEPLOY_KEY: ${{ secrets.SEICHE_SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/site_key
          chmod 600 ~/.ssh/site_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:beepboop2025/seiche-site.git /tmp/site || \
            (mkdir /tmp/site && cd /tmp/site && git init -b main && git remote add origin git@github.com:beepboop2025/seiche-site.git)
          rsync -a --delete --exclude .git frontend/dist/ /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git config user.name "seiche-publish"
          git config user.email "noreply@seiche"
          git add -A
          git diff --cached --quiet || git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin main

      # Tell IndexNow (Bing, which feeds ChatGPT search) about the URLs the
      # moment they are live. Best-effort: a flaky ping never blocks a publish.
      - name: Ping IndexNow
        continue-on-error: true
        run: python backend/scripts/ping_indexnow.py

      # Canonical: Cloudflare Pages serves seiche.info and its reviewed _headers.
      # The GitHub mirror remains durable, but it is not the public receipt.
      - name: Cloudflare token preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Cloudflare Pages deploy blocked::CLOUDFLARE_API_TOKEN is required because seiche.info and its reviewed response headers are the canonical public surface. Setup: ops/cloudflare/README.md."
            exit 1
          fi
      - name: Deploy to canonical Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: pages deploy frontend/dist --project-name=seiche --branch=main

      - name: Prove the canonical dataset landing and DCAT catalog are live
        run: >-
          python ops/release/verify_public_dataset.py
          --expected-root frontend/dist
          --cache-key "$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
