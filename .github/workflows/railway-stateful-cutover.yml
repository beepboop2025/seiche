name: railway-stateful-cutover

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Restore a read-only candidate or activate an already-proved candidate"
        required: true
        type: choice
        options:
          - candidate
          - activate
      source_commit:
        description: "Exact signed release commit already sealed in the authority fence (defaults to workflow commit)"
        required: false
        type: string
      snapshot_id:
        description: "Candidate only: final frozen snapshot, for example 20260823T010203Z"
        required: false
        type: string
      authority_fence_sha256:
        description: "Candidate only: SHA-256 of canonical AUTHORITY-FENCE.json"
        required: false
        type: string
      authority_fence_base64:
        description: "Candidate only: canonical AUTHORITY-FENCE.json encoded as one-line base64"
        required: false
        type: string
      request_id:
        description: "Activation only: accepted candidate request ID"
        required: false
        type: string
      candidate_receipt_sha256:
        description: "Activation only: accepted canonical candidate receipt SHA-256"
        required: false
        type: string
      deployment_id:
        description: "Activation or resume: exact Railway candidate deployment UUID"
        required: false
        type: string
      candidate_run_id:
        description: "Activation: attested candidate run; resume: original run that submitted the deployment"
        required: false
        type: string
      candidate_request_base64:
        description: "Resume only: exact canonical request read from the existing candidate; also supply deployment_id and candidate_run_id"
        required: false
        type: string
      confirmation:
        description: "Exact operation-specific authority confirmation"
        required: true
        type: string

# The workflow revision is the attested control identity. The application
# revision remains bound to the frozen snapshot, shadow receipt, and grant.
env:
  SOURCE_SHA: ${{ inputs.source_commit || github.sha }}

permissions:
  contents: read

concurrency:
  group: railway-stateful-cutover-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  restore-candidate:
    if: github.repository == 'beepboop2025/seiche' && inputs.operation == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: railway-stateful-cutover-candidate
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the exact main identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate the signed application source independently of the workflow
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          signer_file="$GITHUB_WORKSPACE/ops/deploy/release-allowed-signers"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signer_file" \
            verify-commit "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signer_file" \
            verify-commit "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          {
            echo "- Reviewed workflow commit: \`$GITHUB_SHA\`"
            echo "- Signed application commit: \`$SOURCE_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Install the checksum-pinned Railway CLI
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/railway-v5.43.1-linux-amd64.tar.gz"
          tool_dir="${RUNNER_TEMP}/railway-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/railwayapp/cli/releases/download/v5.43.1/railway-v5.43.1-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo '88fb44b35b74ded67d383fe6f8b69161d8cc4ca5e3f9b8c6c338293f65f52ee9  '"$archive" |
            sha256sum --check --strict
          test "$(tar -tzf "$archive")" = railway
          tar -xzf "$archive" -C "$tool_dir" railway
          chmod 0755 "$tool_dir/railway"
          echo "$tool_dir" >>"$GITHUB_PATH"
          "$tool_dir/railway" --version

      - name: Load the signed controller helpers and bounded Railway read retries
        run: |
          set -euo pipefail
          helpers="$RUNNER_TEMP/cutover-controller"
          mkdir -p "$helpers"
          git show "$GITHUB_SHA:ops/railway/retry_read.py" >"$helpers/railway"
          git show "$GITHUB_SHA:ops/railway/verify_cutover_resume.py" >"$RUNNER_TEMP/cutover-resume.py"
          chmod 0755 "$helpers/railway"
          echo "RAILWAY_REAL_BIN=$RUNNER_TEMP/railway-tools/railway" >>"$GITHUB_ENV"
          echo "$helpers" >>"$GITHUB_PATH"

      - name: Prove the fenced source and isolated Railway target
        id: control
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_STATEFUL_VOLUME_ID }}
          RAILWAY_ORIGIN: ${{ secrets.RAILWAY_STATEFUL_ORIGIN }}
          RAILWAY_EDGE_TOKEN: ${{ secrets.RAILWAY_EDGE_TOKEN }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          FENCE_SHA256: ${{ inputs.authority_fence_sha256 }}
          FENCE_BASE64: ${{ inputs.authority_fence_base64 }}
          RESUME_REQUEST: ${{ inputs.candidate_request_base64 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CONTROL_ROOT: ${{ runner.temp }}/railway-cutover-control
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = beepboop2025/seiche
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = HETZNER_FROZEN_RAILWAY_READ_ONLY
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SNAPSHOT_ID" =~ ^20[0-9]{6}T[0-9]{6}Z$ ]]
          [[ "$FENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RAILWAY_ORIGIN" =~ ^https://[a-z0-9][a-z0-9.-]{1,251}\.up\.railway\.app$ ]]
          for value in \
            "$RAILWAY_TOKEN" "$RAILWAY_PROJECT_ID" "$RAILWAY_ENVIRONMENT_ID" \
            "$RAILWAY_SERVICE_ID" "$RAILWAY_VOLUME_ID" "$RAILWAY_EDGE_TOKEN" \
            "$FENCE_BASE64"; do
            test -n "$value"
          done
          RAILWAY_EDGE_TOKEN="$RAILWAY_EDGE_TOKEN" python3 -I -S - <<'PY'
          import os
          import re

          value = os.environ["RAILWAY_EDGE_TOKEN"]
          if not 32 <= len(value) <= 512 or re.fullmatch(
              r"[A-Za-z0-9._~=-]+", value
          ) is None:
              raise SystemExit("Railway edge token is invalid")
          PY
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --short --untracked-files=no)"
          mkdir -p "$CONTROL_ROOT/evidence"
          chmod 0700 "$CONTROL_ROOT" "$CONTROL_ROOT/evidence"
          cd "$CONTROL_ROOT"
          railway volume --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" list --json >volumes.json
          railway domain list --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" --json >domains.json
          railway variable list --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --json >variables.json
          EXPECTED_VOLUME_ID="$RAILWAY_VOLUME_ID" ORIGIN="$RAILWAY_ORIGIN" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from urllib.parse import urlsplit

          volumes = json.loads(Path("volumes.json").read_text())
          compact = json.dumps(volumes, sort_keys=True, separators=(",", ":"))
          if compact.count(os.environ["EXPECTED_VOLUME_ID"]) != 1:
              raise SystemExit("the exact stateful volume is not uniquely attached")
          if "/var/lib/seiche-platform" not in compact:
              raise SystemExit("the stateful volume mount path is not exact")

          domains = json.loads(Path("domains.json").read_text())
          domain_text = json.dumps(domains, sort_keys=True, separators=(",", ":"))
          observed = set(
              re.findall(r"[a-z0-9][a-z0-9.-]+\.up\.railway\.app", domain_text)
          )
          expected = urlsplit(os.environ["ORIGIN"]).hostname
          if observed != {expected}:
              raise SystemExit("the exact Railway origin is not uniquely configured")

          variables = json.loads(Path("variables.json").read_text())
          if isinstance(variables, dict):
              entries = variables
          elif isinstance(variables, list):
              entries = {
                  item.get("name"): item.get("value")
                  for item in variables
                  if isinstance(item, dict) and isinstance(item.get("name"), str)
              }
          else:
              raise SystemExit("Railway variables response has an unsupported shape")
          names = set(entries)
          database_url = entries.get("DATABASE_URL")
          if not isinstance(database_url, str) or not database_url.strip():
              raise SystemExit(
                  "stateful service has no non-empty Railway PostgreSQL reference"
              )
          forbidden = {
              "HETZNER_DATABASE_URL",
              "NBS_SIGNING_KEY",
              "TELEGRAM_BOT_TOKEN",
              "GITHUB_TOKEN",
              "RAILWAY_TOKEN",
          }
          if names & forbidden:
              raise SystemExit("stateful service contains a forbidden control secret")
          if os.environ["RESUME_REQUEST"]:
              expected = {
                  "SEICHE_RAILWAY_VOLUME_ID": os.environ["EXPECTED_VOLUME_ID"],
                  "SEICHE_RAILWAY_CUTOVER_SNAPSHOT_ID": os.environ["SNAPSHOT_ID"],
                  "SEICHE_RAILWAY_AUTHORITY_FENCE_SHA256": os.environ["FENCE_SHA256"],
                  "SEICHE_RAILWAY_CONTROL_ENABLED": "1",
                  "SEICHE_RAILWAY_EDGE_TOKEN": os.environ["RAILWAY_EDGE_TOKEN"],
              }
              if any(entries.get(name) != value for name, value in expected.items()):
                  raise SystemExit("resume service variables differ from the frozen candidate")

          PY
          rm -f variables.json
          printf '%s' "$FENCE_BASE64" | base64 --decode \
            >"$CONTROL_ROOT/evidence/AUTHORITY-FENCE.json"
          chmod 0400 "$CONTROL_ROOT/evidence/AUTHORITY-FENCE.json"
          echo "$FENCE_SHA256  $CONTROL_ROOT/evidence/AUTHORITY-FENCE.json" |
            sha256sum --check --strict
          PYTHONPATH="$GITHUB_WORKSPACE/backend" python3 -B \
            -m seiche.stateful_cutover validate fence \
            "$CONTROL_ROOT/evidence/AUTHORITY-FENCE.json" \
            >"$CONTROL_ROOT/evidence/fence.sha256"
          test "$(cat "$CONTROL_ROOT/evidence/fence.sha256")" = "$FENCE_SHA256"
          SNAPSHOT_ID="$SNAPSHOT_ID" TARGET="$SOURCE_SHA" \
            FENCE_SHA256="$FENCE_SHA256" EVIDENCE="$CONTROL_ROOT/evidence" \
            OUTPUT="$GITHUB_OUTPUT" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE"])
          fence = json.loads((root / "AUTHORITY-FENCE.json").read_bytes())
          snapshot = fence["snapshot"]
          receipts = fence["receipts"]
          if (
              fence["commit"] != os.environ["TARGET"]
              or snapshot["id"] != os.environ["SNAPSHOT_ID"]
              or snapshot["source_revision"] != os.environ["TARGET"]
          ):
              raise SystemExit("authority fence identity differs from dispatch")
          outputs = {
              "tree": fence["tree"],
              "inventory_sha256": snapshot["inventory_sha256"],
              "content_set_sha256": snapshot["content_set_sha256"],
              "release_receipt_sha256": receipts["release_sha256"],
              "recovery_receipt_sha256": receipts["recovery_sha256"],
              "shadow_receipt_sha256": receipts["latest_shadow_sha256"],
              "fence_path": str(root / "AUTHORITY-FENCE.json"),
          }
          with Path(os.environ["OUTPUT"]).open("a", encoding="utf-8") as stream:
              for name, value in outputs.items():
                  stream.write(f"{name}={value}\n")
          PY
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')" = \
            "$(grep '^tree=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          if test -n "$RESUME_REQUEST"; then
            exit 0
          fi
          railway variable set \
            "SEICHE_RAILWAY_VOLUME_ID=$RAILWAY_VOLUME_ID" \
            "SEICHE_RAILWAY_CUTOVER_SNAPSHOT_ID=$SNAPSHOT_ID" \
            "SEICHE_RAILWAY_AUTHORITY_FENCE_SHA256=$FENCE_SHA256" \
            "SEICHE_RAILWAY_CONTROL_ENABLED=1" \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --skip-deploys >/dev/null
          printf '%s' "$RAILWAY_EDGE_TOKEN" |
            railway variable set SEICHE_RAILWAY_EDGE_TOKEN --stdin \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --skip-deploys >/dev/null

      - name: Build the canonical cutover candidate request
        id: request
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          FENCE_SHA256: ${{ inputs.authority_fence_sha256 }}
          TREE: ${{ steps.control.outputs.tree }}
          INVENTORY_SHA256: ${{ steps.control.outputs.inventory_sha256 }}
          CONTENT_SET_SHA256: ${{ steps.control.outputs.content_set_sha256 }}
          RELEASE_RECEIPT_SHA256: ${{ steps.control.outputs.release_receipt_sha256 }}
          RECOVERY_RECEIPT_SHA256: ${{ steps.control.outputs.recovery_receipt_sha256 }}
          SHADOW_RECEIPT_SHA256: ${{ steps.control.outputs.shadow_receipt_sha256 }}
          FENCE_PATH: ${{ steps.control.outputs.fence_path }}
          UPLOAD_ROOT: ${{ runner.temp }}/railway-cutover-upload
          RESUME_REQUEST: ${{ inputs.candidate_request_base64 }}
          RESUME_RUN_ID: ${{ inputs.candidate_run_id }}
          RESUME_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$UPLOAD_ROOT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          if test -n "$RESUME_REQUEST"; then
            PYTHONPATH=backend python3 -B "$RUNNER_TEMP/cutover-resume.py"
            exit 0
          fi
          git archive --format=tar "$SOURCE_SHA" >"$UPLOAD_ROOT/source.tar"
          git bundle create "$UPLOAD_ROOT/source.bundle" HEAD
          git bundle verify "$UPLOAD_ROOT/source.bundle"
          test "$(git bundle list-heads "$UPLOAD_ROOT/source.bundle")" = \
            "$SOURCE_SHA HEAD"
          source_archive_sha256=$(sha256sum "$UPLOAD_ROOT/source.tar" | awk '{print $1}')
          source_bundle_sha256=$(sha256sum "$UPLOAD_ROOT/source.bundle" | awk '{print $1}')
          request_id=$(printf '%s\n' \
            "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$SOURCE_SHA:$SNAPSHOT_ID:cutover-candidate" |
            sha256sum | awk '{print $1}')
          requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cp ops/railway/Dockerfile.stateful "$UPLOAD_ROOT/Dockerfile"
          cp ops/railway/railway.cutover.json "$UPLOAD_ROOT/railway.json"
          TARGET="$SOURCE_SHA" SOURCE_ARCHIVE_SHA256="$source_archive_sha256" \
            SOURCE_BUNDLE_SHA256="$source_bundle_sha256" REQUEST_ID="$request_id" \
            REQUESTED_AT="$requested_at" REQUEST_PATH="$UPLOAD_ROOT/request.json" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "seiche.railway-stateful-cutover-request.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": (
                  "beepboop2025/seiche/"
                  ".github/workflows/railway-stateful-cutover.yml"
              ),
              "source_ref": os.environ["GITHUB_REF"],
              "commit": os.environ["TARGET"],
              "tree": os.environ["TREE"],
              "source_archive_sha256": os.environ["SOURCE_ARCHIVE_SHA256"],
              "source_bundle_sha256": os.environ["SOURCE_BUNDLE_SHA256"],
              "request_id": os.environ["REQUEST_ID"],
              "operation": "cutover_candidate",
              "snapshot_id": os.environ["SNAPSHOT_ID"],
              "source_revision": os.environ["TARGET"],
              "source_inventory_sha256": os.environ["INVENTORY_SHA256"],
              "source_content_set_sha256": os.environ["CONTENT_SET_SHA256"],
              "source_release_receipt_sha256": os.environ[
                  "RELEASE_RECEIPT_SHA256"
              ],
              "source_recovery_receipt_sha256": os.environ[
                  "RECOVERY_RECEIPT_SHA256"
              ],
              "source_shadow_receipt_sha256": os.environ[
                  "SHADOW_RECEIPT_SHA256"
              ],
              "source_fence_sha256": os.environ["FENCE_SHA256"],
              "source_writers_frozen": True,
              "public_traffic_enabled": False,
              "requested_at": os.environ["REQUESTED_AT"],
          }
          Path(os.environ["REQUEST_PATH"]).write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          PYTHONPATH=backend REQUEST="$UPLOAD_ROOT/request.json" \
            FENCE="$FENCE_PATH" python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          from seiche.stateful_cutover import validate_fence, validate_request

          fence = validate_fence(json.loads(Path(os.environ["FENCE"]).read_bytes()))
          validate_request(
              json.loads(Path(os.environ["REQUEST"]).read_bytes()),
              fence=fence,
          )
          PY
          test "$(find "$UPLOAD_ROOT" -maxdepth 1 -type f | wc -l)" -eq 5
          {
            echo "request_id=$request_id"
            echo "target=$SOURCE_SHA"
            echo "upload_root=$UPLOAD_ROOT"
          } >>"$GITHUB_OUTPUT"

      - name: Deploy the exact read-only candidate
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          UPLOAD_ROOT: ${{ steps.request.outputs.upload_root }}
          RESUME_DEPLOYMENT_ID: ${{ steps.request.outputs.resume_deployment_id }}
          RESUME_NOT_BEFORE: ${{ steps.request.outputs.resume_not_before }}
        run: |
          set -euo pipefail
          if test -n "$RESUME_DEPLOYMENT_ID"; then
            {
              echo "deployment_id=$RESUME_DEPLOYMENT_ID"
              echo "not_before=$RESUME_NOT_BEFORE"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          deployment_not_before=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          deployment_json=$(railway up "$UPLOAD_ROOT" --path-as-root --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "seiche-cutover-candidate:$SOURCE_SHA:${{ inputs.snapshot_id }}:$GITHUB_RUN_ID")
          deployment_id=$(DEPLOYMENT_JSON="$deployment_json" python3 -I -S - <<'PY'
          import json
          import os
          import re

          value = json.loads(os.environ["DEPLOYMENT_JSON"])
          if not isinstance(value, dict) or set(value) != {"deploymentId", "logsUrl"}:
              raise SystemExit("Railway upload returned an invalid response")
          identity = value["deploymentId"]
          if re.fullmatch(
              r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-"
              r"[89ab][0-9a-f]{3}-[0-9a-f]{12}",
              identity,
          ) is None:
              raise SystemExit("Railway upload returned an invalid deployment ID")
          print(identity)
          PY
          )
          {
            echo "deployment_id=$deployment_id"
            echo "not_before=$deployment_not_before"
          } >>"$GITHUB_OUTPUT"

      - name: Wait for the exact candidate deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          status=""
          for _attempt in $(seq 1 360); do
            railway deployment list --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --limit 100 --json >"${RUNNER_TEMP}/cutover-deployments.json"
            status=$(DEPLOYMENT_ID="$DEPLOYMENT_ID" \
              STATUS_PATH="${RUNNER_TEMP}/cutover-deployments.json" \
              python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          values = json.loads(Path(os.environ["STATUS_PATH"]).read_text())
          matches = [
              value for value in values
              if isinstance(value, dict) and value.get("id") == os.environ["DEPLOYMENT_ID"]
          ]
          if len(matches) != 1 or not isinstance(matches[0].get("status"), str):
              raise SystemExit("exact Railway cutover deployment disappeared")
          print(matches[0]["status"].upper())
          PY
            )
            case "$status" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED|REMOVING)
                railway logs "$DEPLOYMENT_ID" --service "$RAILWAY_SERVICE_ID" \
                  --project "$RAILWAY_PROJECT_ID" \
                  --environment "$RAILWAY_ENVIRONMENT_ID" --lines 1000 || true
                exit 1
                ;;
              BUILDING|DEPLOYING|INITIALIZING|WAITING|QUEUED) sleep 10 ;;
              *) echo "unknown Railway deployment state: $status" >&2; exit 1 ;;
            esac
          done
          test "$status" = SUCCESS

      - name: Prove the exact candidate runtime
        id: candidate_runtime
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          variables=$(DEPLOYMENT_ID="$DEPLOYMENT_ID" python3 -I -S - <<'PY'
          import json
          import os
          print(json.dumps({"deploymentId": os.environ["DEPLOYMENT_ID"]}, separators=(",", ":")))
          PY
          )
          # GraphQL variable names are literal, not shell expansions.
          # shellcheck disable=SC2016
          railway api \
            'query Runtime($deploymentId: String!) { deployment(id: $deploymentId) { id projectId environmentId serviceId status instances { id status } } }' \
            --variables "$variables" >"$RUNNER_TEMP/candidate-runtime.json"
          RUNTIME="$RUNNER_TEMP/candidate-runtime.json" \
            EXPECTED_DEPLOYMENT="$DEPLOYMENT_ID" EXPECTED_PROJECT="$RAILWAY_PROJECT_ID" \
            EXPECTED_ENVIRONMENT="$RAILWAY_ENVIRONMENT_ID" \
            EXPECTED_SERVICE="$RAILWAY_SERVICE_ID" OUTPUT="$GITHUB_OUTPUT" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          value = json.loads(Path(os.environ["RUNTIME"]).read_text())["data"]["deployment"]
          expected = {
              "id": os.environ["EXPECTED_DEPLOYMENT"],
              "projectId": os.environ["EXPECTED_PROJECT"],
              "environmentId": os.environ["EXPECTED_ENVIRONMENT"],
              "serviceId": os.environ["EXPECTED_SERVICE"],
              "status": "SUCCESS",
          }
          if any(value.get(key) != item for key, item in expected.items()):
              raise SystemExit("candidate deployment identity differs")
          instances = value.get("instances")
          if not isinstance(instances, list) or len(instances) != 1 or instances[0].get("status") != "RUNNING":
              raise SystemExit("candidate deployment is not singly RUNNING")
          replica = instances[0].get("id")
          if re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}", str(replica)) is None:
              raise SystemExit("candidate replica identity is invalid")
          with Path(os.environ["OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"replica_id={replica}\n")
          PY

      - name: Retrieve and validate the immutable candidate receipt
        id: evidence
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          RAILWAY_ORIGIN: ${{ secrets.RAILWAY_STATEFUL_ORIGIN }}
          RAILWAY_EDGE_TOKEN: ${{ secrets.RAILWAY_EDGE_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_NOT_BEFORE: ${{ steps.deploy.outputs.not_before }}
          CREATED_REPLICA_ID: ${{ steps.candidate_runtime.outputs.replica_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          UPLOAD_ROOT: ${{ steps.request.outputs.upload_root }}
          FENCE_PATH: ${{ steps.control.outputs.fence_path }}
          EVIDENCE_ROOT: ${{ runner.temp }}/railway-cutover-candidate-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          receipt="$EVIDENCE_ROOT/candidate-receipt.json"
          log_path="$EVIDENCE_ROOT/candidate-created.ndjson"
          for _attempt in $(seq 1 60); do
            railway logs "$DEPLOYMENT_ID" --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --deployment --json --since "$DEPLOYMENT_NOT_BEFORE" \
              --filter 'SEICHE_RAILWAY_STATEFUL_RESULT_V1=' >"$log_path" || true
            grep -q 'SEICHE_RAILWAY_STATEFUL_RESULT_V1=' "$log_path" && break
            sleep 5
          done
          PYTHONPATH=backend LOG_PATH="$log_path" RECEIPT_PATH="$receipt" \
            REQUEST_ID="$REQUEST_ID" DEPLOYMENT_ID="$DEPLOYMENT_ID" \
            REPLICA_ID="$CREATED_REPLICA_ID" NOT_BEFORE="$DEPLOYMENT_NOT_BEFORE" \
            python3 -B - <<'PY'
          import os
          from pathlib import Path
          from seiche.stateful_control import extract_log_result

          result = extract_log_result(
              Path(os.environ["LOG_PATH"]).read_bytes(),
              expected_kind="candidate",
              expected_lifecycle="created",
              expected_request_id=os.environ["REQUEST_ID"],
              expected_commit=os.environ["SOURCE_SHA"],
              expected_deployment_id=os.environ["DEPLOYMENT_ID"],
              expected_replica_id=os.environ["REPLICA_ID"],
              not_before=os.environ["NOT_BEFORE"],
          )
          Path(os.environ["RECEIPT_PATH"]).write_bytes(result.evidence_body)
          PY
          receipt_sha256=$(PYTHONPATH=backend python3 -B \
            -m seiche.stateful_cutover validate candidate "$receipt" \
            --request "$UPLOAD_ROOT/request.json" --fence "$FENCE_PATH")
          [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          EXPECTED_DEPLOYMENT="$DEPLOYMENT_ID" RECEIPT="$receipt" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RECEIPT"]).read_bytes())
          if value["railway"]["deployment_id"] != os.environ["EXPECTED_DEPLOYMENT"]:
              raise SystemExit("candidate receipt belongs to another deployment")
          PY
          restart_not_before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          restart_json=$(railway restart --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" --yes --json)
          RESTART_JSON="$restart_json" DEPLOYMENT_ID="$DEPLOYMENT_ID" \
            python3 -I -S - <<'PY'
          import json
          import os
          if json.loads(os.environ["RESTART_JSON"]) != {"id": os.environ["DEPLOYMENT_ID"]}:
              raise SystemExit("Railway restarted another deployment")
          PY
          reused_replica_id=""
          for _attempt in $(seq 1 60); do
            variables=$(DEPLOYMENT_ID="$DEPLOYMENT_ID" python3 -I -S - <<'PY'
          import json
          import os
          print(json.dumps({"deploymentId": os.environ["DEPLOYMENT_ID"]}, separators=(",", ":")))
          PY
            )
            # GraphQL variable names are literal, not shell expansions.
            # shellcheck disable=SC2016
            railway api \
              'query Runtime($deploymentId: String!) { deployment(id: $deploymentId) { id status instances { id status } } }' \
              --variables "$variables" >"$EVIDENCE_ROOT/candidate-reused-runtime.json"
            reused_replica_id=$(RUNTIME="$EVIDENCE_ROOT/candidate-reused-runtime.json" \
              DEPLOYMENT_ID="$DEPLOYMENT_ID" \
              python3 -I -S - <<'PY' || true
          import json
          import os
          from pathlib import Path
          import re
          value = json.loads(Path(os.environ["RUNTIME"]).read_text())["data"]["deployment"]
          instances = value.get("instances")
          if value.get("id") != os.environ["DEPLOYMENT_ID"] or value.get("status") != "SUCCESS":
              raise SystemExit(1)
          if not isinstance(instances, list) or len(instances) != 1 or instances[0].get("status") != "RUNNING":
              raise SystemExit(1)
          replica = instances[0].get("id")
          # Railway may retain the replica UUID across a restart. The fresh
          # runtime boundary and immutable receipt below prove the restart.
          if re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}", str(replica)) is None:
              raise SystemExit(1)
          print(replica)
          PY
            )
            [ -n "$reused_replica_id" ] && break
            sleep 5
          done
          test -n "$reused_replica_id"
          reused_logs="$EVIDENCE_ROOT/candidate-reused.ndjson"
          for _attempt in $(seq 1 120); do
            railway logs "$DEPLOYMENT_ID" --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --deployment --json --since "$DEPLOYMENT_NOT_BEFORE" \
              --filter 'SEICHE_RAILWAY_STATEFUL_RESULT_V1=' >"$reused_logs" || true
            test "$(grep -c 'SEICHE_RAILWAY_STATEFUL_RESULT_V1=' "$reused_logs" || true)" -ge 2 && break
            sleep 5
          done
          PYTHONPATH=backend LOG_PATH="$reused_logs" RECEIPT_PATH="$receipt" \
            REQUEST_ID="$REQUEST_ID" DEPLOYMENT_ID="$DEPLOYMENT_ID" \
            CREATED_REPLICA_ID="$CREATED_REPLICA_ID" \
            REUSED_REPLICA_ID="$reused_replica_id" NOT_BEFORE="$DEPLOYMENT_NOT_BEFORE" \
            RESTART_NOT_BEFORE="$restart_not_before" \
            python3 -B - <<'PY'
          import os
          from pathlib import Path
          from seiche.stateful_control import extract_log_results
          from seiche.stateful_migration import rfc3339_utc_nanoseconds

          results = extract_log_results(
              Path(os.environ["LOG_PATH"]).read_bytes(),
              expected_kind="candidate",
              expected_request_id=os.environ["REQUEST_ID"],
              expected_commit=os.environ["SOURCE_SHA"],
              expected_deployment_id=os.environ["DEPLOYMENT_ID"],
              expected_replicas={
                  "created": os.environ["CREATED_REPLICA_ID"],
                  "reused": os.environ["REUSED_REPLICA_ID"],
              },
              not_before=os.environ["NOT_BEFORE"],
          )
          if results["created"].evidence_body != Path(os.environ["RECEIPT_PATH"]).read_bytes():
              raise SystemExit("candidate restart changed the accepted receipt")
          boundary = rfc3339_utc_nanoseconds(
              os.environ["RESTART_NOT_BEFORE"], label="candidate restart boundary",
          )
          created_start = rfc3339_utc_nanoseconds(
              results["created"].runtime_started_at, label="created runtime start",
          )
          reused_start = rfc3339_utc_nanoseconds(
              results["reused"].runtime_started_at, label="reused runtime start",
          )
          if (
              results["reused"].logged_at_unix_ns <= boundary
              or reused_start < boundary
              or reused_start <= created_start
          ):
              raise SystemExit("candidate reuse does not prove a fresh restart")
          PY
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 \
            --header "X-Seiche-Edge-Token: $RAILWAY_EDGE_TOKEN" \
            --dump-header "$EVIDENCE_ROOT/origin.headers" \
            --output "$EVIDENCE_ROOT/origin.json" --write-out '%{http_code}' \
            "$RAILWAY_ORIGIN/api/health")
          test "$status" = 200
          HEADERS="$EVIDENCE_ROOT/origin.headers" DEPLOYMENT="$DEPLOYMENT_ID" \
            TARGET="$SOURCE_SHA" python3 -I -S - <<'PY'
          import os
          from pathlib import Path

          values = {}
          for line in Path(os.environ["HEADERS"]).read_text(
              encoding="iso-8859-1"
          ).splitlines():
              if ":" in line:
                  name, value = line.split(":", 1)
                  values[name.strip().lower()] = value.strip()
          expected = {
              "x-seiche-railway-authority": "candidate",
              "x-seiche-railway-deployment": os.environ["DEPLOYMENT"],
              "x-seiche-release-sha": os.environ["TARGET"],
          }
          if any(values.get(name) != value for name, value in expected.items()):
              raise SystemExit("direct Railway origin identity is invalid")
          PY
          cp "$UPLOAD_ROOT/request.json" "$EVIDENCE_ROOT/request.json"
          cp "$FENCE_PATH" "$EVIDENCE_ROOT/AUTHORITY-FENCE.json"
          {
            echo "receipt_path=$receipt"
            echo "receipt_sha256=$receipt_sha256"
            echo "evidence_root=$EVIDENCE_ROOT"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Railway cutover candidate"
            echo
            echo "- Request: \`$REQUEST_ID\`"
            echo "- Deployment: \`$DEPLOYMENT_ID\`"
            echo "- Candidate receipt SHA-256: \`$receipt_sha256\`"
            echo "- Authority: both writer planes fenced; Railway reads only"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Retain the private candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-cutover-candidate-${{ steps.request.outputs.target }}-${{ steps.request.outputs.request_id }}
          path: ${{ steps.evidence.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 90

      - name: OIDC-attest the exact candidate receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.evidence.outputs.receipt_path }}

  activate-candidate:
    if: github.repository == 'beepboop2025/seiche' && inputs.operation == 'activate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: railway-stateful-activation
    permissions:
      actions: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the exact reviewed identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate the signed application source independently of the workflow
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          signer_file="$GITHUB_WORKSPACE/ops/deploy/release-allowed-signers"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signer_file" \
            verify-commit "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signer_file" \
            verify-commit "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          {
            echo "- Reviewed workflow commit: \`$GITHUB_SHA\`"
            echo "- Signed application commit: \`$SOURCE_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Install the checksum-pinned Railway CLI
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check './backend'
          archive="${RUNNER_TEMP}/railway-v5.43.1-linux-amd64.tar.gz"
          tool_dir="${RUNNER_TEMP}/railway-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/railwayapp/cli/releases/download/v5.43.1/railway-v5.43.1-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo '88fb44b35b74ded67d383fe6f8b69161d8cc4ca5e3f9b8c6c338293f65f52ee9  '"$archive" |
            sha256sum --check --strict
          test "$(tar -tzf "$archive")" = railway
          tar -xzf "$archive" -C "$tool_dir" railway
          chmod 0755 "$tool_dir/railway"
          echo "$tool_dir" >>"$GITHUB_PATH"

      - name: Load the signed controller helper for bounded Railway read retries
        run: |
          set -euo pipefail
          helpers="$RUNNER_TEMP/cutover-controller"
          mkdir -p "$helpers"
          git show "$GITHUB_SHA:ops/railway/retry_read.py" >"$helpers/railway"
          chmod 0755 "$helpers/railway"
          echo "RAILWAY_REAL_BIN=$RUNNER_TEMP/railway-tools/railway" >>"$GITHUB_ENV"
          echo "$helpers" >>"$GITHUB_PATH"

      - name: Recover and validate the exact candidate chain
        id: candidate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_STATEFUL_VOLUME_ID }}
          RAILWAY_EDGE_TOKEN: ${{ secrets.RAILWAY_EDGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          EXPECTED_RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVIDENCE_ROOT: ${{ runner.temp }}/railway-cutover-activation-evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = PUBLIC_EDGE_PROVES_CANDIDATE_ACTIVATE_RAILWAY
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          for value in \
            "$RAILWAY_TOKEN" "$RAILWAY_PROJECT_ID" "$RAILWAY_ENVIRONMENT_ID" \
            "$RAILWAY_SERVICE_ID" "$RAILWAY_VOLUME_ID" "$RAILWAY_EDGE_TOKEN"; do
            test -n "$value"
          done
          mkdir -p "$EVIDENCE_ROOT"
          run_json=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")
          RUN_JSON="$run_json" EXPECTED_SHA="$GITHUB_SHA" python3 -I -S - <<'PY'
          import json
          import os

          value = json.loads(os.environ["RUN_JSON"])
          expected = {
              "event": "workflow_dispatch",
              "head_sha": os.environ["EXPECTED_SHA"],
              "conclusion": "success",
              "head_branch": "main",
          }
          path, _, path_ref = str(value.get("path", "")).partition("@")
          repository = value.get("head_repository")
          if (
              any(value.get(name) != expected_value for name, expected_value in expected.items())
              or path != ".github/workflows/railway-stateful-cutover.yml"
              or path_ref not in {"", "refs/heads/main"}
              or not isinstance(repository, dict)
              or repository.get("full_name") != "beepboop2025/seiche"
          ):
              raise SystemExit("candidate workflow run identity is invalid")
          PY
          artifact_name="railway-cutover-candidate-$SOURCE_SHA-$REQUEST_ID"
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir "$EVIDENCE_ROOT"
          test -z "$(find "$EVIDENCE_ROOT" -mindepth 1 ! -type f -print -quit)"
          find "$EVIDENCE_ROOT" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
            sort >"$RUNNER_TEMP/candidate-artifact-files.txt"
          printf '%s\n' AUTHORITY-FENCE.json candidate-created.ndjson \
            candidate-receipt.json candidate-reused.ndjson \
            candidate-reused-runtime.json origin.headers origin.json request.json |
            sort >"$RUNNER_TEMP/expected-candidate-files.txt"
          cmp "$RUNNER_TEMP/expected-candidate-files.txt" \
            "$RUNNER_TEMP/candidate-artifact-files.txt"
          gh attestation verify "$EVIDENCE_ROOT/candidate-receipt.json" \
            --repo beepboop2025/seiche \
            --signer-workflow beepboop2025/seiche/.github/workflows/railway-stateful-cutover.yml \
            --signer-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json >"$EVIDENCE_ROOT/candidate-attestation.json"
          echo "$EXPECTED_RECEIPT_SHA256  $EVIDENCE_ROOT/candidate-receipt.json" |
            sha256sum --check --strict
          RECEIPT="$EVIDENCE_ROOT/candidate-receipt.json" \
            EXPECTED_REQUEST="$REQUEST_ID" EXPECTED_DEPLOYMENT="$DEPLOYMENT_ID" \
            EXPECTED_COMMIT="$SOURCE_SHA" OUTPUT="$GITHUB_OUTPUT" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RECEIPT"]).read_bytes())
          if (
              value["request"]["id"] != os.environ["EXPECTED_REQUEST"]
              or value["request"]["commit"] != os.environ["EXPECTED_COMMIT"]
              or value["railway"]["deployment_id"] != os.environ["EXPECTED_DEPLOYMENT"]
          ):
              raise SystemExit("activation candidate identity differs")
          with Path(os.environ["OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"fence_sha256={value['fence']['sha256']}\n")
          PY
          fence_sha256=$(tail -n 1 "$GITHUB_OUTPUT" | cut -d= -f2)
          [[ "$fence_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "$fence_sha256  $EVIDENCE_ROOT/AUTHORITY-FENCE.json" |
            sha256sum --check --strict
          edge_digest=$(RAILWAY_EDGE_TOKEN="$RAILWAY_EDGE_TOKEN" python3 -I -S - <<'PY'
          import hashlib
          import os
          print(hashlib.sha256(os.environ["RAILWAY_EDGE_TOKEN"].encode()).hexdigest())
          PY
          )
          PYTHONPATH=backend python3 -B -m seiche.stateful_cutover \
            validate candidate "$EVIDENCE_ROOT/candidate-receipt.json" \
            --request "$EVIDENCE_ROOT/request.json" \
            --fence "$EVIDENCE_ROOT/AUTHORITY-FENCE.json" >/dev/null
          {
            echo "evidence_root=$EVIDENCE_ROOT"
            echo "edge_digest=$edge_digest"
          } >>"$GITHUB_OUTPUT"

      - name: Prove public edge reaches that read-only candidate
        id: public
        env:
          RAILWAY_ORIGIN: ${{ secrets.RAILWAY_STATEFUL_ORIGIN }}
          RAILWAY_EDGE_TOKEN: ${{ secrets.RAILWAY_EDGE_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          EVIDENCE_ROOT: ${{ steps.candidate.outputs.evidence_root }}
        run: |
          set -euo pipefail
          [[ "$RAILWAY_ORIGIN" =~ ^https://[a-z0-9][a-z0-9.-]{1,251}\.up\.railway\.app$ ]]
          probe() {
            local prefix="$1" url="$2" token="$3" status
            if [ -n "$token" ]; then
              status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
                --connect-timeout 10 --max-time 30 \
                --header "X-Seiche-Edge-Token: $token" \
                --dump-header "$EVIDENCE_ROOT/$prefix.headers" \
                --output "$EVIDENCE_ROOT/$prefix.json" --write-out '%{http_code}' \
                "$url")
            else
              status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
                --connect-timeout 10 --max-time 30 \
                --dump-header "$EVIDENCE_ROOT/$prefix.headers" \
                --output "$EVIDENCE_ROOT/$prefix.json" --write-out '%{http_code}' \
                "$url")
            fi
            test "$status" = 200
          }
          probe origin-candidate "$RAILWAY_ORIGIN/api/health" "$RAILWAY_EDGE_TOKEN"
          probe public-candidate 'https://api.seiche.info/api/health' ''
          for prefix in origin-candidate public-candidate; do
            HEADERS="$EVIDENCE_ROOT/$prefix.headers" \
              DEPLOYMENT="$DEPLOYMENT_ID" TARGET="$SOURCE_SHA" \
              python3 -I -S - <<'PY'
          import os
          from pathlib import Path

          values = {}
          for line in Path(os.environ["HEADERS"]).read_text(
              encoding="iso-8859-1"
          ).splitlines():
              if ":" in line:
                  name, value = line.split(":", 1)
                  values[name.strip().lower()] = value.strip()
          expected = {
              "x-seiche-railway-authority": "candidate",
              "x-seiche-railway-deployment": os.environ["DEPLOYMENT"],
              "x-seiche-release-sha": os.environ["TARGET"],
          }
          if any(values.get(name) != value for name, value in expected.items()):
              raise SystemExit("candidate edge identity is invalid")
          PY
          done
          OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            BODY="$EVIDENCE_ROOT/public-candidate.json" \
            DESTINATION="$EVIDENCE_ROOT/public-probe.json" \
            DEPLOYMENT="$DEPLOYMENT_ID" TARGET="$SOURCE_SHA" \
            python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          value = {
              "schema": "seiche.railway-public-candidate-probe.v1",
              "url": "https://api.seiche.info/api/health",
              "status": 200,
              "authority": "candidate",
              "deployment_id": os.environ["DEPLOYMENT"],
              "commit": os.environ["TARGET"],
              "body_sha256": hashlib.sha256(
                  Path(os.environ["BODY"]).read_bytes()
              ).hexdigest(),
              "observed_at": os.environ["OBSERVED_AT"],
          }
          Path(os.environ["DESTINATION"]).write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          probe_sha256=$(sha256sum "$EVIDENCE_ROOT/public-probe.json" | awk '{print $1}')
          echo "probe_sha256=$probe_sha256" >>"$GITHUB_OUTPUT"

      - name: Sign and submit the one-time Railway authority grant
        id: grant
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          RAILWAY_VOLUME_ID: ${{ secrets.RAILWAY_STATEFUL_VOLUME_ID }}
          RAILWAY_ORIGIN: ${{ secrets.RAILWAY_STATEFUL_ORIGIN }}
          RAILWAY_EDGE_TOKEN: ${{ secrets.RAILWAY_EDGE_TOKEN }}
          SEICHE_RAILWAY_ACTIVATION_SIGNING_KEY_PEM: ${{ secrets.SEICHE_RAILWAY_ACTIVATION_SIGNING_KEY_PEM }}
          REQUEST_ID: ${{ inputs.request_id }}
          RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          FENCE_SHA256: ${{ steps.candidate.outputs.fence_sha256 }}
          EDGE_DIGEST: ${{ steps.candidate.outputs.edge_digest }}
          PROBE_SHA256: ${{ steps.public.outputs.probe_sha256 }}
          EVIDENCE_ROOT: ${{ steps.candidate.outputs.evidence_root }}
        run: |
          set -euo pipefail
          activated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ACTIVATED_AT="$activated_at" DESTINATION="$EVIDENCE_ROOT/activation-grant.json" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          value = {
              "schema": "seiche.railway-authority-grant.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": (
                  "beepboop2025/seiche/"
                  ".github/workflows/railway-stateful-cutover.yml"
              ),
              "commit": os.environ["SOURCE_SHA"],
              "request_id": os.environ["REQUEST_ID"],
              "candidate_receipt_sha256": os.environ["RECEIPT_SHA256"],
              "fence_sha256": os.environ["FENCE_SHA256"],
              "deployment_id": os.environ["DEPLOYMENT_ID"],
              "edge_token_sha256": os.environ["EDGE_DIGEST"],
              "public_base_url": "https://api.seiche.info",
              "public_probe_sha256": os.environ["PROBE_SHA256"],
              "activated_at": os.environ["ACTIVATED_AT"],
              "confirmation": "RAILWAY_BECOMES_SOLE_WRITER",
          }
          Path(os.environ["DESTINATION"]).write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          CANDIDATE="$EVIDENCE_ROOT/candidate-receipt.json" \
            PROBE="$EVIDENCE_ROOT/public-probe.json" \
            GRANT="$EVIDENCE_ROOT/activation-grant.json" \
            EDGE_DIGEST="$EDGE_DIGEST" PYTHONPATH=backend python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          from seiche.stateful_cutover import (
              validate_grant,
              validate_public_candidate_probe,
          )

          candidate = json.loads(Path(os.environ["CANDIDATE"]).read_bytes())
          grant = json.loads(Path(os.environ["GRANT"]).read_bytes())
          probe = json.loads(Path(os.environ["PROBE"]).read_bytes())
          validated = validate_grant(
              grant,
              candidate_receipt=candidate,
              edge_token_digest=os.environ["EDGE_DIGEST"],
          )
          validate_public_candidate_probe(
              probe,
              candidate_receipt=candidate,
              grant=validated,
          )
          PY
          grant_sha256=$(sha256sum "$EVIDENCE_ROOT/activation-grant.json" | awk '{print $1}')
          issued_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          expires_at=$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:%SZ)
          nonce=$(openssl rand -hex 32)
          ISSUED_AT="$issued_at" EXPIRES_AT="$expires_at" NONCE="$nonce" \
            COMMAND_PATH="$EVIDENCE_ROOT/activation-command.json" \
            PYTHONPATH=backend python3 -B - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from seiche import stateful_control as control
          from seiche import stateful_migration as migration

          private = serialization.load_pem_private_key(
              os.environ["SEICHE_RAILWAY_ACTIVATION_SIGNING_KEY_PEM"].encode(),
              password=None,
          )
          if not isinstance(private, Ed25519PrivateKey):
              raise SystemExit("activation signer is not Ed25519")
          public_raw = private.public_key().public_bytes(
              serialization.Encoding.Raw,
              serialization.PublicFormat.Raw,
          )
          key_id = hashlib.sha256(public_raw).hexdigest()
          if key_id != control.ACTIVATION_KEY_ID:
              raise SystemExit("activation signer is not the governed key")
          payload = {
              "public_probe": json.loads(Path(os.environ["EVIDENCE_ROOT"], "public-probe.json").read_bytes()),
              "grant": json.loads(Path(os.environ["EVIDENCE_ROOT"], "activation-grant.json").read_bytes()),
          }
          environment = {
              "SEICHE_RELEASE_SHA": os.environ["SOURCE_SHA"],
              "RAILWAY_PROJECT_ID": os.environ["RAILWAY_PROJECT_ID"],
              "RAILWAY_ENVIRONMENT_ID": os.environ["RAILWAY_ENVIRONMENT_ID"],
              "RAILWAY_SERVICE_ID": os.environ["RAILWAY_SERVICE_ID"],
              "RAILWAY_DEPLOYMENT_ID": os.environ["DEPLOYMENT_ID"],
              "SEICHE_RAILWAY_VOLUME_ID": os.environ["RAILWAY_VOLUME_ID"],
          }
          unsigned = control.prepare_unsigned_command(
              control.ACTIVATION_OPERATION,
              payload,
              environment,
              issued_at=os.environ["ISSUED_AT"],
              expires_at=os.environ["EXPIRES_AT"],
              nonce=os.environ["NONCE"],
              key_id=key_id,
          )
          signed = {
              **unsigned,
              "signature": base64.b64encode(
                  private.sign(control.command_signing_bytes(unsigned))
              ).decode("ascii"),
          }
          body = migration.canonical_document(signed)
          control.validate_command(body, environment)
          Path(os.environ["COMMAND_PATH"]).write_bytes(body)
          PY
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 \
            --header 'Content-Type: application/json' \
            --header "X-Seiche-Edge-Token: $RAILWAY_EDGE_TOKEN" \
            --data-binary "@$EVIDENCE_ROOT/activation-command.json" \
            --output "$EVIDENCE_ROOT/activation-command-response.json" \
            --write-out '%{http_code}' \
            "$RAILWAY_ORIGIN/api/internal/v1/railway-control/commands")
          test "$status" = 202
          COMMAND="$EVIDENCE_ROOT/activation-command.json" \
            RESPONSE="$EVIDENCE_ROOT/activation-command-response.json" \
            OUTPUT="$GITHUB_OUTPUT" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          command = json.loads(Path(os.environ["COMMAND"]).read_bytes())
          response = json.loads(Path(os.environ["RESPONSE"]).read_bytes())
          if (
              set(response) != {"status", "command_id", "lifecycle"}
              or response.get("status") != "accepted"
              or response.get("command_id") != command["command_id"]
              or response.get("lifecycle") not in {"created", "reused"}
          ):
              raise SystemExit("activation command acknowledgement is invalid")
          with Path(os.environ["OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"command_id={command['command_id']}\n")
          PY
          {
            echo "grant_sha256=$grant_sha256"
            echo "command_path=$EVIDENCE_ROOT/activation-command.json"
            echo "issued_at=$issued_at"
          } >>"$GITHUB_OUTPUT"

      - name: Prove Railway production authority and receipt
        id: activation
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STATEFUL_SERVICE_ID }}
          RAILWAY_ORIGIN: ${{ secrets.RAILWAY_STATEFUL_ORIGIN }}
          RAILWAY_EDGE_TOKEN: ${{ secrets.RAILWAY_EDGE_TOKEN }}
          REQUEST_ID: ${{ inputs.request_id }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          EDGE_DIGEST: ${{ steps.candidate.outputs.edge_digest }}
          COMMAND_ISSUED_AT: ${{ steps.grant.outputs.issued_at }}
          EVIDENCE_ROOT: ${{ steps.candidate.outputs.evidence_root }}
        run: |
          set -euo pipefail
          ready=0
          for _attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 15 \
              --header "X-Seiche-Edge-Token: $RAILWAY_EDGE_TOKEN" \
              --dump-header "$EVIDENCE_ROOT/origin-production.headers" \
              --output "$EVIDENCE_ROOT/origin-production.json" \
              --write-out '%{http_code}' "$RAILWAY_ORIGIN/api/health" || true)
            if [ "$status" = 200 ] && \
                grep -Eiq '^x-seiche-railway-authority:[[:space:]]*production' \
                  "$EVIDENCE_ROOT/origin-production.headers"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 \
            --dump-header "$EVIDENCE_ROOT/public-production.headers" \
            --output "$EVIDENCE_ROOT/public-production.json" \
            --write-out '%{http_code}' 'https://api.seiche.info/api/health')
          test "$status" = 200
          for prefix in origin-production public-production; do
            HEADERS="$EVIDENCE_ROOT/$prefix.headers" \
              DEPLOYMENT="$DEPLOYMENT_ID" TARGET="$SOURCE_SHA" \
              python3 -I -S - <<'PY'
          import os
          from pathlib import Path

          values = {}
          for line in Path(os.environ["HEADERS"]).read_text(
              encoding="iso-8859-1"
          ).splitlines():
              if ":" in line:
                  name, value = line.split(":", 1)
                  values[name.strip().lower()] = value.strip()
          expected = {
              "x-seiche-railway-authority": "production",
              "x-seiche-railway-deployment": os.environ["DEPLOYMENT"],
              "x-seiche-release-sha": os.environ["TARGET"],
          }
          if any(values.get(name) != value for name, value in expected.items()):
              raise SystemExit("production edge identity is invalid")
          PY
          done
          current_replica() {
            local destination="$1" variables
            variables=$(DEPLOYMENT_ID="$DEPLOYMENT_ID" python3 -I -S - <<'PY'
          import json
          import os
          print(json.dumps({"deploymentId": os.environ["DEPLOYMENT_ID"]}, separators=(",", ":")))
          PY
            )
            # GraphQL variable names are literal, not shell expansions.
            # shellcheck disable=SC2016
            railway api \
              'query Runtime($deploymentId: String!) { deployment(id: $deploymentId) { id projectId environmentId serviceId status instances { id status } } }' \
              --variables "$variables" >"$destination"
            RUNTIME="$destination" DEPLOYMENT_ID="$DEPLOYMENT_ID" \
              RAILWAY_PROJECT_ID="$RAILWAY_PROJECT_ID" \
              RAILWAY_ENVIRONMENT_ID="$RAILWAY_ENVIRONMENT_ID" \
              RAILWAY_SERVICE_ID="$RAILWAY_SERVICE_ID" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          value = json.loads(Path(os.environ["RUNTIME"]).read_text())["data"]["deployment"]
          expected = {
              "id": os.environ["DEPLOYMENT_ID"],
              "projectId": os.environ["RAILWAY_PROJECT_ID"],
              "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
              "serviceId": os.environ["RAILWAY_SERVICE_ID"],
              "status": "SUCCESS",
          }
          if any(value.get(key) != item for key, item in expected.items()):
              raise SystemExit("activation deployment identity differs")
          instances = value.get("instances")
          if not isinstance(instances, list) or len(instances) != 1 or instances[0].get("status") != "RUNNING":
              raise SystemExit("activation deployment is not singly RUNNING")
          replica = instances[0].get("id")
          if re.fullmatch(
              r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-"
              r"[89ab][0-9a-f]{3}-[0-9a-f]{12}",
              str(replica),
          ) is None:
              raise SystemExit("activation replica identity is invalid")
          print(replica)
          PY
          }
          replica_id=$(current_replica "$EVIDENCE_ROOT/activation-runtime.json")
          submission_replica_id="$replica_id"
          receipt="$EVIDENCE_ROOT/activation-receipt.json"
          log_path="$EVIDENCE_ROOT/activation-result.ndjson"
          parsed=0
          for _attempt in $(seq 1 120); do
            railway logs "$DEPLOYMENT_ID" --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --deployment --json --since "$COMMAND_ISSUED_AT" \
              --filter 'SEICHE_RAILWAY_STATEFUL_RESULT_V1=' >"$log_path" || true
            replica_id=$(current_replica "$EVIDENCE_ROOT/activation-runtime-current.json")
            if PYTHONPATH=backend LOG_PATH="$log_path" RECEIPT_PATH="$receipt" \
                REQUEST_ID="$REQUEST_ID" DEPLOYMENT_ID="$DEPLOYMENT_ID" \
                REPLICA_ID="$replica_id" \
                SUBMISSION_REPLICA_ID="$submission_replica_id" \
                NOT_BEFORE="$COMMAND_ISSUED_AT" \
                python3 -B - <<'PY'
          import os
          from pathlib import Path
          from seiche.stateful_control import ControlContractError, extract_log_result

          matches = []
          body = Path(os.environ["LOG_PATH"]).read_bytes()
          for lifecycle in ("created", "reused"):
              for replica_id in {
                  os.environ["SUBMISSION_REPLICA_ID"],
                  os.environ["REPLICA_ID"],
              }:
                  try:
                      result = extract_log_result(
                          body,
                          expected_kind="activation",
                          expected_lifecycle=lifecycle,
                          expected_request_id=os.environ["REQUEST_ID"],
                          expected_commit=os.environ["SOURCE_SHA"],
                          expected_deployment_id=os.environ["DEPLOYMENT_ID"],
                          expected_replica_id=replica_id,
                          not_before=os.environ["NOT_BEFORE"],
                      )
                  except ControlContractError:
                      continue
                  matches.append(result)
          if not matches or len({item.evidence_sha256 for item in matches}) != 1:
              raise SystemExit("exact activation result is absent or inconsistent")
          selected = max(matches, key=lambda item: item.logged_at_unix_ns)
          Path(os.environ["RECEIPT_PATH"]).write_bytes(selected.evidence_body)
          PY
            then
              parsed=1
              break
            fi
            sleep 5
          done
          test "$parsed" = 1
          receipt_sha256=$(PYTHONPATH=backend python3 -B \
            -m seiche.stateful_cutover validate activation "$receipt" \
            --request "$EVIDENCE_ROOT/request.json" \
            --fence "$EVIDENCE_ROOT/AUTHORITY-FENCE.json" \
            --candidate "$EVIDENCE_ROOT/candidate-receipt.json" \
            --grant "$EVIDENCE_ROOT/activation-grant.json" \
            --edge-token-sha256 "$EDGE_DIGEST")
          [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "receipt_path=$receipt"
            echo "receipt_sha256=$receipt_sha256"
            echo "evidence_root=$EVIDENCE_ROOT"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Railway stateful activation"
            echo
            echo "- Request: \`$REQUEST_ID\`"
            echo "- Deployment: \`$DEPLOYMENT_ID\`"
            echo "- Activation receipt SHA-256: \`$receipt_sha256\`"
            echo "- Railway is now the sole writer."
            echo "- Final host acknowledgement still requires the downloaded receipt."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Retain the private activation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-cutover-activation-${{ env.SOURCE_SHA }}-${{ inputs.request_id }}
          path: ${{ steps.activation.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 90

      - name: OIDC-attest the exact activation receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.activation.outputs.receipt_path }}

      - name: Dispatch the immediate portable recovery export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(python3 -I -S - <<'PY'
          import json
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "operation": "export-recovery",
                  "confirmation": "EXPORT_WITHOUT_AUTHORITY_CHANGE",
              },
          }, separators=(",", ":")))
          PY
          )
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" --output /dev/null --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/railway-stateful-recovery.yml/dispatches")
          test "$status" = 204
