name: publish-mcp

# Publish the PyPI package and the MCP registry listing when a GitHub release is
# cut (or run manually). Skips cleanly until its secret exists, like the other
# workflows here.
#
# Needs one repo secret for the PyPI step (Settings -> Secrets -> Actions):
#   PYPI_API_TOKEN   a PyPI token scoped to the `seiche` project
# The MCP registry job authenticates with its own OIDC token (id-token: write,
# granted to that job only, so the PyPI job never holds it) against the
# io.github.beepboop2025/* namespace, no secret involved.
#
# The publisher binary is version-pinned and sha256-verified, same pattern as
# registry-publish.yml: the registry job holds an OIDC id-token, so executing
# an unpinned "latest" download would hand namespace publish rights to whoever
# controls the next release. Bump the version and hash together, from
# registry_<ver>_checksums.txt on the release.
#
# The registry job stays here rather than deferring to registry-publish.yml:
# that one is workflow_dispatch only, so deleting this job would mean a
# release no longer lands in the registry unless someone remembers to run it.
#
# See docs/PUBLISHING.md for the manual equivalent and the aggregator submissions.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::notice::PYPI_API_TOKEN not set — skipping PyPI upload."
            exit 0
          fi
          python -m pip install --quiet build twine
          python -m build backend
          python -m twine upload backend/dist/*

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write        # lets mcp-publisher prove the namespace via OIDC
      contents: read
    env:
      MCP_PUBLISHER_VERSION: "1.8.0"
      MCP_PUBLISHER_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          curl -sSLo mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate and publish server.json
        run: |
          ./mcp-publisher login github-oidc
          # NOTE: current mcp-publisher treats --dry-run as a real publish;
          # a single publish is the whole job.
          ./mcp-publisher publish
