name: Agent network qualification
on:
  pull_request:
    paths: ['services/agent-network/**', '.github/workflows/agent-network.yml']
  push:
    paths: ['services/agent-network/**', '.github/workflows/agent-network.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    container: python:3.12.14-slim
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: qualification
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/agent-network
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: PYTHONPATH=src python -m pytest -q
        env:
          SEICHE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:synthetic-ci-only@postgres:5432/qualification
  edge:
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node --test services/agent-network/edge/worker.test.mjs
