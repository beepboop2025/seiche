name: railway-snapshot-prebuild

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-snapshot-prebuild
  cancel-in-progress: false

env:
  ARTIFACT_REPOSITORY: ghcr.io/beepboop2025/seiche-release-snapshots
  INSTALL_COMMAND: python -m pip install -q ./backend[collectors]
  BUILD_COMMAND: python -I -B -m seiche.remote_snapshot_build
  RUNNER_IMAGE: docker.io/library/python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7

jobs:
  railway-snapshot:
    if: github.repository == 'beepboop2025/seiche'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: railway-gate
    outputs:
      evidence_artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}
      source_archive_sha256: ${{ steps.request.outputs.source_archive_sha256 }}
      request_id: ${{ steps.request.outputs.request_id }}
      target: ${{ steps.request.outputs.target }}
      tree: ${{ steps.request.outputs.tree }}
    steps:
      - name: Preflight required Railway configuration
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SNAPSHOT_SERVICE_ID: ${{ secrets.RAILWAY_SNAPSHOT_SERVICE_ID }}
        run: |
          set -euo pipefail
          required=(
            RAILWAY_TOKEN
            RAILWAY_PROJECT_ID
            RAILWAY_ENVIRONMENT_ID
            RAILWAY_SNAPSHOT_SERVICE_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            printf '%s\n' 'Missing required Railway configuration:' >&2
            printf '%s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Check out the exact event identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build the canonical exact-source snapshot request
        id: request
        env:
          UPLOAD_ROOT: ${{ runner.temp }}/railway-snapshot-upload
          RESULT_TOKEN_PATH: ${{ runner.temp }}/railway-snapshot-result-token
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = beepboop2025/seiche
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=no)"

          tree=$(git rev-parse 'HEAD^{tree}')
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$UPLOAD_ROOT"
          git archive --format=tar "$GITHUB_SHA" >"$UPLOAD_ROOT/source.tar"
          source_archive_sha256=$(sha256sum "$UPLOAD_ROOT/source.tar" | awk '{print $1}')
          [[ "$source_archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          RESULT_TOKEN_PATH="$RESULT_TOKEN_PATH" python3 -I -S - <<'PY'
          import os
          from pathlib import Path
          import secrets

          Path(os.environ["RESULT_TOKEN_PATH"]).write_text(
              secrets.token_hex(32), encoding="ascii"
          )
          PY
          chmod 0600 "$RESULT_TOKEN_PATH"
          result_token_sha256=$(sha256sum "$RESULT_TOKEN_PATH" | awk '{print $1}')
          [[ "$result_token_sha256" =~ ^[0-9a-f]{64}$ ]]
          result_token_expires_at=$(python3 -I -S - <<'PY'
          from datetime import UTC, datetime, timedelta

          print(
              (datetime.now(UTC) + timedelta(minutes=90))
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          PY
          )
          [[ "$result_token_expires_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          request_id=$(printf '%s\n' \
            "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_SHA:snapshot" |
            sha256sum | awk '{print $1}')

          cp ops/railway/Dockerfile.snapshot "$UPLOAD_ROOT/Dockerfile"
          cp ops/railway/run-snapshot.py "$UPLOAD_ROOT/run-snapshot.py"
          cp ops/railway/railway.snapshot.json "$UPLOAD_ROOT/railway.json"
          TARGET="$GITHUB_SHA" TREE="$tree" \
            SOURCE_ARCHIVE_SHA256="$source_archive_sha256" \
            RESULT_TOKEN_SHA256="$result_token_sha256" \
            RESULT_TOKEN_EXPIRES_AT="$result_token_expires_at" \
            REQUEST_ID="$request_id" \
            REQUEST_PATH="$UPLOAD_ROOT/snapshot-request.json" \
            python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "seiche.railway-snapshot-request.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": (
                  "beepboop2025/seiche/"
                  ".github/workflows/railway-snapshot-prebuild.yml"
              ),
              "source_ref": os.environ["GITHUB_REF"],
              "commit": os.environ["TARGET"],
              "tree": os.environ["TREE"],
              "source_archive_sha256": os.environ["SOURCE_ARCHIVE_SHA256"],
              "request_id": os.environ["REQUEST_ID"],
              "result_token_expires_at": os.environ["RESULT_TOKEN_EXPIRES_AT"],
              "result_token_sha256": os.environ["RESULT_TOKEN_SHA256"],
              "runner_image": os.environ["RUNNER_IMAGE"],
              "install_command": os.environ["INSTALL_COMMAND"],
              "build_command": os.environ["BUILD_COMMAND"],
          }
          Path(os.environ["REQUEST_PATH"]).write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          test "$(find "$UPLOAD_ROOT" -maxdepth 1 -type f | wc -l)" -eq 5
          {
            echo "target=$GITHUB_SHA"
            echo "tree=$tree"
            echo "source_archive_sha256=$source_archive_sha256"
            echo "request_id=$request_id"
          } >>"$GITHUB_OUTPUT"

      - name: Install the checksum-pinned Railway CLI
        run: |
          archive="${RUNNER_TEMP}/railway-v5.44.1-linux-amd64.tar.gz"
          tool_dir="${RUNNER_TEMP}/railway-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/railwayapp/cli/releases/download/v5.44.1/railway-v5.44.1-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo 'd3197e0868576e90fc1926795014c398fdfd8a8b006be07eb3e8e5215ee0a3ca  '"$archive" |
            sha256sum --check --strict
          test "$(tar -tzf "$archive")" = railway
          tar -xzf "$archive" -C "$tool_dir" railway
          chmod 0755 "$tool_dir/railway"
          echo "$tool_dir" >>"$GITHUB_PATH"
          export PATH="$tool_dir:$PATH"
          railway --version

      - name: Verify the Railway runtime contract
        id: runtime
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SNAPSHOT_SERVICE_ID }}
        run: |
          set -euo pipefail
          query_variables=$(RAILWAY_ENVIRONMENT_ID="$RAILWAY_ENVIRONMENT_ID" \
            RAILWAY_SERVICE_ID="$RAILWAY_SERVICE_ID" python3 -I -S - <<'PY'
          import json
          import os

          print(json.dumps({
              "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
              "serviceId": os.environ["RAILWAY_SERVICE_ID"],
          }, separators=(",", ":")))
          PY
          )
          railway api \
            'query Runtime($serviceId: String!, $environmentId: String!) { serviceInstance(serviceId: $serviceId, environmentId: $environmentId) { healthcheckPath healthcheckTimeout restartPolicyType domains { customDomains { domain targetPort } serviceDomains { domain targetPort } } } }' \
            --variables "$query_variables" >"${RUNNER_TEMP}/railway-runtime.json"
          RUNTIME_PATH="${RUNNER_TEMP}/railway-runtime.json" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          runtime = json.loads(Path(os.environ["RUNTIME_PATH"]).read_text())
          expected = {
              "healthcheckPath": "/healthz",
              "healthcheckTimeout": 3600,
              "restartPolicyType": "NEVER",
          }
          try:
              instance = runtime["data"]["serviceInstance"]
              domains = instance["domains"]
              custom_domains = domains["customDomains"]
              service_domains = domains["serviceDomains"]
          except (KeyError, TypeError):
              raise SystemExit("Railway runtime contract response is malformed") from None
          observed = {key: instance.get(key) for key in expected}
          if observed != expected:
              raise SystemExit("Railway runtime contract differs from bootstrap")
          if custom_domains != [] or not isinstance(service_domains, list):
              raise SystemExit("Railway snapshot service has an unexpected domain")
          if len(service_domains) != 1 or set(service_domains[0]) != {
              "domain", "targetPort"
          }:
              raise SystemExit("Railway snapshot service domain is not unique")
          domain = service_domains[0]["domain"]
          if (
              not isinstance(domain, str)
              or re.fullmatch(
                  r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.up\.railway\.app",
                  domain,
              ) is None
              or service_domains[0]["targetPort"] != 8080
          ):
              raise SystemExit("Railway snapshot service domain is invalid")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"snapshot_origin=https://{domain}\n")
          PY

      - name: Upload the exact request to the snapshot builder service
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SNAPSHOT_SERVICE_ID }}
          UPLOAD_ROOT: ${{ runner.temp }}/railway-snapshot-upload
        run: |
          set -euo pipefail
          for value in \
            "$RAILWAY_TOKEN" "$RAILWAY_PROJECT_ID" \
            "$RAILWAY_ENVIRONMENT_ID" "$RAILWAY_SERVICE_ID"; do
            test -n "$value"
          done
          deployment_json=$(railway up "$UPLOAD_ROOT" --path-as-root --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "seiche-snapshot:$GITHUB_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT")
          deployment_id=$(DEPLOYMENT_JSON="$deployment_json" python3 -I -S - <<'PY'
          import json
          import os
          import re

          payload = json.loads(os.environ["DEPLOYMENT_JSON"])
          if not isinstance(payload, dict) or set(payload) != {"deploymentId", "logsUrl"}:
              raise SystemExit("Railway upload did not return its exact deployment identity")
          deployment_id = payload.get("deploymentId")
          if not isinstance(deployment_id, str) or re.fullmatch(
              r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
              deployment_id,
          ) is None:
              raise SystemExit("Railway upload returned an invalid deployment identity")
          if (
              not isinstance(payload.get("logsUrl"), str)
              or not payload["logsUrl"].startswith("https://")
              or len(payload["logsUrl"]) > 2048
          ):
              raise SystemExit("Railway upload returned an invalid logs URL")
          print(deployment_id)
          PY
          )
          echo "deployment_id=$deployment_id" >>"$GITHUB_OUTPUT"

      - name: Wait for Railway to finish the snapshot
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SNAPSHOT_SERVICE_ID }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 360); do
            rm -f "${RUNNER_TEMP}/deployments-status.json"
            if ! railway deployment list \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --limit 100 --json >"${RUNNER_TEMP}/deployments-status.json"; then
              echo "Railway status poll $_attempt/360 failed; retrying" >&2
              sleep 10
              continue
            fi
            status=$(DEPLOYMENT_ID="$DEPLOYMENT_ID" \
              STATUS_PATH="${RUNNER_TEMP}/deployments-status.json" \
              python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          values = json.loads(Path(os.environ["STATUS_PATH"]).read_text())
          matches = [
              value for value in values
              if isinstance(value, dict) and value.get("id") == os.environ["DEPLOYMENT_ID"]
          ]
          if len(matches) != 1 or not isinstance(matches[0].get("status"), str):
              raise SystemExit("exact Railway deployment disappeared")
          deployment = matches[0]
          status = deployment["status"].upper()
          if status == "SUCCESS":
              try:
                  runtime = deployment["meta"]["serviceManifest"]["deploy"]
              except (KeyError, TypeError):
                  raise SystemExit(
                      "exact Railway deployment has no effective runtime metadata"
                  ) from None
              expected = {
                  "healthcheckPath": "/healthz",
                  "healthcheckTimeout": 3600,
                  "restartPolicyType": "NEVER",
              }
              observed = {key: runtime.get(key) for key in expected}
              if observed != expected:
                  raise SystemExit(
                      "exact Railway deployment ignored the runtime contract"
                  )
          print(status)
          PY
            )
            case "$status" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED|REMOVING)
                echo "Railway snapshot deployment ended in $status" >&2
                railway logs "$DEPLOYMENT_ID" --service "$RAILWAY_SERVICE_ID" \
                  --project "$RAILWAY_PROJECT_ID" \
                  --environment "$RAILWAY_ENVIRONMENT_ID" --lines 1000 || true
                exit 1
                ;;
              BUILDING|DEPLOYING|INITIALIZING|WAITING|QUEUED) sleep 10 ;;
              *) echo "unknown Railway deployment state: $status" >&2; exit 1 ;;
            esac
          done
          test "${status:-}" = SUCCESS

      - name: Extract and independently validate the exact Railway snapshot
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SNAPSHOT_SERVICE_ID }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          TARGET: ${{ steps.request.outputs.target }}
          TREE: ${{ steps.request.outputs.tree }}
          SOURCE_ARCHIVE_SHA256: ${{ steps.request.outputs.source_archive_sha256 }}
          EXPECTED_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          RESULT_TOKEN_PATH: ${{ runner.temp }}/railway-snapshot-result-token
          RAILWAY_SNAPSHOT_ORIGIN: ${{ steps.runtime.outputs.snapshot_origin }}
        run: |
          set -euo pipefail
          token=$(cat "$RESULT_TOKEN_PATH")
          [[ "$token" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RAILWAY_SNAPSHOT_ORIGIN" =~ ^https://[a-z0-9][a-z0-9.-]{1,251}\.up\.railway\.app$ ]]
          umask 077
          auth_header="${RUNNER_TEMP}/snapshot-authorization-header"
          printf 'Authorization: Bearer %s\n' "$token" >"$auth_header"
          unset token
          expected_health="${RUNNER_TEMP}/snapshot-expected-health.json"
          EXPECTED_HEALTH_PATH="$expected_health" \
            EXPECTED_REQUEST_ID="$EXPECTED_REQUEST_ID" \
            DEPLOYMENT_ID="$DEPLOYMENT_ID" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          health = {
              "railway_deployment_id": os.environ["DEPLOYMENT_ID"],
              "request_id": os.environ["EXPECTED_REQUEST_ID"],
              "status": "snapshot_complete",
          }
          Path(os.environ["EXPECTED_HEALTH_PATH"]).write_text(
              json.dumps(health, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          health_ready=0
          health_code=000
          for _attempt in $(seq 1 60); do
            rm -f "${RUNNER_TEMP}/snapshot-health.json"
            set +e
            health_code=$(curl --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 30 \
              --output "${RUNNER_TEMP}/snapshot-health.json" \
              --write-out '%{http_code}' \
              "$RAILWAY_SNAPSHOT_ORIGIN/healthz")
            health_status=$?
            set -e
            if [ "$health_status" -eq 0 ] && [ "$health_code" = 200 ] && \
              cmp -s "${RUNNER_TEMP}/snapshot-health.json" "$expected_health"; then
              health_ready=1
              break
            fi
            case "$health_code" in
              000|200|404|502|503) ;;
              *) echo "snapshot health returned unexpected HTTP $health_code" >&2; exit 1 ;;
            esac
            sleep 5
          done
          test "$health_ready" -eq 1
          set +e
          unauthenticated_code=$(curl --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 \
            --output "${RUNNER_TEMP}/snapshot-unauthenticated.json" \
            --write-out '%{http_code}' \
            "$RAILWAY_SNAPSHOT_ORIGIN/snapshot-result.json")
          unauthenticated_status=$?
          set -e
          test "$unauthenticated_status" -eq 0
          test "$unauthenticated_code" = 404
          UNAUTHENTICATED_PATH="${RUNNER_TEMP}/snapshot-unauthenticated.json" \
            python3 -I -S - <<'PY'
          import os
          from pathlib import Path

          if Path(os.environ["UNAUTHENTICATED_PATH"]).read_bytes() != (
              b'{"error":"not_found"}\n'
          ):
              raise SystemExit("snapshot result is not closed without its bearer")
          PY
          part="${RUNNER_TEMP}/snapshot.json.part"
          result_ready=0
          http_code=000
          for _attempt in $(seq 1 60); do
            rm -f "$part" "${RUNNER_TEMP}/snapshot-headers.txt"
            set +e
            http_code=$(curl --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 180 \
              --max-filesize 67239936 \
              --header 'Accept-Encoding: identity' \
              --header "@$auth_header" \
              --dump-header "${RUNNER_TEMP}/snapshot-headers.txt" \
              --output "$part" --write-out '%{http_code}' \
              "$RAILWAY_SNAPSHOT_ORIGIN/snapshot-result.json")
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = 200 ]; then
              result_ready=1
              break
            fi
            if [ "$http_code" = 200 ]; then
              echo "authenticated snapshot transfer failed with curl $curl_status" >&2
              exit 1
            fi
            case "$http_code" in
              000|404|502|503) sleep 5 ;;
              *) echo "authenticated snapshot result returned HTTP $http_code" >&2; exit 1 ;;
            esac
          done
          if [ "$result_ready" -ne 1 ]; then
            echo "selected Railway snapshot never reached its stable origin" >&2
            railway logs "$DEPLOYMENT_ID" --service "$RAILWAY_SERVICE_ID" \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --lines 200 || true
            exit 1
          fi
          mv "$part" "${RUNNER_TEMP}/snapshot.json"
          SNAPSHOT_PATH="${RUNNER_TEMP}/snapshot.json" \
            HEADERS_PATH="${RUNNER_TEMP}/snapshot-headers.txt" \
            python3 -I -S - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re

          body = Path(os.environ["SNAPSHOT_PATH"]).read_bytes()
          header_blocks = [
              block for block in re.split(
                  r"\r?\n\r?\n", Path(os.environ["HEADERS_PATH"]).read_text()
              )
              if block.startswith("HTTP/")
          ]
          if not header_blocks:
              raise SystemExit("snapshot response has no HTTP header block")
          lines = header_blocks[-1].splitlines()
          if not re.fullmatch(r"HTTP/\S+ 200(?: .*)?", lines[0]):
              raise SystemExit("snapshot response status line is invalid")
          headers = {}
          for line in lines[1:]:
              name, separator, value = line.partition(":")
              if separator != ":":
                  raise SystemExit("snapshot response headers are malformed")
              headers.setdefault(name.lower(), []).append(value.strip())
          expected_headers = {
              "cache-control": "no-store",
              "content-encoding": "identity",
              "content-length": str(len(body)),
              "content-type": (
                  "application/vnd.seiche.railway-snapshot-result.v1+json"
              ),
              "etag": f'"sha256:{hashlib.sha256(body).hexdigest()}"',
              "x-content-type-options": "nosniff",
          }
          for name, expected in expected_headers.items():
              if headers.get(name) != [expected]:
                  raise SystemExit(f"snapshot response {name} is invalid")
          verifier_path = Path("ops/deploy/seiche-remote-snapshot-verify.py")
          spec = importlib.util.spec_from_file_location(
              "seiche_remote_snapshot_verify", verifier_path
          )
          if spec is None or spec.loader is None:
              raise SystemExit("remote snapshot verifier cannot be loaded")
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          payload = verifier.load_canonical_snapshot(body)
          verifier.validate_remote_snapshot(
              payload,
              target=os.environ["TARGET"],
              tree=os.environ["TREE"],
              source_archive_sha256=os.environ["SOURCE_ARCHIVE_SHA256"],
          )
          expected_railway = {
              "railway_deployment_id": os.environ["DEPLOYMENT_ID"],
              "railway_project_id": os.environ["RAILWAY_PROJECT_ID"],
              "railway_environment_id": os.environ["RAILWAY_ENVIRONMENT_ID"],
              "railway_service_id": os.environ["RAILWAY_SERVICE_ID"],
          }
          for key, value in expected_railway.items():
              if payload.get(key) != value:
                  raise SystemExit(
                      f"Railway snapshot {key} differs from the selected deployment"
                  )
          if payload.get("request_id") != os.environ["EXPECTED_REQUEST_ID"]:
              raise SystemExit("Railway snapshot request id differs from this workflow run")
          PY
          sha256sum "${RUNNER_TEMP}/snapshot.json"

      - name: Upload canonical snapshot for source-free publication
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-snapshot-${{ steps.request.outputs.target }}
          path: ${{ runner.temp }}/snapshot.json
          if-no-files-found: error
          retention-days: 7

  publish-attested-snapshot:
    needs: railway-snapshot
    if: github.repository == 'beepboop2025/seiche'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ghcr-release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      artifact_digest: ${{ steps.publish.outputs.artifact_digest }}
      snapshot_sha256: ${{ steps.publish.outputs.snapshot_sha256 }}
    steps:
      - name: Download the snapshot without a source checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.railway-snapshot.outputs.evidence_artifact_id }}
          path: ${{ runner.temp }}/evidence
          digest-mismatch: error

      - name: Recheck source and Actions artifact identity before write authority
        env:
          EXPECTED_ACTIONS_DIGEST: ${{ needs.railway-snapshot.outputs.evidence_artifact_digest }}
          TARGET: ${{ needs.railway-snapshot.outputs.target }}
          TREE: ${{ needs.railway-snapshot.outputs.tree }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = beepboop2025/seiche
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$TARGET"
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIONS_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test -f "${RUNNER_TEMP}/evidence/snapshot.json"

      - name: Install the checksum-pinned OCI client
        run: |
          install -d -m 0755 "${RUNNER_TEMP}/tools"
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64' \
            --output "${RUNNER_TEMP}/tools/regctl"
          echo 'c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467  '"${RUNNER_TEMP}/tools/regctl" |
            sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/tools/regctl"
          echo "${RUNNER_TEMP}/tools" >>"$GITHUB_PATH"

      - name: Log in only after the source-free evidence checks pass
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the canonical snapshot as one immutable OCI artifact
        id: publish
        env:
          TARGET: ${{ needs.railway-snapshot.outputs.target }}
        run: |
          set -euo pipefail
          snapshot="${RUNNER_TEMP}/evidence/snapshot.json"
          reference="${ARTIFACT_REPOSITORY}:sha-${TARGET}"
          regctl artifact put \
            --artifact-type application/vnd.seiche.railway-snapshot-result.v1 \
            --file-media-type application/vnd.seiche.railway-snapshot-result.v1+json \
            --file "$snapshot" --file-title --strip-dirs "$reference"
          artifact_digest=$(regctl image digest "$reference")
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(regctl image digest "${ARTIFACT_REPOSITORY}@${artifact_digest}")" = \
            "$artifact_digest"
          regctl artifact get --file snapshot.json \
            "${ARTIFACT_REPOSITORY}@${artifact_digest}" \
            >"${RUNNER_TEMP}/roundtrip-snapshot.json"
          cmp "$snapshot" "${RUNNER_TEMP}/roundtrip-snapshot.json"
          snapshot_sha256=$(sha256sum "$snapshot" | awk '{print $1}')
          {
            echo "artifact_digest=$artifact_digest"
            echo "snapshot_sha256=$snapshot_sha256"
          } >>"$GITHUB_OUTPUT"

      - name: OIDC-attest the exact OCI manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.ARTIFACT_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.artifact_digest }}
          push-to-registry: true
          create-storage-record: false

  prove-public:
    needs: [railway-snapshot, publish-attested-snapshot]
    if: github.repository == 'beepboop2025/seiche'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Install checksum-pinned public verification tools
        run: |
          tool_dir="${RUNNER_TEMP}/tools"
          mkdir -p "$tool_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64' \
            --output "$tool_dir/regctl"
          echo 'c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467  '"$tool_dir/regctl" |
            sha256sum --check --strict
          gh_archive="${RUNNER_TEMP}/gh_2.98.0_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz' \
            --output "$gh_archive"
          echo '3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de  '"$gh_archive" |
            sha256sum --check --strict
          tar --extract --gzip --file "$gh_archive" --strip-components=2 \
            --directory "$tool_dir" gh_2.98.0_linux_amd64/bin/gh
          chmod 0755 "$tool_dir/regctl" "$tool_dir/gh"
          echo "$tool_dir" >>"$GITHUB_PATH"

      - name: Prove anonymous snapshot and exact workflow provenance
        env:
          ARTIFACT_DIGEST: ${{ needs.publish-attested-snapshot.outputs.artifact_digest }}
          SNAPSHOT_SHA256: ${{ needs.publish-attested-snapshot.outputs.snapshot_sha256 }}
          TARGET: ${{ needs.railway-snapshot.outputs.target }}
        run: |
          set -euo pipefail
          anonymous="${RUNNER_TEMP}/anonymous-docker"
          mkdir -p "$anonymous"
          printf '{"auths":{}}\n' >"$anonymous/config.json"
          reference="${ARTIFACT_REPOSITORY}@${ARTIFACT_DIGEST}"
          test "$(DOCKER_CONFIG="$anonymous" regctl image digest \
            "${ARTIFACT_REPOSITORY}:sha-${TARGET}")" = "$ARTIFACT_DIGEST"
          DOCKER_CONFIG="$anonymous" regctl artifact get --file snapshot.json \
            "$reference" >"${RUNNER_TEMP}/public-snapshot.json"
          echo "${SNAPSHOT_SHA256}  ${RUNNER_TEMP}/public-snapshot.json" |
            sha256sum --check --strict
          env -u GITHUB_TOKEN \
            GH_TOKEN=public-oci-bundle-verification-no-api \
            DOCKER_CONFIG="$anonymous" \
            gh attestation verify "oci://$reference" \
              --bundle-from-oci \
              --repo beepboop2025/seiche \
              --signer-workflow beepboop2025/seiche/.github/workflows/railway-snapshot-prebuild.yml \
              --signer-digest "$TARGET" \
              --source-ref refs/heads/main \
              --source-digest "$TARGET" \
              --deny-self-hosted-runners \
              --format json >"${RUNNER_TEMP}/attestation.json"
          ATTESTATION="${RUNNER_TEMP}/attestation.json" python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          results = json.loads(Path(os.environ["ATTESTATION"]).read_text())
          if not isinstance(results, list) or not results:
              raise SystemExit("public attestation verification is empty")
          PY
