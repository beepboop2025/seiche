name: Publish to MCP Registry

# The official MCP Registry authenticates this repo's identity through
# GitHub's OIDC token (mcp-publisher login github-oidc), so no secret is
# created, stored or pasted anywhere. Publishes server.json only from an
# explicitly requested, signed release tag. PulseMCP re-ingests the official registry
# weekly and Glama syncs connectors from it, so landing here propagates to
# those directories for free.
#
# The publisher binary is version-pinned and sha256-verified: this job
# holds an OIDC id-token, so executing an unpinned "latest" download here
# would hand namespace publish rights to whoever controls the next
# release. Bump the version and hash together, from
# registry_<ver>_checksums.txt on the release.
#
# Run it with: gh workflow run registry-publish.yml -f release_tag=v0.11.0

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable SSH-signed release tag, for example v0.11.0"
        required: true
        type: string

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Bind and verify the annotated SSH-signed release
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("backend/pyproject.toml").read_text())["project"]["version"]
          server = json.loads(Path("server.json").read_text())
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("release tag does not match the package version")
          if server.get("version") != version:
              raise SystemExit("server.json does not match the package version")
          if server.get("packages", [{}])[0].get("version") != version:
              raise SystemExit("server.json package does not match the package version")
          PY
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          release_sha="$(git rev-parse HEAD)"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$release_sha"
          test "$(git show -s --format=%ae HEAD)" = "beepboop2025@users.noreply.github.com"
          git -c gpg.ssh.allowedSignersFile=ops/deploy/release-allowed-signers \
            verify-commit HEAD
          git -c gpg.ssh.allowedSignersFile=ops/deploy/release-allowed-signers \
            verify-tag "$RELEASE_TAG"

      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          curl -sSLo mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate by OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
