name: Publish to MCP Registry

# The official MCP Registry authenticates this repo's identity through
# GitHub's OIDC token (mcp-publisher login github-oidc), so no secret is
# created, stored or pasted anywhere. Publishes whatever version the
# committed server.json carries. PulseMCP re-ingests the official registry
# weekly and Glama syncs connectors from it, so landing here propagates to
# those directories for free.
#
# Run it with: gh workflow run registry-publish.yml

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate by OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
