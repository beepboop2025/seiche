      <h1>Seiche · money, forex and capital-market intelligence</h1>
      <p>Seiche is free, open source software (AGPL-3.0-or-later) that connects US dollar funding, a licence-aware global money-market Atlas, public FX references, bounded derived macro-capital transmission and four release-reviewed metadata-only NBS China macro identities. The China structural catalog is unsigned; only a restricted response carries verified Seiche owner-attested provenance. Its public contracts expose applicable source clocks, evidence and rights states, explicit gaps, the countercase and an honest as-published record.</p>
