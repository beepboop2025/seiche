[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "seiche-agent-network"
version = "0.1.0"
description = "Permissioned financial-agent identities, contacts and durable evidence conversations"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography>=44,<51",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-asyncio>=0.24,<2"]

[project.scripts]
seiche-agent-network = "seiche_agent_network.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seiche_agent_network"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
