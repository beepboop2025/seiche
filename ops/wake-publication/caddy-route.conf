# Insert inside api.seiche.info before generic API handlers.
# An exact path prevents traversal to any private Wake pack.
@public_institutional_flows path /api/public-institutional-flows.json
handle @public_institutional_flows {
    @read_only method GET HEAD
    handle @read_only {
        header Cache-Control "no-store"
        rewrite * /public-institutional-flows.json
        root * /var/lib/seiche-wake-public
        file_server
    }
    respond "Method Not Allowed" 405
}
