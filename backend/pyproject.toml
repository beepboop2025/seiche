[project]
name = "seiche"
version = "0.11.1"
description = "Funding-stress and leveraged-positioning research terminal with public, credentialed-official, licensed, and fail-closed market-data boundaries."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Mrinal", email = "beepboop2025@users.noreply.github.com" },
]
maintainers = [
    { name = "Seiche maintainers", email = "beepboop2025@users.noreply.github.com" },
]
keywords = [
    "capital-markets",
    "financial-data",
    "funding-liquidity",
    "mcp",
    "model-context-protocol",
    "money-markets",
    "open-data",
    "research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# 3.12+ only: the MCP bridge calls the async assembler via asyncio.run() per
# call, and on 3.10/3.11 the module-level asyncio.Lock in assemble.py raises
# "bound to a different event loop" across loops. 3.12 relaxed that binding;
# prod runs 3.12. Keep this floor so a PyPI install can't land on 3.11.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",        # microseism MLE (was transitive via sklearn; now direct)
    "arch>=7",            # regatta: Model Confidence Set bootstrap
    "cryptography>=42",   # attest: Ed25519 signing of the as-published record
    "tzdata>=2025.2",     # IANA market timezones on hosts without a system zoneinfo database
    "holidays>=0.76",     # dated national/settlement holidays; never assume Mon-Fri globally
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx2>=2.0.0",  # supported transport for Starlette's TestClient
    "pytest-memray>=1.7; sys_platform != 'win32'",
    "pytest-pystack>=1.0; sys_platform == 'linux'",
]
# The production box runs a focused pytest smoke before restart. Keep its
# runtime lean, but declare every plugin that smoke imports instead of relying
# on packages left behind by an older developer install.
deploy-test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx2>=2.0.0",
]
notary = ["opentimestamps>=0.4"]   # Bitcoin anchoring for the record ledger
collectors = [
    "pyarrow>=16",                 # immutable normalized Parquet partitions
    "openpyxl>=3.1",               # official RBA/RBNZ workbook adapters
]
postgres = ["psycopg[binary]>=3.2"]  # canonical observation metadata + sealed snapshots

[project.scripts]
seiche = "seiche.cli:main"
seiche-mcp = "seiche.mcp_server:main"

[project.urls]
Homepage = "https://seiche.info"
Documentation = "https://seiche.info/developers"
Source = "https://github.com/beepboop2025/seiche"
Issues = "https://github.com/beepboop2025/seiche/issues"
Changelog = "https://github.com/beepboop2025/seiche/blob/main/CHANGELOG.md"
"MCP server" = "https://api.seiche.info/mcp"

[build-system]
requires = [
    "hatchling==1.32.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.6.1.19",
]
build-backend = "hatchling.build"

[tool.hatch.build]
reproducible = true

[tool.hatch.build.targets.wheel]
packages = ["seiche"]
exclude = ["/seiche/dispatches/**"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
only-include = ["seiche"]
exclude = [
    "/seiche/dispatches/**",
]
core-metadata-version = "2.4"
